<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1126">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>灰港当铺</title>
<style>
:root{
  --bg0:#04060d;--card:#121a36;--line:#2b3970;--text:#e8edff;--dim:#8d9bc8;
  --cyan:#4de1ff;--gold:#ffc857;--green:#58e6a0;--red:#ff5d7a;--pink:#ff7ad9;--violet:#a78bfa;--ink:#0a1024;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--text);overflow:hidden;
  font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:15px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#16204a 0,#04060d 60%)}
.num{font-family:"DIN Alternate","Bahnschrift","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
.ic{width:1.15em;height:1.15em;flex:none}

#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overflow:clip;
  background:linear-gradient(180deg,#0d1430,#080c1c)}
@media (min-width:560px) and (min-height:700px){
  #app{height:min(100dvh,900px);border-radius:30px;border:1px solid var(--line);box-shadow:0 30px 80px #000c,0 0 0 8px #0b1126}
}

/* ---------- HUD ---------- */
#hud{flex:none;padding:calc(8px + var(--sat)) 12px 8px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#141d42,#0e1532);border-bottom:1px solid var(--line);z-index:5}
.hud-top{display:flex;align-items:center;gap:10px}
.day{display:flex;align-items:baseline;gap:3px;font-weight:800}
.day b{font-size:17px}.day span{color:var(--dim);font-size:12px;font-weight:600}
.queue{display:flex;gap:4px;margin-right:auto;align-items:center}
.queue i{width:8px;height:8px;border-radius:50%;border:1.5px solid #4a5a94}
.queue i.done{background:#4a5a94}
.queue i.now{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.hbtn{position:relative;height:34px;min-width:34px;padding:0 10px;border-radius:10px;background:#1b2752;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700}
.hbtn:active{transform:scale(.95)}
.hbtn .dot{position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.hud-stats{display:grid;grid-template-columns:1.25fr 1.15fr .8fr 1fr;gap:6px}
.stat{background:#0a1028;border:1px solid #1f2a58;border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;min-width:0}
.stat small{font-size:10.5px;color:var(--dim)}
.stat b{font-size:16px;line-height:1.25;white-space:nowrap}
.stat.money b{color:var(--gold)}.stat.debt b{color:var(--red)}
.pips{display:flex;gap:3px;align-items:center;height:20px}
.pips i{width:7px;height:13px;border-radius:2px;background:#26315f}
.pips i.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}

/* ---------- Scene ---------- */
#scene{position:relative;flex:1 1 0;min-height:112px;overflow:hidden;background:#0c1026}
#scene{background:
  linear-gradient(90deg,transparent calc(14% - 1px),#242e60 calc(14% - 1px),#242e60 calc(14% + 1px),transparent calc(14% + 1px)),
  linear-gradient(90deg,transparent calc(34% - 1px),#242e60 calc(34% - 1px),#242e60 calc(34% + 1px),transparent calc(34% + 1px)),
  linear-gradient(90deg,transparent calc(66% - 1px),#242e60 calc(66% - 1px),#242e60 calc(66% + 1px),transparent calc(66% + 1px)),
  linear-gradient(90deg,transparent calc(86% - 1px),#242e60 calc(86% - 1px),#242e60 calc(86% + 1px),transparent calc(86% + 1px)),
  #1c2450}
#scene .wall{position:absolute;left:0;right:0;bottom:0;width:100%;aspect-ratio:4/3;max-height:100%}
.signbox{position:absolute;left:50%;top:9px;transform:translateX(-50%);padding:3px 14px 4px 20px;border:3px solid var(--pink);border-radius:11px;background:#0a102488;color:#ffe3f8;font-size:20px;font-weight:800;letter-spacing:6px;box-shadow:0 0 12px var(--pink),inset 0 0 8px #ff7ad966;text-shadow:0 0 8px var(--pink);white-space:nowrap}
.cone{position:absolute;left:0;right:0;top:48px;bottom:0;background:radial-gradient(ellipse 70% 100% at 50% 0,#ffe9b04d,transparent 75%);clip-path:polygon(50% 0,4% 100%,96% 100%)}
.neon{animation:neon 5s infinite}
@keyframes neon{0%,91%,95%,100%{opacity:1}93%{opacity:.45}}
.tw{animation:tw 3s infinite}.tw.b{animation-delay:1.2s}
@keyframes tw{50%{opacity:.25}}
#chWrap{position:absolute;left:0;right:0;bottom:30px;top:6px;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.ch{height:100%;max-height:300px;width:auto;aspect-ratio:200/232;overflow:visible;filter:drop-shadow(0 6px 10px #0008);transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.018) translateY(-1px)}}
.chbox{height:100%;display:flex;align-items:flex-end}
.chbox.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{transform:translateX(-70%);opacity:0}}
.chbox.exit{animation:exit .6s ease-in forwards}
@keyframes exit{to{transform:translateX(90%);opacity:0}}
.chbox.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.chbox.hop{animation:hop .5s}
@keyframes hop{35%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}}
.ch.ghost{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.ch .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.ch .mo,.ch .brow,.ch .sweat{display:none}
.ch[data-mood=neutral] .mo-neutral,.ch[data-mood=happy] .mo-happy,.ch[data-mood=angry] .mo-angry,.ch[data-mood=nervous] .mo-nervous{display:block}
.ch[data-mood=angry] .brow,.ch[data-mood=nervous] .sweat{display:block}
.ch .sweat{animation:drip 1.4s infinite}
@keyframes drip{from{transform:translateY(-4px);opacity:0}30%{opacity:1}to{transform:translateY(14px);opacity:0}}
.ch .tent path{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 0;transform-box:fill-box}
.ch .tent path:nth-child(4n+1),.ch .tent path:nth-child(4n+2){animation-delay:-.9s}
@keyframes sway{50%{transform:rotate(5deg)}}
.ch .led{animation:tw 1.2s infinite}

.counter{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,#5b4a8a 0,#4a3b78 9px,#2a2150 9px,#1b1538 100%);border-top:2px solid #8f7fd0;box-shadow:0 -8px 22px #0007;display:flex;align-items:center;padding:8px 12px 0}
.counter:after{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:#0a102466}
#plate{display:flex;align-items:center;gap:6px;font-size:12px;background:#0a1024cc;border:1px solid #6f61ad;border-radius:8px;padding:3px 8px;max-width:66%;white-space:nowrap;overflow:hidden}
#plate b{font-size:13px;overflow:hidden;text-overflow:ellipsis}
#plate span{color:var(--dim)}
.pers{padding:1px 6px;border-radius:99px;font-size:11px;font-weight:700;color:var(--ink);font-style:normal}
#ctItem{position:absolute;right:16px;bottom:30px;width:62px;height:62px;z-index:2;filter:drop-shadow(0 5px 4px #000a)}
#ctItem.drop{animation:drop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-60px) rotate(-14deg);opacity:0}}
#pat{position:absolute;right:10px;top:8px;display:flex;align-items:center;gap:4px;background:#0a1024b0;border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:11px;color:var(--dim)}
#pat i{width:9px;height:9px;border-radius:50%;background:#2a3566}
#pat i.on{background:var(--green);box-shadow:0 0 6px var(--green)}
#pat.low i.on{background:var(--red);box-shadow:0 0 6px var(--red)}
#pat i.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.9)}}
#want{position:absolute;left:10px;top:8px;background:#0a1024b0;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.stamp{position:absolute;left:14px;top:26%;font-size:26px;font-weight:900;letter-spacing:4px;padding:4px 10px 4px 14px;border:4px solid;border-radius:10px;transform:rotate(-14deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1);z-index:3;background:#0a102499}
.stamp.deal{color:var(--red);border-color:var(--red)}.stamp.left{color:#9aa6cc;border-color:#9aa6cc}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.6);opacity:0}}

/* ---------- Bubble + item card ---------- */
#bubble{flex:none;position:relative;margin:10px 12px 0;background:#f4f1e6;color:#1a1a2e;border-radius:14px;padding:9px 12px;min-height:44px;font-size:15px;line-height:1.45;box-shadow:0 3px 0 #b9b39d}
#bubble:before{content:"";position:absolute;left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#f4f1e6}
#bubble.sys{background:#18224a;color:#b9c4ea;box-shadow:0 3px 0 #0a1028;font-size:13.5px}
#bubble.sys:before{display:none}
#bubble .tell{display:block;font-size:12.5px;color:#b0306f;font-style:italic;margin-top:2px}
#icard{flex:none;margin:8px 12px 0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
#icard:empty{display:none}
.ibox{position:relative;width:54px;height:54px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 35%,#27336a,#0c1230);border:1.5px solid #3a4a8a;padding:5px;overflow:hidden}
.ibox.big{width:96px;height:96px;padding:10px;border-radius:18px}
.ibox.fake{border-color:var(--red);background:radial-gradient(circle at 50% 35%,#5a1f33,#1c0c18)}
.ibox.rare{border-color:var(--pink);box-shadow:0 0 14px #ff7ad988}
.ibox.ok{border-color:var(--green)}
.ibox.scanning:after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,#4de1ffcc);animation:scanline .65s linear}
@keyframes scanline{to{top:100%}}
.isv{width:100%;height:100%;overflow:visible}
.isv.used{filter:saturate(.85)}
.isv.worn{filter:saturate(.55) brightness(.82)}
.imeta{flex:1;min-width:0}
.imeta b{font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imeta .sub{font-size:12px;color:var(--dim);margin-top:2px}
.est{color:var(--cyan);font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin:2px 4px 0 0;background:#ffffff14;color:var(--dim)}
.tag.fake{color:#fff;background:var(--red)}.tag.ok{color:var(--ink);background:var(--green)}
.tag.stolen{color:var(--ink);background:var(--gold)}.tag.rare{color:var(--ink);background:var(--pink)}
.iact{display:flex;gap:6px}
.rbtn{width:46px;height:46px;border-radius:13px;background:#1b2752;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;gap:1px;color:var(--cyan)}
.rbtn .ic{width:19px;height:19px}
.rbtn:disabled{opacity:.35}
.rbtn:active:not(:disabled){transform:scale(.93)}

/* ---------- Panel ---------- */
#panel{flex:none;padding:10px 12px calc(12px + var(--sab));display:flex;flex-direction:column;gap:9px;min-width:0}
#panel>*{min-width:0}
.tip{font-size:12.5px;color:var(--dim);line-height:1.5;text-align:center}
.tip b{color:var(--gold)}
.row{display:flex;gap:8px}
.grow{flex:1}
.btn{min-height:50px;border-radius:15px;padding:0 14px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;background:#22306a;box-shadow:0 4px 0 #111a40;border:1px solid #3a4a8a;transition:transform .06s,box-shadow .06s;line-height:1.15}
.btn small{font-size:11px;font-weight:600;opacity:.75;display:block}
.btn .col{display:flex;flex-direction:column;align-items:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #111a40}
.btn:disabled{opacity:.4}
.btn.pri{background:linear-gradient(180deg,#6eeaff,#2ab8de);color:#04222e;border-color:#b6f5ff;box-shadow:0 4px 0 #136583}
.btn.pri:active:not(:disabled){box-shadow:0 1px 0 #136583}
.btn.good{background:linear-gradient(180deg,#7df0b4,#35c783);color:#04291a;border-color:#c4ffe0;box-shadow:0 4px 0 #1a7a4d}
.btn.good:active:not(:disabled){box-shadow:0 1px 0 #1a7a4d}
.btn.warn{background:linear-gradient(180deg,#ffd98a,#f0a93a);color:#3a2300;border-color:#ffebbd;box-shadow:0 4px 0 #9a6412}
.btn.sq{width:50px;padding:0;flex:none;color:var(--dim)}
.btn.sm{min-height:38px;font-size:13px;border-radius:11px;padding:0 11px;box-shadow:0 3px 0 #111a40}
.pctl{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.step{height:48px;border-radius:14px;background:#1b2752;border:1px solid var(--line);font-size:26px;font-weight:700;line-height:1;color:var(--cyan);box-shadow:0 3px 0 #0d1433}
.step:active{transform:translateY(2px);box-shadow:0 1px 0 #0d1433}
.pbox{height:48px;border-radius:14px;background:#070b1c;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.pbox small{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim)}
.pbox input{width:120px;background:none;border:0;outline:0;color:var(--gold);font-size:25px;font-weight:800;text-align:center;font-family:"DIN Alternate","Bahnschrift","Segoe UI",system-ui,sans-serif;-webkit-user-select:text;user-select:text;padding:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cyan) var(--f,50%),#26315f var(--f,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-10px;background:#fff;border:4px solid var(--cyan);box-shadow:0 2px 6px #0009}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#26315f}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--cyan)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--cyan)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{height:34px;border-radius:10px;background:#141d42;border:1px solid var(--line);font-size:13px;font-weight:700;color:#c3cdf2;display:flex;align-items:center;justify-content:center;gap:4px}
.chip:active:not(:disabled){background:#22306a;color:#fff}
.chip:disabled{opacity:.35;text-decoration:line-through}
.chip.sel{background:var(--cyan);color:var(--ink);border-color:#fff}
.result{border-radius:13px;padding:10px 12px;text-align:center;font-weight:700;font-size:14.5px;line-height:1.4}
.result.deal{background:#0f3324;border:1px solid var(--green);color:#b6ffd8}
.result.left{background:#2a1422;border:1px solid #7a2a44;color:#ffb9c6}
.picker{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.picker::-webkit-scrollbar{display:none}
.tile{flex:none;width:92px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
.tile .ibox{width:50px;height:50px}
.tile b{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{color:var(--cyan);font-weight:700;font-size:11px}
.tile.match{border-color:var(--gold);box-shadow:0 0 12px #ffc85755}
.tile:disabled{opacity:.35}
.tile:active:not(:disabled){transform:scale(.95)}

/* ---------- Sheets / overlays ---------- */
#shade{position:absolute;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#shade.show{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;z-index:41;background:#0f1634;border-top:1px solid var(--cyan);border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s;display:flex;flex-direction:column;box-shadow:0 -10px 40px #000a}
#sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s}
#sheet .grab{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
#sheet .grab h2{margin:0;font-size:16px}
#sheet .body{overflow:auto;padding:8px 14px calc(18px + var(--sab));-webkit-overflow-scrolling:touch}
.xbtn{width:34px;height:34px;border-radius:50%;background:#1b2752;display:grid;place-items:center;color:var(--dim)}
.invrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.invrow.match{border-color:var(--gold)}
.invrow .top{display:flex;gap:10px;align-items:center}
.invrow .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.invrow .acts .btn{flex:1 1 auto}
.empty{border:1.5px dashed #2b3970;border-radius:14px;padding:12px;text-align:center;color:#4a5a94;font-size:13px;margin-bottom:8px}
.order{background:linear-gradient(135deg,#3a2a08,#1c1a36);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.55;color:#f1e3bd}
.order b{color:var(--gold)}
.order .ic{display:inline-block;vertical-align:-3px;color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv span:nth-child(odd){color:var(--dim)}
.logrow{font-size:13px;padding:6px 0;border-bottom:1px solid #ffffff0c;color:var(--dim)}
.logrow.g{color:var(--green)}.logrow.r{color:#ff9bb0}.logrow.y{color:var(--gold)}
.menu .btn{width:100%;margin-bottom:10px;justify-content:flex-start}
.help p{line-height:1.7;color:#c9d3f5;margin:0 0 10px;font-size:14px}
.help b{color:var(--gold)}

#overlay{position:absolute;inset:0;z-index:30;background:linear-gradient(180deg,#0d1430,#070a18);display:none;flex-direction:column}
#overlay.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#overlay .scroll{flex:1;overflow:auto;padding:calc(18px + var(--sat)) 16px 16px;-webkit-overflow-scrolling:touch}
#overlay .foot{flex:none;padding:10px 16px calc(14px + var(--sab));border-top:1px solid var(--line);background:#0b1126;display:flex;gap:8px}
h1{margin:0;font-size:24px;letter-spacing:1px}
h3{margin:20px 0 8px;font-size:14px;color:var(--cyan);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.sub{color:var(--dim);font-size:13px}
.pl{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;font-weight:800;font-size:15px}
.pl.up{background:#0f3324;color:var(--green)}.pl.dn{background:#2a1422;color:var(--red)}
.ev{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13.5px;line-height:1.5}
.ev .ic{width:22px;height:22px;margin-top:1px;color:var(--cyan)}
.ev.bad{border-left-color:var(--red)}.ev.bad .ic{color:var(--red)}
.ev.good{border-left-color:var(--green)}.ev.good .ic{color:var(--green)}
.ev.warn{border-left-color:var(--gold)}.ev.warn .ic{color:var(--gold)}
.bank{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.bar{height:10px;border-radius:5px;background:#26315f;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:5px}
.bank .line{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.bank .line b{color:var(--text)}
.upg{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:8px}
.upg .uic{width:40px;height:40px;border-radius:11px;background:#1b2752;display:grid;place-items:center;color:var(--cyan);flex:none}
.upg .uic .ic{width:22px;height:22px}
.upg .ut{flex:1;min-width:0;font-size:12.5px;color:var(--dim)}
.upg .ut b{display:block;font-size:14.5px;color:var(--text)}
.upg.owned{opacity:.5}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) 22px 10px;text-align:center;gap:6px;overflow:auto}
.logo{font-size:46px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--pink),0 0 46px var(--pink);margin:0 0 0 8px;animation:neon 6s infinite}
.logo-sub{letter-spacing:5px;color:var(--cyan);font-size:11.5px;font-weight:700}
.lineup{display:flex;justify-content:center;align-items:flex-end;height:150px;margin:14px 0 4px;width:100%;border-bottom:3px solid #8f7fd0;flex:none}
.lineup .ch{height:130px;max-height:none;margin:0 -8px}
.lineup .ch:nth-child(2){height:150px}
.story{line-height:1.75;color:#c9d3f5;font-size:14px;text-align:left;margin:8px 0}
.story b{color:var(--gold)}
.end-ch{width:150px;height:174px;margin:0 auto;flex:none}
.grade{font-size:64px;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 0 24px #ffc857aa}
#toast{position:absolute;left:0;right:0;top:calc(100px + var(--sat));z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#0a1024f2;border:1px solid var(--cyan);border-radius:16px;padding:8px 16px;font-size:13.5px;font-weight:700;max-width:90%;text-align:center;animation:toast 3s forwards;box-shadow:0 6px 20px #000a}
.toast.bad{border-color:var(--red);color:#ffc2cd}.toast.good{border-color:var(--green);color:#c2ffe0}.toast.warn{border-color:var(--gold);color:#ffe9b8}
@keyframes toast{0%{transform:translateY(-12px);opacity:0}7%,85%{transform:none;opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.fly{position:absolute;z-index:61;font-weight:900;font-size:24px;pointer-events:none;animation:fly 1.1s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.hbtn.al{font-size:12px;padding:0 9px;gap:4px;color:var(--dim)}
.hbtn.al.law{color:var(--cyan);border-color:var(--cyan)}
.hbtn.al.dark{color:var(--pink);border-color:var(--pink)}
#showcase{position:absolute;left:10px;bottom:54px;width:56px;z-index:1;display:flex;flex-direction:column;align-items:center;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#ffffff1c,#ffffff06);border:1.5px solid #9fb4ff88;box-shadow:0 0 12px #9fb4ff44,inset 0 0 10px #ffffff14;padding:4px 5px 2px}
#showcase svg{width:42px;height:42px}
#showcase span{font-size:9.5px;color:#cfd8ff;font-weight:700;letter-spacing:1px;margin-top:1px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices .btn{justify-content:space-between;text-align:left;min-height:50px}
.choices .btn small{font-size:12px;opacity:.85}
.profs{display:flex;flex-direction:column;gap:10px}
.prof{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 12px}
.prof:active{border-color:var(--cyan);transform:scale(.98)}
.prof .uic{width:44px;height:44px;border-radius:12px;background:#1b2752;display:grid;place-items:center;color:var(--cyan);flex:none}
.prof .uic .ic{width:24px;height:24px}
.prof b{display:block;font-size:16px;margin-bottom:2px}
.prof span{font-size:13px;color:var(--dim);line-height:1.5}
.albar{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--pink),#26315f 42%,#26315f 58%,var(--cyan));margin:16px 4px 6px}
.albar i{position:absolute;top:-5px;width:6px;height:22px;border-radius:3px;background:#fff;box-shadow:0 0 8px #fff;transform:translateX(-50%)}
.alscale{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:0 4px 12px}
@media (max-height:640px){
  #bubble{font-size:14px;margin-top:8px;padding:7px 10px}
  .btn{min-height:46px}.step,.pbox{height:44px}
  #icard{padding:6px}#icard .ibox{width:46px;height:46px}
  #panel{gap:7px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
.hud-stats{grid-template-columns:1.1fr 1.05fr 1fr 1.05fr}
.stat{position:relative}
.stat[data-act]{cursor:pointer}
.stat[data-act]:active{background:#141d42}
.stat small i{font-style:normal;color:var(--gold);font-size:9.5px;letter-spacing:-1px;margin-left:3px}
.pips.many i{width:5px}
.bump{position:absolute;right:6px;top:3px;font-size:13px;font-weight:900;pointer-events:none;animation:bump 1.5s ease-out forwards;text-shadow:0 1px 4px #000}

.ev.rv{animation:rv .4s ease-out backwards}

.ev .evb{flex:1;min-width:0}

.recap{display:flex;width:100%;gap:8px;align-items:center;margin:10px 0 0;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13.5px;font-weight:700;text-align:left}

.tip.hot{color:#ffe9b8;background:#3a2a08;border:1px solid var(--gold);border-radius:11px;padding:7px 10px;text-align:left}
.tag.legend{color:#3a2300;background:linear-gradient(90deg,#ffe08a,#ff9fe0)}
.tag.sus{color:var(--ink);background:#ff9d5d}
.tag.up{color:var(--green);background:#0f3324}.tag.dn{color:#ff9bb0;background:#2a1422}
.chip.hint{border-color:var(--gold);color:#ffe9b8}
#plate[data-act]{cursor:pointer}
.ibox.legend{border-color:var(--gold);box-shadow:0 0 14px #ffc857aa}
.order.hot{border-color:var(--red);background:linear-gradient(135deg,#3a1420,#1c1a36);color:#ffd5dc}
.order.hot b{color:#ff9bb0}.order.hot .ic{color:var(--red)}
.tiers{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.tier{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:1.45;color:var(--dim)}
.tier b{color:var(--text);font-size:14px;flex:none;width:84px}
.tier b small{color:var(--dim);font-weight:600;font-size:11.5px}
.tier i{font-style:normal;color:var(--gold);flex:none;width:56px;font-size:11px;letter-spacing:-1px}
.tier.cur{border-color:var(--gold);background:#2a2208;color:#f1e3bd}
.rlog{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px solid #ffffff0c;color:var(--dim)}
.rlog b.g{color:var(--green)}.rlog b.r{color:var(--red)}
.lgs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.lg{aspect-ratio:1;border-radius:11px;background:#0c1230;border:1.5px dashed #2b3970;padding:5px;opacity:.35;filter:grayscale(1)}
.lg.got{opacity:1;filter:none;border:1.5px solid var(--gold);box-shadow:0 0 10px #ffc85766}

"use strict";

/* 工具函数、金额显示、存储、音效、提示、弹层 */
const $=s=>document.querySelector(s);

const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+f(x),0);
function wpick(list,w){ // w: 函数或权重数组
  const ws=list.map((x,i)=>typeof w==='function'?Math.max(0,w(x,i)):Math.max(0,w[i]));
  let r=Math.random()*sum(ws);
  for(let i=0;i<list.length;i++){r-=ws[i];if(r<0)return list[i];}
  return list[list.length-1];
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 金额：₡ + 缩写 k / m / b，保留两三位有效数字 */
function abbr(n){
  const a=Math.abs(n),s=n<0?'−':'';
  if(a<1000)return s+Math.round(a);
  const u=a>=1e9?['b',1e9]:a>=1e6?['m',1e6]:['k',1e3];
  const v=a/u[1],d=v>=100?0:v>=10?1:2;
  return s+(+v.toFixed(d)).toString()+u[0];
}
const fmt=n=>'₡'+abbr(n);
const fmtFull=n=>(n<0?'−':'')+'₡'+Math.round(Math.abs(n)).toLocaleString('en-US');
/* 价格取整到好读的数 */
function niceRound(v){
  if(v<20)return Math.max(1,Math.round(v));
  const e=Math.pow(10,Math.floor(Math.log10(v))-1);
  return Math.round(v/e)*e;
}
/* 滑块一格：约为价格的 1% */
const stepOf=v=>{const s=Math.max(1,v*.01);const e=Math.pow(10,Math.floor(Math.log10(s)));return Math.max(1,Math.round(s/e)*e);};

const say=(arr,o={})=>(Array.isArray(arr)?pick(arr):arr).replace(/\{(\w+)\}/g,(_,k)=>k==='p'?fmt(o.p):(o[k]??''));

const ls={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
};
const jget=(k,d)=>{try{const v=JSON.parse(ls.get(k));return v==null?d:v}catch(e){return d}};

/* ---------- 音效 ---------- */
let AC,SET=jget('huigang-set',{mute:false,tut:true,diff:'normal'});
const saveSet=()=>ls.set('huigang-set',JSON.stringify(SET));
function beep(f=440,d=.08,type='square',v=.035,delay=0){
  if(SET.mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const buzz=p=>{try{if(navigator.vibrate&&navigator.userActivation&&navigator.userActivation.hasBeenActive)navigator.vibrate(p)}catch(e){}};
const sfx={
  coin(){beep(988,.08,'square',.03);beep(1319,.16,'square',.03,.08);buzz(20)},
  bad(){beep(200,.2,'sawtooth',.03);beep(140,.25,'sawtooth',.03,.12);buzz([30,40,30])},
  good(){beep(660,.07,'triangle',.05);beep(880,.1,'triangle',.05,.07)},
  scan(){for(let i=0;i<6;i++)beep(600+i*160,.05,'sine',.03,i*.09)},
  door(){beep(330,.08,'triangle',.05);beep(494,.12,'triangle',.05,.08)},
  click(){beep(700,.03,'square',.02)},
  tick(){beep(1100,.015,'square',.012)},
  big(){[523,659,784,1047].forEach((f,i)=>beep(f,.14,'triangle',.05,i*.1));buzz([20,30,20])},
};

/* ---------- 提示 ---------- */
function toast(t,cls=''){
  const box=$('#toast');if(!box)return;
  const d=document.createElement('div');d.className='toast '+cls;d.textContent=t;box.appendChild(d);
  while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>d.remove(),3100);
}
function bump(sel,txt,good){
  const el=$(sel);if(!el)return;const b=document.createElement('span');b.className='bump '+(good?'g':'r');b.textContent=txt;
  el.appendChild(b);setTimeout(()=>b.remove(),1500);
}

function drawChar(look,mood='neutral',cls=''){

  const su=K&&K.suit?K.suit:[look.sh,38,32];
  const k={c:`hsl(${hs} ${cl}%)`,d:`hsl(${hs} ${cl-17}%)`,l:`hsl(${hs} ${Math.min(94,cl+15)}%)`,
    acc:K&&K.acc?K.acc:`hsl(${h+165} 75% 62%)`,suit:`hsl(${su[0]} ${su[1]}% ${su[2]}%)`,suitL:`hsl(${su[0]} ${su[1]+7}% ${Math.min(96,su[2]+23)}%)`,hat:K?!!K.nocrest:look.hat===1||look.hat===2};
  const p=sp.draw(k,K),[mx,my,w]=p.M,mc=p.mc||'#0a1024',bc=p.brow||'#0a1024';
  const hd=Math.min(w*.9,13),ad=Math.min(w*.55,10);
  const mouth=`<g fill="none" stroke="${mc}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
   <path class="mo mo-neutral" d="M${mx-w} ${my}Q${mx} ${my+3} ${mx+w} ${my}"/>
   <path class="mo mo-happy" d="M${mx-w} ${my-3}Q${mx} ${my+hd} ${mx+w} ${my-3}"/>
   <path class="mo mo-angry" d="M${mx-w} ${my+4}Q${mx} ${my-ad} ${mx+w} ${my+4}"/>
   <path class="mo mo-nervous" d="M${mx-w} ${my}l${w/2} -4l${w/2} 4l${w/2} -4l${w/2} 4"/></g>`;
  const brows=p.E.map(([x,y,r])=>{const s=x<100?1:-1;return `<path class="brow" d="M${x-s*r} ${y-r-8}L${x+s*r*.9} ${y-r+2}" stroke="${bc}" stroke-width="5" stroke-linecap="round"/>`}).join('');
  const sweat=`<path class="sweat" d="M${p.sw[0]} ${p.sw[1]}q-6 10 0 14q6-4 0-14z" fill="#9fe8ff" stroke="#0a1024" stroke-width="1.5"/>`;
  const ka=K&&K.a?K.a(p,k):'',kb=K&&K.b?K.b(p,k):'';

   :look.hat===3?`<g transform="translate(100 ${p.hat+13})"><path d="M-42 -5Q0 -17 42 -5L42 7Q0 -5 -42 7Z" fill="#e0354b" ${OL}/><path d="M40 0l17 -9l-4 12l10 7l-19 0z" fill="#e0354b" ${OL}/></g>`:'';
  return `<svg class="ch ${sp.ghost?'ghost':''} ${cls}" data-mood="${mood}" viewBox="0 0 200 232" style="--bd:-${look.bd}s">${g0}${p.body}${ka}${p.eyes}${brows}${mouth}${sweat}${hat}${kb}</g></svg>`;

/* 日历 */
function cal(d=G.day){const i=d-1;return {y:Math.floor(i/112)+1,s:Math.floor(i%112/28),w:Math.floor(i%28/7)+1,wd:i%7};}
function dateStr(d=G.day,short){const c=cal(d);return (c.y>1&&!short?`第${c.y}年 `:'')+`${SEASON[c.s]}季第${c.w}周 周${WD[c.wd]}`;}
const dayShort=d=>{const c=cal(d);return `${SEASON[c.s]}${c.w}周${WD[c.wd]}`;};

function newPeople(prof,bag){
  const P={};
  MAINS.forEach(m=>P[m.id]={feel:0,met:0,last:-99,seen:0,al:m.al,rich:m.rich,flag:{}});

function newGame(o){
  const D=DIFFS[o.diff]||DIFFS.normal;

  G={v:1,slot:o.slot,diff:o.diff,prof:o.prof,bag:o.bag||null,
    day:1,phase:'day',cash,debt,debtDue:DEBT_DAYS,freed:o.diff==='free',star:1,
    rep:o.prof==='scav'?Math.max(5,D.rep-12):D.rep,align:o.prof==='fence'?-20:o.prof==='excop'?15:0,heat:0,
    inv:[],win:[],pawns:[],upg:{},prog:{},
    people:newPeople(o.prof,o.bag),regs:[],
    loansOut:[],loansIn:[],lab:[],notices:[],order:null,
    ev:null,evNext:null,trend:{},mk:{},shop:null,
    scans:0,cust:null,queue:[],
    stat:{},tot:{},log:[],alLog:[],repLog:[],seen:{},legends:{},bribes:[],bail:-99,consign:[],smug:[],
    noFind:0,mainNext:{},night:null,tut:!!o.tut,over:null,startCash:cash,debt0:o.diff==='free'?0:debt,cash0:cash,sales:[],news:[],negDays:0,fixedToday:[],regToday:[],mainToday:[],left:0,dayN:0,
  };
  if(o.prof==='appraiser')G.upg.scan=1;
  if(o.prof==='fixer')G.upg.bench=1;
  if(o.prof==='fence')G.upg.safe=2;
  if(o.prof==='scav'){G.upg.bag=1;G.upg.lamp=1;}
  MAINS.forEach(m=>G.mainNext[m.id]=ri(2,6));
  G.mainNext.tangxin=2;

  if(guideOn()){MAINS.forEach(m=>G.mainNext[m.id]=10+ri(0,5));G.mainNext.tangxin=10;}
  META.runs++;saveMeta();

  save();
}

function save(){
  if(!G||G.over)return;
  const s=JSON.stringify({...G,cust:G.cust&&G.cust.keep?G.cust:null});
  if(!ls.set(SLOTK(G.slot),s))toast('存档失败：手机存储空间不够了','bad');
}
function maxId(g){let m=0;const f=it=>{if(it&&it.id>m)m=it.id;};
  g.inv.forEach(f);g.pawns.forEach(p=>f(p.it));g.lab.forEach(l=>f(l.it));
  if(g.shop){(g.shop.goods||[]).forEach(f);(g.shop.bm||[]).forEach(f);}
  (g.consign||[]).forEach(c=>f(c.it));(g.smug||[]).forEach(c=>f(c.it));
  return m;}
function loadSlot(n){
  const g=jget(SLOTK(n),null);if(!g||g.v!==1)return false;
  G=g;G.slot=n;uid=maxId(G)+1;G.cust=null;
  if(G.freed&&!G.deed)giveDeed();
  return true;
}
function slotInfo(n){

  return {day:g.day,date:dateStr.call(null,g.day),cash:g.cash,prof:g.prof,diff:g.diff,star:g.star,freed:g.freed,over:g.over};
}

/* 导出导入：一段文字 */
function exportText(n){

  return 'HG1:'+btoa(unescape(encodeURIComponent(JSON.stringify({s:JSON.parse(raw),m:META}))));

function importText(n,txt){
  try{
    txt=String(txt).trim();if(!txt.startsWith('HG1:'))return '这段文字不是灰港当铺的存档。';
    const o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(4)))));
    if(!o||!o.s||o.s.v!==1)return '存档版本不对。';
    ls.set(SLOTK(n),JSON.stringify(o.s));
    if(o.m){ // 跨存档记录取并集
      for(const k of ['codex','legends','met','titles'])META[k]={...o.m[k],...META[k]};
      for(const k in o.m.seen||{})META.seen[k]=Math.max(META.seen[k]||0,o.m.seen[k]);
      if(o.m.deed)META.deed=1;
      for(const k in o.m.role||{})META.role[k]=1;
      for(const k in o.m.feel||{})META.feel[k]=Math.max(META.feel[k]||0,o.m.feel[k]);
      for(const k in o.m.met||{})META.met[k]=Math.max(META.met[k]||0,o.m.met[k]);
      for(const k in o.m.codex||{})META.codex[k]=(META.codex[k]||0)|o.m.codex[k];
      META.hall=[...META.hall,...(o.m.hall||[])].sort((a,b)=>b.score-a.score).slice(0,10);
      saveMeta();
    }
    return '';
  }catch(e){return '这段文字读不出来，可能复制得不完整。';}
}

/* 跨存档：图鉴、称号 */

const cxSeen=k=>!!(META.seen[k]||META.codex[k]);
function codexTouch(it){
  if(!it||it.legend||!IT[it.k])return;
  const was=cxSeen(it.k);META.seen[it.k]=(META.seen[it.k]||0)+1;

}
function codexSee(it){
  if(!it||it.fake||!it.gKnown&&!it.legend)return;
  if(it.legend){if(!it.cert)return;gotLegend(it);}
  const k=it.legend||it.k,g=it.legend?5:it.g;
  const was=META.codex[k]||0;META.codex[k]=was|(1<<g);
  if(was!==META.codex[k]){saveMeta();if(Object.keys(META.codex).length>=50)title('t_codex');}
}
function title(id){
  if(!TITLES[id])return;

  META.titles[id]=Date.now();saveMeta();

  const o=Object.entries(ORIGINS).find(([,x])=>x.unlock===id);
  if(o)setTimeout(()=>toast(`解锁新出身：${o[1].n}`,'good'),2200);
}
const originOpen=k=>ORIGINS[k].open||!!META.titles[ORIGINS[k].unlock];
const tot=(k,n=1)=>{G.tot[k]=(G.tot[k]||0)+n;return G.tot[k];};

/* ==== 04items.js ==== */
/* 货物：造货、价值、目测区间、把握程度、鉴定、修复、洗白、做旧、赃物热度 */
const upLv=id=>G.upg[id]||0;
const tplOf=it=>IT[it.k]||IT[LG[it.legend]?.base];
const isBan=it=>!!(it&&it.ban);
const subOf=it=>it.sub||'';

/* 行情倍数 */
function mkt(it){
  if(it.ban){
    let m=1;const fx=evFx();
    if(fx.ban&&fx.ban[it.sub])m*=fx.ban[it.sub];
    return m*(G.mk[BAN+it.sub]||1);
  }
  return G.mk[it.cat]||1;
}
const gmul=it=>it.legend?1:it.g<4?GM0[it.g]:it.sm;
/* 真实价值（假货几乎不值钱） */
function faceVal(it){
  if(it.legend)return Math.round(LG[it.legend].p*mkt(it));
  return Math.max(1,Math.round(it.base*gmul(it)*mkt(it)));
}
const unitVal=faceVal;
const tv=it=>it.fake?Math.max(1,Math.round(faceVal(it)*(it.forged?.12:.05))):faceVal(it);

/* 抽等级 */
function rollGrade(gw=GP){
  const g=wpick([0,1,2,3,4],gw);
  return g;
}
function rollSm(){const r=Math.random();return r<.8?rand(5,10):r<.97?rand(10,30):rand(30,100);}

let uidNext=()=>++uid;
/* 造一件货 */
function makeItem(o={}){
  let t=o.t;
  if(!t){
    let pool;
    if(o.ban)pool=BANITEMS.filter(x=>!o.sub||x.sub===o.sub);
    else if(o.cat)pool=catItems(o.cat);
    else if(o.tier!=null)pool=NORMAL.filter(x=>x.tier===o.tier);
    else pool=NORMAL;
    /* 同一档里，越贵的货越少见 */
    t=wpick(pool,o.w||(x=>Math.pow(x.mid,-(o.wx??.5))));
  }
  const g=o.g!=null?o.g:t.k.startsWith('toba')?wpick([1,2,3],[.3,.55,.15]):rollGrade(o.gw||GP);
  const it={id:uidNext(),k:t.k,cat:t.c,sub:t.sub||'',ban:t.ban?1:0,name:t.n,
    base:niceRound(t.v[0]*Math.pow(t.v[1]/t.v[0],Math.random())),g,sm:g===4?+rollSm().toFixed(1):0,
    fake:false,forged:0,stolen:false,hot:0,owner:null,cert:0,gKnown:0,gMin:0,auth:null,authLv:-1,sk:0,
    gOff:Math.random(),pt:1,size:t.z,qty:1,unit:t.unit||'',cost:0,from:o.from||'',day:G.day};
  const fp=o.fakeP||0;
  if(!t.k.startsWith('toba')&&chance(fp))it.fake=true;
  it.pt=1-fp;
  if(!it.fake&&o.stolenP&&chance(o.stolenP)){it.stolen=true;it.hot=o.hot!=null?o.hot:rand(.5,1);}
  if(o.shop){it.shop=1;}
  return it;
}
function makeLegendItem(lk,o={}){
  const L=LG[lk],t=IT[L.base];
  const it=makeItem({t,g:4,...o});
  it.legend=lk;it.name=L.n;it.g=5;it.sm=0;it.fake=chance(o.fakeP??.3);it.pt=1-(o.fakeP??.3);
  return it;
}

/* 目测等级区间 */
/* 目测区间的宽度：开局三级宽，放大镜一级收到两级，二级一眼看准 */
function eyeW(){return clamp(3-upLv('eye')+(G.prof==='talker'?1:0),1,5);}
function gRange(it,night){
  if(it.legend&&LG[it.legend].eye&&!night)return [5,5];
  const gt=it.legend?4:it.g;
  if(it.gKnown)return [gt,gt];
  if(night&&upLv('lamp')<2)return [0,4];
  const w=eyeW();
  let Lmin=Math.max(0,gt-w+1,it.gMin||0),Lmax=Math.min(gt,5-w);
  if(Lmax<Lmin)Lmax=Lmin;
  const lo=Lmin+Math.floor(it.gOff*(Lmax-Lmin+1));
  return [lo,Math.min(4,lo+w-1)];
}
const gTxt=([a,b])=>a===b?GN[a]:`${GN[a]}–${GN[b]}`;
const gBadge=(it,night)=>{const r=gRange(it,night);return `<span class="gb g${r[1]}${r[0]===r[1]?' ok':''}">${gTxt(r)}</span>`;};
/* 估价区间 */
function estRange(it,night){
  if(it.legend&&LG[it.legend].eye&&!night){const v=faceVal(it);return [v,v];}
  const [a,b]=gRange(it,night),m=mkt(it),q=it.qty||1;
  const gv=g=>g<4?GM0[g]:(it.gKnown||(it.legend&&false))?gmul(it):5;
  return [Math.round(it.base*gv(a)*m),Math.round(it.base*(b===4&&!it.gKnown?5:gv(b))*m)];
}
function estText(it,night){
  const [a,b]=estRange(it,night),[,gh]=gRange(it,night);
  const top=gh===4&&!it.gKnown;
  return a===b&&!top?fmt(a):`${fmt(a)}–${fmt(b)}${top?'起':''}`;
}
const estMid=it=>{const [a,b]=estRange(it);return Math.sqrt(a*b);};
/* 「大约值」：按区间里各等级常见的程度算出来的一个中间数，给出价当参考 */
function aboutVal(it,night){
  if(it.legend)return estRange(it,night)[0];
  const [a,b]=gRange(it,night);let s=0,w=0;
  for(let g=a;g<=b;g++){const m=g<4?GM0[g]:(it.gKnown?gmul(it):8);s+=GP[g]*m;w+=GP[g];}
  return Math.max(1,Math.round(it.base*mkt(it)*s/w));
}
/* 玩家眼里的「保守估价」：用于出售时的参考 */
const knownLow=it=>estRange(it)[0];

/* 把握程度（真假） */
const authTxt=it=>it.auth==null?'真假：？':AUTHN[it.auth];
const authKnownFake=it=>it.auth===0;
const authCls=it=>it.auth==null?'':it.auth===4?'ok':it.auth===0?'fake':'sus';
function clarity(it){
  const lv=upLv('scan');
  let c=[.55,.68,.68,.8,.9][lv]||.9;
  const v=faceVal(it);c-=v<1e3?0:v<1e5?.08:v<1e7?.16:.24;
  const fx=evFx();if(fx.blurCat&&it.cat===fx.blurCat)c-=.2;
  if(it.forged)c-=.15;
  return clamp(c,.08,.97);
}
function readAuth(it,c){
  const p=clamp(it.pt||.8,.05,.95),M=(1-c)*2*Math.min(p,1-p);
  if(!it.fake){
    if(chance(.5*M/p))return wpick([1,2,3],[.25,.5,.75]);
    return 4;
  }
  if(chance(.5*M/(1-p)))return wpick([1,2,3],[.75,.5,.25]);
  return 0;
}
const scanMax=()=>2+[0,1,1,2,3][upLv('scan')]+(G.prof==='appraiser'?1:0);
const canScan=it=>!!it&&!(it.legend)&&(it.authLv<upLv('scan')||it.auth==null||(!it.gKnown&&upLv('scan')>=2));
/* 用鉴定仪鉴定一次 */
function appraise(it){
  if(it.legend)return {err:'传奇货自己鉴定不了，要送专业鉴定所。'};
  if(evFx().scanOff)return {err:'停电了，鉴定仪用不了。'};
  if(G.scans<=0)return {err:'今天的鉴定次数用完了。'};
  if(!canScan(it))return {err:'这件已经鉴定过了，鉴定仪升级后才能看出更多。'};
  G.scans--;tot('scan');
  const out=[];
  it.auth=readAuth(it,clarity(it));it.authLv=upLv('scan');
  out.push('真假：'+AUTHN[it.auth]);
  if(it.stolen){it.sk=1;out.push('登记为失窃物品（赃物）');}
  if(upLv('scan')>=2&&!it.gKnown){it.gKnown=1;out.push('等级：'+GN[it.g]);}
  if(it.gKnown&&!it.fake)codexSee(it);
  return {ok:1,text:out.join('，')};
}
/* 真的传奇到手 */
function gotLegend(it){
  if(!it.legend||it.fake)return;G.legends[it.legend]=1;
  if(!META.legends[it.legend]){META.legends[it.legend]=1;saveMeta();}
  title('t_legend');if(Object.keys(META.legends).length>=5)title('t_legend5');
}
const knownStolen=it=>!!it&&it.stolen&&(it.sk||it.notice);
const hotKnown=it=>isBan(it)||knownStolen(it);

/* 工作台：修复 */
const REPAIRP=[.9,.7,.4];
function repairCost(it){return niceRound(Math.max(5,it.base*GM0[Math.min(3,(it.gKnown?it.g:gRange(it)[0])+1)]*.17));}
function repairP(it){return Math.min(.97,(REPAIRP[it.g]||0)+(upLv('bench')>=4?.1:0)+(G.prof==='fixer'?.1:0));}
function repair(it){
  const cost=repairCost(it);if(G.cash<cost)return {err:'钱不够。'};
  G.cash-=cost;G.stat.spent=(G.stat.spent||0)+cost;tot('repair');
  if(it.g>=3){it.gMin=Math.max(it.gMin,3);return {text:`修完发现它本来就很好，修不出更好的了（至少是 A 级）。花了 ${fmt(cost)}。`,cls:'warn'};}
  const p=REPAIRP[it.g]+(upLv('bench')>=4?.1:0)+(G.prof==='fixer'?.1:0);

/* 懂行程度 */
function rollKnow(trans){
  const fx=evFx(),s1=G.star===1;let p2=(repT().know+(fx.know||0))*(s1?.5:1),p0=.35+(s1?.07:0)-(fx.know||0);
  if(trans){p0+=.15;p2-=.08;}
  p2=clamp(p2,.03,.8);p0=clamp(p0,.05,.8);
  const r=Math.random();return r<p2?2:r<p2+p0?0:1;
}
function rollRich(trans){
  const fx=evFx();let w=[.3,.45,.2,.05];
  if(G.star>=3)w=[.15,.4,.3,.15];

}
/* 身家：现金 + 库存的六成 + 当出去的钱。上门的货、客人的预算都跟着身家走 */
const wealth=()=>Math.max(0,G.cash)+sum(G.inv,i=>Math.round(tv(i)*(i.qty||1)*.6))+sum(G.pawns,p=>p.loan||0);
const FITC=.14,FITS=.85,FITLO=.06,FITP=.7;
const fitW=W=>t=>{const x=Math.log(t.mid*.85/Math.max(20,W*FITC));return Math.exp(-x*x/(2*FITS*FITS));};
const budgetOf=c=>c.budget??(c.budget=Math.round(WB[c.rich]*STARM[G.star]*clamp(wealth()/(2500*STARM[G.star]),1,2.5)*rand(.6,1.4)));
const shownRich=c=>c.showRich!=null?c.showRich:clamp(c.rich+(chance(.12)?ri(-1,1):0),0,3);

/* 货从哪来：卖家带什么 */
function sellerItem(c,o={}){
  const R=repT(),fx=evFx(),trans=c.trans;
  let tw=[...(trans?TIERW[2]:TIERW[R.s-1])];
  if(G.star>=3)tw=[tw[0]*.7,tw[1],tw[2]*1.6];
  if(fx.estate){tw[2]*=3;}
  if(guideOn()&&G.day<=1)tw=[1,0,0];
  let gw=trans?GP:R.gw;
  if(o.sLuck)gw=gw.map((x,i)=>i===4?x*5:x);
  /* 引导期：假货、赃物到了那一天才出现 */
  const fk=GD('fake')?1:0,st=GD('stolen')?1:0;
  const fakeP=(o.fakeP??R.fake)*fk,stolenP=(o.stolenP??R.shady)*st;
  const mk=cheap=>o.ban?makeItem({ban:1,sub:o.sub,w:banW(),fakeP:.06*fk,stolenP:0})
    :o.cat?makeItem({cat:o.cat,gw,fakeP,stolenP,wx:cheap?1.5:undefined})
    :makeItem({tier:cheap>1?0:wpick([0,1,2],tw),gw,fakeP,stolenP,wx:cheap?1:undefined});
  let it=mk(0);
  /* 货跟着身家走：太不值钱的货（不到身家的 6%）多半换成一件和身家相称的 */
  if(!o.ban&&!(guideOn()&&G.day<=1)){
    const W=wealth();
    if(faceVal(it)<W*FITLO&&chance(FITP))it=makeItem({cat:o.cat,gw,fakeP,stolenP,w:fitW(W)});
  }
  /* 一星小店：大部分货在你买得起的范围里；贵货一天最多放进来一件，也不是天天有 */
  if(!o.ban&&G.star===1){
    const cap=Math.max(250,G.cash*1.5);
    if(faceVal(it)>cap){
      if(GD('fake')&&G.bigDay!==G.day&&chance(.3))G.bigDay=G.day;
      else for(let n=1;n<=6&&faceVal(it)>cap;n++)it=mk(n>3?2:1);
    }

  if(!o.ban){if(!GD('grade'))it.gKnown=1;if(!GD('fake')){it.auth=4;it.authLv=9;}}
  if(o.fake!=null&&fk){it.fake=o.fake;if(o.fake)it.pt=.5;}
  if(o.stolen&&st){it.stolen=true;it.hot=rand(.6,1);it.fake=false;}

/* 违禁品里贵的东西出现的概率：立场越黑越常见 */
function banW(){

}
const banShare=()=>!GD('ban')?0:clamp(.04-G.align*.005,.015,.45)*(G.prof==='excop'?.6:1)*(evFx().banCheap?1.8:1)*(1-Math.min(.6,.2*snitchN()));
/* 一天最多来几位带违禁品或找违禁品的客人：还债期一位，立场偏黑两位，还清以后三位 */
const banCap=()=>G.freed?3:G.align<=-30?2:1;

/* 卖家心里的价 */
function sellerValue(c,it){
  const fv=faceVal(it)/(it.fake?1:1);
  let sv;
  if(c.know===2||c.knowsFake)sv=fv;
  else if(c.know===1){const g=clamp(it.g+ri(-1,1),0,3);sv=it.legend?it.base*6:it.base*(it.g===4&&chance(.5)?5:GM0[g]);sv*=mkt(it);}
  else sv=it.base*rand(.4,1.6)*mkt(it);

  return Math.max(1,sv);
}
function priceSeller(c){
  const P=P_(c),it=c.item;
  const sv=sellerValue(c,it);
  let ask=sv*rand(...P.ask),min=sv*rand(...P.min);
  if(c.urgent){ask*=.85;min*=.75;}
  if(it.stolen){const h=1-.55*it.hot;ask*=h;min*=h*.9;}
  if(it.fake&&c.knowsFake){min*=.6;}
  if(c.rich>=2)min*=1.05;
  if(c.pid&&per(c.pid)&&(per(c.pid).rel||0)>=25)min*=.93;
  if(c.pid==='mushui'&&mainLv('mushui')>=2){ask=sv*1.05;min=sv*.85;}
  if(evFx().banCheap&&it.ban){ask*=.75;min*=.65;}
  c.ask=Math.max(2,niceRound(ask));c.min=Math.max(1,Math.min(c.ask,Math.round(min)));
  c.ask0=c.ask;
}
/* 买家怎么看一件货 */
function buyerValue(c,it){
  if(it.legend){const v=faceVal(it);return c.know===2||it.cert?(it.fake?v*.03:v):v*rand(.2,.5);}
  const fv=faceVal(it);
  if(it.cert)return it.fake?fv:fv;
  if(c.know===2)return it.fake?fv*(it.forged?.4:.05):fv;
  if(c.know===1){
    if(it.fake&&chance(it.forged?.08:.35)){c.spotFake=1;return fv*.05;}
    const [a,b]=gRange(it),g=clamp(Math.round((a+b)/2),0,3);
    return it.base*(g<4?GM0[g]:5)*mkt(it);
  }
  /* 不懂的买家：默认按偏保守的等级看；你夸货，他信六成 */
  const g0=Math.min(2,gRange(it)[0]+1),m0=GM0[g0];
  const m=c.claim!=null?m0+Math.max(0,GM0[Math.min(3,c.claim)]-m0)*.6:m0;
  return it.base*m*mkt(it);
}
function priceBuyer(c,it){
  const P=P_(c);

  c.bv=bv;
  let mx=bv*rand(...P.buy)*repT().buy;
  if(c.urgent)mx*=1.15;

  if(c.payMul)mx*=c.payMul;
  if(c.want===BAN&&it.ban)mx*=rand(1.25,1.6);
  if(evFx().smoke&&it.sub==='陀巴寇')mx*=c.addict?1.5:.3;
  if(c.pid==='tangyuan')mx=bv*(mainLv('tangyuan')>=1?1.2:.95);
  mx=Math.min(mx,budgetOf(c));
  c.max=Math.max(1,Math.round(mx));
  c.offer=Math.max(1,niceRound(c.max*rand(.62,.8)));
  if(c.offer>c.max)c.offer=c.max;
}

/* 线索：真的和假的 */
function makeTells(c){
  const t=[],it=c.item;
  if(!GD('dlg')){c.tells=t;return;}
  const add=(k,real)=>{if(t.length<2&&!t.some(x=>x.k===k))t.push({k,real,txt:pick(L.tell[k])});};
  if(c.urgent&&chance(.7))add('urgent',1);
  if(c.type==='sell'&&it){
    if(it.stolen&&chance(.35+.45*it.hot))add('stolen',1);
    if(it.fake&&!it.forged&&chance(c.knowsFake&&c.know===2?.3:.6))add('fake',1);
  }
  if(c.addict&&chance(.7))add('addict',1);
  if(c.cop&&chance(G.prof==='excop'?.85:.55))add('cop',1);
  if(c.rich>=3&&shownRich(c)<3&&chance(.4))add('rich',1);

    const k=c.type==='sell'?pick(['naiveK','urgent']):pick(['rich','urgent']);

/* 造一位客人 */
function baseCust(o){

function randomCust(o={}){

/* 买家想要什么 */
function setupBuyer(c,o={}){
  const fx=evFx();
  const banP=GD('ban')?clamp(.03-G.align*.003,.01,.3)*(fx.smoke?.4:1):0;
  if(o.want){c.want=o.want;}
  else if(guideOn()&&G.day<=3){
    /* 头三天的买家不挑：多半什么都看，方便把货卖出去 */
    const cats=[...new Set(G.inv.filter(i=>!i.ban&&!i.safe).map(i=>i.cat))];
    c.want=cats.length&&chance(.4)?pick(cats):'any';
  }
  else if(chance(banP)){c.want=BAN;c.wantSub=chance(.4)?null:wpick(BANS,G.align<=-40?[.3,.4,.3]:[.35,.5,.15]);c.cop=c.kind==='rand'&&chance(copP()*watchMul(c.wantSub));if(c.cop){c.know=1;}}
  else{
    const wins=G.win.map(invItem).filter(Boolean);
    const cats=[...new Set(G.inv.filter(i=>!i.ban&&!i.safe).map(i=>i.cat))];
    const r=Math.random();
    if(wins.length&&r<.3){const w=pick(wins);c.want='item';c.wantId=w.id;}
    /* 购买情绪：涨得凶的品类，来找它的人多 */
    else if(cats.length&&r<.72)c.want=wpick(cats,k=>Math.pow(G.mk[k]||1,2.5));

}
function copP(){return clamp((.08+G.heat*.006)*(evFx().cop||1),0,.7);}
function setupPawn(c){
  const v=faceVal(c.item)*(c.item.fake?1:1);
  c.loan=niceRound(v*rand(.35,.55));c.days=ri(4,8);
  c.redeemP=clamp((c.pers==='desperate'?.5:c.pers==='gambler'?.45:.8)*(c.rich>=2?1.1:1),0,.95);
  c.ask=c.loan;c.min=niceRound(c.loan*rand(.6,.8));c.ask0=c.ask;
}
/* 什么货能卖给这位买家 */
function wants(c,it){
  if(!it||it.safe&&false)return false;
  if(c.want==='item')return it.id===c.wantId;
  if(c.want==='any')return !it.ban;
  if(c.want===BAN)return it.ban&&(!c.wantSub||it.sub===c.wantSub);
  if(c.want==='stolen')return it.stolen;
  if(c.wantG!=null&&gRange(it)[1]<c.wantG)return false;
  return it.cat===c.want;
}
const sellable=c=>G.inv.filter(it=>!it.lab&&wants(c,it));

/* 传奇货：只有特定的人会带来，各有出现条件 */
function legendOk(L){
  return L.tag==='repHi'?G.rep>=80:L.tag==='repLo'?G.rep<10:L.tag==='law'?G.align>=80:L.tag==='dark'?G.align<=-80:L.tag==='star3'?G.star>=3:true;
}
function legendFor(name){
  const L=LEGENDS.find(l=>l.who===name&&!G.legends[l.k]&&!G.lgSeen?.[l.k]);
  if(!L||!legendOk(L)||!chance(.08))return null;
  (G.lgSeen=G.lgSeen||{})[L.k]=1;
  return makeLegendItem(L.k,{fakeP:.3});
}
/* 固定路人和熟客上门 */
function fixedCust(id){
  const f=FIX[id],p=G.people[id],R=ROLES[f.role];
  const al=p.al,rich=p.rich;
  const o={kind:'fixed',pid:id,name:f.n,look:lookOf(id),pers:f.pers,know:f.know,exp:f.exp,rich,showRich:f.showRich,addict:p.addict};
  let c;
  const sellRole=()=>{
    c=baseCust({...o,type:'sell'});
    const cats=R.cats==='any'?null:R.cats==='fav'?[f.fav]:R.cats==='tier0'?['服饰','食物饮品','工具']:R.cats;
    const cat=cats?pick(cats):null;
    const darkSelf=clamp(-al/100,0,1);
    let opt={cat};
    if(f.role==='thief'){opt={...opt,stolen:al<20};if(p.order){opt.cat=p.order.cat;opt.stolen=true;p.order=null;}}
    if(f.role==='urchin'&&al<-30)opt.stolen=chance(.6);
    if(f.role==='forger'){opt.fake=chance(.8);c.knowsFake=opt.fake?1:0;}
    if(f.role==='granny')opt.sLuck=1;
    if(R.ban&&chance(R.ban*(.5+darkSelf)))opt={ban:1,sub:R.banSub};
    if(f.role==='heir'){opt.fakeP=.05;opt.stolenP=0;}
    c.item=legendFor(f.n)||sellerItem(c,opt);
    if(c.item.fake&&f.know===2)c.knowsFake=1;
    if(f.role==='forger'&&c.item.fake&&p.known.role&&(p.rel||0)>=25){c.item.auth=0;c.item.authLv=9;c.honest='这件是仿的，我不瞒你，便宜点给你。';}
    if(f.role==='thief'&&c.item.stolen&&p.known.role&&(p.rel||0)>=25){c.item.sk=1;c.honest='老规矩，来路你别问。';}
    priceSeller(c);
  };
  const buyRole=(want,extra={})=>{c=baseCust({...o,type:'buy'});setupBuyer(c,{want});Object.assign(c,extra);};
  /* 上了瘾的街坊，有时不为别的，就是来找陀巴寇 */
  const crave=p.addict&&f.role!=='addict'&&GD('ban')&&chance(.15+.15*p.addict);
  switch(crave?'crave':f.role){
    case 'crave':buyRole(BAN,{wantSub:'陀巴寇',addict:p.addict});break;
    case 'collector':chance(.25)?sellRole():buyRole(f.fav,{wantG:2,payMul:R.payMul});break;
    case 'addict':buyRole(BAN,{wantSub:'陀巴寇',addict:Math.max(1,p.addict)});if(!p.known.role){reveal(id,'他一开口就问陀巴寇。');}break;
    case 'veteran':(roleKnown(id)&&chance(.6))?buyRole(BAN,{wantSub:'武器'}):sellRole();break;
    case 'doctor':(roleKnown(id)&&chance(.6))?buyRole(BAN,{wantSub:'人体器官'}):sellRole();break;
    case 'fence':chance(.5)&&G.inv.some(knownStolen)?buyRole('stolen'):sellRole();break;
    case 'heir':
      if(chance(R.pawn)){c=baseCust({...o,type:'pawn'});c.item=sellerItem(c,{cat:pick(['古董','珠宝','艺术']),fakeP:.05,stolenP:0});setupPawn(c);if(!p.known.role&&p.seen>=2)reveal(id,'他开始拿家当来当了。');}
      else sellRole();break;
    case 'gambler':{
      const was=p.rich;p.rich=chance(.5)?clamp(p.rich+ri(-2,2),0,3):p.rich;if(Math.abs(p.rich-was)>=2){p.hits++;if(p.hits>=2)reveal(id,'他的钱一会儿多一会儿少。');}
      o.rich=p.rich;
      const r=Math.random();if(r<.4)sellRole();else if(r<.7){c=baseCust({...o,type:'pawn'});c.item=sellerItem(c,{});setupPawn(c);}else buyRole();break;}
    case 'mechanic':case 'gardener':case 'painter':case 'musician':
      if(f.role==='musician'&&p.addict&&chance(.5)){buyRole(BAN,{wantSub:'陀巴寇',addict:p.addict});break;}
      chance(R.sell)?sellRole():buyRole(f.fav||pick(R.cats));break;
    case 'captain':chance(R.sell)?sellRole():buyRole('能源');break;
    case 'broker':c=baseCust({...o,type:'info'});break;
    case 'reporter':c=baseCust({...o,type:'talk'});break;
    default:chance(R.sell)?sellRole():buyRole();
  }
  c.honest=c.honest||'';
  makeTells(c);
  return c;
}
function regCust(r){
  const o={kind:'reg',pid:r.id,name:r.n,look:r.look,pers:r.pers,know:r.know,rich:r.rich,addict:r.addict||0};
  let c;
  if(r.addict&&GD('ban')&&chance(.2+.15*r.addict)){c=baseCust({...o,type:'buy'});setupBuyer(c,{want:BAN});c.wantSub='陀巴寇';c.addict=r.addict;}
  else if(chance(.5)){c=baseCust({...o,type:'sell'});c.item=sellerItem(c,{});priceSeller(c);}
  else{c=baseCust({...o,type:'buy'});setupBuyer(c);}
  makeTells(c);return c;
}
/* 主要角色上门 */
function mainCust(id){
  const m=MAIN[id],p=G.people[id];
  const o={kind:'main',pid:id,name:m.n,look:lookOf(id,m.look),pers:m.pers,know:m.know,exp:m.exp,rich:m.rich};
  let c;

      if(chance(.5)&&G.inv.some(i=>i.ban&&!i.safe)){c=baseCust({...o,type:'buy'});setupBuyer(c,{want:BAN});c.wantSub=null;}
      else{c=baseCust({...o,type:'sell'});c.item=legendFor('木水')||sellerItem(c,{ban:1});if(!c.item.legend)c.item.fake=false;priceSeller(c);}
      break;}
    case 'funi':{
      c=baseCust({...o,type:'talk'});break;}

      if(top){c.want='item';c.wantId=top.id;}else c.want=pick(['古董','珠宝']);
      break;}
    case 'tangxin':{
      if(chance(.6)){c=baseCust({...o,type:'pawn'});c.item=sellerItem(c,{cat:'食物饮品',fakeP:0,stolenP:0});setupPawn(c);c.days=2;c.redeemP=1;c.snack=1;}
      else{c=baseCust({...o,type:'buy'});setupBuyer(c,{want:'食物饮品'});}
      break;}
    case 'dapanji':{
      if(G.inv.some(i=>i.sub==='陀巴寇'&&!i.safe)&&chance(.7)){c=baseCust({...o,type:'buy'});setupBuyer(c,{want:BAN});c.wantSub='陀巴寇';}
      else{c=baseCust({...o,type:'sell'});c.item=sellerItem(c,{cat:pick(['能源','工具']),stolenP:.05});priceSeller(c);}
      break;}
    case 'xiaoyumi':{
      if(chance(.5)){c=baseCust({...o,type:'sell'});c.item=sellerItem(c,{cat:pick(m.exp),fakeP:.05,stolenP:0});priceSeller(c);}
      else{c=baseCust({...o,type:'buy'});setupBuyer(c,{want:pick(m.exp)});}
      break;}
  }
  c.greet=pick(m.hi);
  makeTells(c);
  return c;
}
/* 固定路人今天来不来 */
function pickFixed(){
  const c=cal(),out=[];
  if(!GD('people'))return out;
  for(const f of FIXED){
    const p=G.people[f.id];if(p.gone)continue;
    if(G.day-p.last<2)continue;
    let w=.12+(p.rel||0)/400;
    if(f.id==='xiaoma'&&p.addict)w+=(G.freed?.15:.05)*p.addict;
    else if(p.addict)w+=(G.freed?.08:.03)*p.addict;
    if(evFx().visit===f.id)w+=.5;
    if(f.role==='collector'&&G.star<3)w*=.25;
    if(p.rel<=-60){w=.02;}
    if(chance(clamp(w,.01,.7)))out.push(f.id);
  }
  return shuffle(out).slice(0,c.wd>=5?3:2);
}
/* 成交后，随机路人有小概率变熟客 */
function maybeRegular(c,fair){
  if(c.kind!=='rand'||c.cop||!GD('people')||c.trans&&chance(.6))return;
  if(!chance(.05+(fair?.06:0)))return;
  if(G.regs.length>=10){G.regs.sort((a,b)=>a.last-b.last);const gone=G.regs.shift();log(`${gone.n}离开了星港`);}
  const r={id:'r'+c.id,n:c.name,look:c.look,pers:c.pers,know:c.know,rich:c.rich,al:0,rel:15,last:G.day,met:1,seen:1,known:{pers:0,know:0},kind:'reg'};
  G.regs.push(r);log(`${c.name}说以后常来`,'g');toast(`${c.name}成了熟客`,'good');
}
/* 揭示：客人走后给一句 */
function revealLine(c){
  if(c.kind==='main')return '';
  const bits=[KNOWN[c.know],PERS[c.pers].n];
  if(c.urgent)bits.push('急着用钱');
  if(c.cop)bits.push('还是个海关便衣');
  return `原来是个${bits.join('、')}的人。`;
}
/* 记下见过的人 */
function metPerson(c){
  if(!c.pid)return;const p=per(c.pid);if(!p)return;
  p.met=1;p.seen=(p.seen||0)+1;p.last=G.day;
  if(p.seen>=3&&p.known){p.known.pers=1;p.known.know=1;}
  META.met[c.pid]=(META.met[c.pid]||0)+1;saveMeta();
}

/* 砍价：出价、耐心、话术、线索、成交 */
const TACS={
 sell:[['flaw','挑毛病'],['poor','哭穷'],['last','最后一口价'],['chat','套近乎'],['stall','晾一晾'],['coin','抛硬币']],
 buy:[['pitch','夸货'],['cert','亮鉴定书'],['warranty','承诺包退'],['chat','套近乎'],['stall','晾一晾'],['coin','抛硬币']],
};
const TACTIP={
 flaw:'按你看到的等级区间的低头说这件货。',poor:'说你手头紧，请对方让一点。',last:'按滑块上的价报最后一口价：成就成，不成就算了。',
 chat:'聊几句，拉近关系。',stall:'不说话，等对方先让。',coin:'提议抛硬币定价：赢了对方让一大步，输了反过来。',
 pitch:'按你看到的等级区间的高头说这件货，最高只能说到 A 级。说过头了，客人事后会回来闹。',cert:'拿出鉴定书。只有送鉴定所鉴定过的货才有。',warranty:'承诺不满意可以退货。对方更放心，但货有问题会被退回来。',
};
const sellSide=c=>c.type==='sell'||c.type==='pawn';
const moodOf=c=>{
  if(c.done==='deal')return 'happy';if(c.done)return c.angry?'angry':'neutral';
  const r=c.patience/Math.max(1,c.patMax);
  return r>.66?'neutral':r>.34?'nervous':'angry';
};
const MOODN={neutral:'平静',nervous:'皱眉',angry:'不耐烦',happy:'满意'};
const moodTxt=c=>c.patience<=1&&!c.done?'要走了':MOODN[moodOf(c)];
const repMul=()=>[0,.3,.6,1,1.2,1.5][repT().s];

function finish(kind){
  const c=G.cust;c.done=kind;c.dlg=null;G.stat.served=(G.stat.served||0)+1;
  metPerson(c);
  if(c.tutI!=null)G.g1=(G.g1||0)+1;
  if(c.kind==='rand'&&c.tutI==null&&GD('dlg'))c.reveal=revealLine(c);
  if(kind==='deal'&&c.kind==='fixed')maybeRumor(c);
  goalCheck();
  save();render();
}
function leave(insulted){
  const c=G.cust;c.line=say(L.leave[c.pers]);c.angry=1;
  /* 谈不拢不掉声望；出价离谱把人气走才掉 */
  if(insulted&&c.kind==='rand'&&!c.trans)addRep(-1,'出价离谱，气走了客人');
  if(c.kind==='fixed'||c.kind==='reg')addRel(c.pid,insulted?-5:-1);
  if(c.kind==='main'&&insulted)addFeel(c.pid,-2);
  c.result=`${c.name}走了。`;sfx.bad();log(`${c.name}谈崩了`);finish('left');
}
const nearLine=(c,p)=>say(L.near,{p});
/* 被拒以后，告诉玩家离对方心里的价还差多远 */
function gapSell(c,o){
  const r=o/Math.max(1,c.min);
  c.fb=r>=1?'对方动心了，再磨一磨就能成':r>=.8?'离对方肯卖的价只差一点了':r>=.5?'离对方肯卖的价还差不少':'这个价太离谱，对方很不高兴';
  c.fbc=r>=1?'good':r>=.8?'warn':'bad';
}
function gapBuy(c,p){
  const r=p/Math.max(1,c.max);
  c.fb=r<=1?'对方动心了，再磨一磨就能成':r<=1.25?'比对方肯出的价只高一点了':r<=1.6?'比对方肯出的价高出不少':'这个价太离谱，对方很不高兴';
  c.fbc=r<=1?'good':r<=1.25?'warn':'bad';
}
/* 离谱的价：第一次只扣一点耐心，再犯才重罚 */
function rude(c,ins){const cost=ins&&c.warned?2:1;if(ins)c.warned=1;c.patience-=cost;return ins&&cost===2;}
/* 默认出价：对方开价的一半，和「大约值」的七成，取低的 */
function defOffer(c){
  const it=c.item,a=it?aboutVal(it):c.ask;
  const v=c.type==='pawn'?Math.min(c.ask,a*.5):Math.min(c.ask*.5,a*.7);
  return Math.max(1,Math.min(G.cash,c.ask,niceRound(v)));
}

/* ---------- 收货：玩家出价给卖家 ---------- */
function offerToSeller(o){
  const c=G.cust;if(!c||c.done||!(o>0))return;
  if(c.type!=='pawn'&&freeSlots()<c.item.size){toast('仓库满了，先清理库存','bad');return;}
  if(o>G.cash){toast('现金不够','bad');return;}
  c.dlg=null;c.fb='';
  if(o>=c.ask)return dealBuy(c.ask);
  const P=P_(c),first=!c.tries;c.tries=(c.tries||0)+1;
  /* 第一天的教学客人：不会走，第二次出价过了底线就成交 */
  if(c.fix){
    if(o>=c.min&&c.tries>1)return dealBuy(o);
    c.ask=Math.max(c.min,Math.round((c.ask+Math.max(o,c.min))/2));
    c.line=say(['太少了吧……{p} 行不行？','再加一点嘛，{p}？'],{p:c.ask});c.flash='counter';sfx.click();UI.price=Math.min(UI.price,c.ask);return render();
  }
  const hold=t=>{c.line=say(t,{p:c.ask});c.flash='counter';sfx.click();UI.price=Math.min(UI.price,c.ask);gapSell(c,o);dlgPush(c);render();};
  if(c.final){c.patience--;if(c.patience<=0)return leave(false);return hold(['我说了，{p}。','{p}，最后的价。']);}
  /* 倔强的人让得很慢，但不是一步不让 */
  if(c.pers==='stubborn'){c.patience--;if(c.patience<=0)return leave(false);if(o>=c.min&&chance(.35))return dealBuy(o);c.ask=Math.max(c.min,niceRound(c.ask-(c.ask-c.min)*.1));return hold(L.push.stubborn);}
  if((c.pers==='desperate'||c.urgent)&&o>=c.min)return dealBuy(o);
  /* 急躁的人：还一次价，第二次就是最后一口价 */
  if(c.pers==='impatient'){
    if(o>=c.min&&(first||chance(.5)))return dealBuy(o);
    const bad=rude(c,o<c.min*.5);if(c.patience<=0)return leave(bad);
    if(!c.imp){c.imp=1;c.ask=Math.max(c.min,niceRound(c.ask-(c.ask-c.min)*.4));return hold(L.push.impatient);}
    c.final=1;c.ask=Math.max(c.min,Math.round(c.min+(c.ask-c.min)*.4));return hold(['没空跟你磨！{p}，最后一口价。','{p}。行就行，不行我走了。']);
  }
  const span=Math.max(1,c.ask-c.min);
  if(o>=c.min&&(o-c.min)/span>rand(.15,.55))return dealBuy(o);
  const ins=o<c.min*.5,bad=rude(c,ins);
  if(c.patience<=0)return leave(bad);
  if(o>=c.min){c.ask=Math.max(c.min,niceRound(c.ask-(c.ask-o)*rand(.3,.55)));if((c.ask-o)/c.ask<.04)return dealBuy(o);}
  else c.ask=Math.max(c.min,niceRound(c.ask-span*rand(.08,.22)));
  c.line=ins?pick(L.insult)+' '+say(L.push[c.pers],{p:c.ask}):o>=c.min*.85?nearLine(c,c.ask):say(L.push[c.pers],{p:c.ask});
  c.flash=ins?'insult':'counter';ins?sfx.bad():sfx.click();
  UI.price=Math.min(UI.price,c.ask);gapSell(c,o);dlgPush(c);render();
}

/* ---------- 卖货：玩家报价给买家 ---------- */
function showItem(id){
  const c=G.cust,it=invItem(id);if(!it||!c||c.done||c.type!=='buy'||!wants(c,it))return;
  c.item=it;c.tries=0;c.final=0;c.claim=null;c.used={};c.dlg=null;c.fb='';
  priceBuyer(c,it);
  if(c.fix){c.max=Math.max(2,Math.round(faceVal(it)*1.5));c.offer=Math.max(1,Math.round(faceVal(it)*1.1));c.spotFake=0;}
  if(c.spotFake){c.line='这东西……是假的吧？我不要。';c.item=null;c.spotFake=0;c.patience--;toast('对方看出这件是假货','bad');closeSheet();if(c.patience<=0)return leave(false);render();return;}
  /* 默认要价：比对方出价高两成半，至少比收价高一成半。滑块上限是对方出价的两倍半，再高就是离谱 */
  const unit=(it.cost||0)/(it.qty||1);
  c.sliderMax=Math.max(Math.round(c.offer*2.5),Math.round(unit*1.6),c.offer+10);
  UI.price=clamp(niceRound(Math.max(c.offer*1.25,unit*1.15)),c.offer,c.sliderMax);
  c.line=say(L.look[c.pers],{item:it.name,p:c.offer});c.flash='';sfx.click();closeSheet();dlgItem(c);render();
}
function priceToBuyer(p){
  const c=G.cust;if(!c||c.done||!c.item||!(p>0))return;
  c.dlg=null;c.fb='';
  if(p<=c.offer)return dealSell(c.offer);
  const first=!c.tries;c.tries=(c.tries||0)+1;
  if(c.fix){
    if(p<=c.max&&c.tries>1)return dealSell(p);
    c.offer=Math.min(c.max,Math.round((c.offer+Math.min(p,c.max))/2));
    c.line=say(['贵了点……{p} 怎么样？','我最多再加一点，{p}。'],{p:c.offer});c.flash='counter';sfx.click();UI.price=Math.max(UI.price,c.offer);return render();
  }
  const hold=t=>{c.line=say(t,{p:c.offer});c.flash='counter';sfx.click();UI.price=Math.max(UI.price,c.offer);gapBuy(c,p);dlgPush(c);render();};
  if(c.final){c.patience--;if(c.patience<=0)return leave(false);return hold(['{p}，不能再多了。','我说了，{p}。']);}
  if(c.pers==='stubborn'){c.patience--;if(c.patience<=0)return leave(false);if(p<=c.max&&chance(.35))return dealSell(p);c.offer=Math.min(c.max,niceRound(c.offer+(c.max-c.offer)*.1));return hold(L.pushBuy.stubborn);}
  if((c.pers==='desperate'||c.urgent||c.addict)&&p<=c.max)return dealSell(p);
  if(c.pers==='impatient'){
    if(p<=c.max&&(first||chance(.5)))return dealSell(p);
    const bad=rude(c,p>c.max*1.6);if(c.patience<=0)return leave(bad);
    if(!c.imp){c.imp=1;c.offer=Math.min(c.max,niceRound(c.offer+(c.max-c.offer)*.4));return hold(L.pushBuy.impatient);}
    c.final=1;c.offer=Math.min(c.max,niceRound(c.offer+(c.max-c.offer)*.6));return hold(['没空跟你磨！{p}，最后出价。','{p}。卖就卖，不卖我走了。']);
  }
  const span=Math.max(1,c.max-c.offer);
  if(p<=c.max&&(c.max-p)/span>rand(.15,.55))return dealSell(p);
  const ins=p>c.max*1.6,bad=rude(c,ins);
  if(c.patience<=0)return leave(bad);
  if(p<=c.max){c.offer=Math.min(c.max,niceRound(c.offer+(p-c.offer)*rand(.3,.55)));if((p-c.offer)/p<.04)return dealSell(p);}
  else c.offer=Math.min(c.max,niceRound(c.offer+span*rand(.08,.22)));
  c.line=ins?pick(L.insult)+' '+say(L.pushBuy[c.pers],{p:c.offer}):p<=c.max*1.15?nearLine(c,c.offer):say(L.pushBuy[c.pers],{p:c.offer});
  c.flash=ins?'insult':'counter';ins?sfx.bad():sfx.click();
  UI.price=Math.max(UI.price,c.offer);gapBuy(c,p);dlgPush(c);render();
}

/* ---------- 对话：客人多说一句，你选一句回 ---------- */
const TACN={flaw:'挑毛病',poor:'哭穷',last:'最后一口价',chat:'套近乎',stall:'晾一晾',coin:'抛硬币',pitch:'夸货',cert:'亮鉴定书',warranty:'包退',honest:'说实话'};
function tacOpts(c,keys){
  const it=c.item,sell=sellSide(c);
  return keys.map(k=>{
    const g=it?GN[Math.min(3,it.gKnown?it.g:gRange(it)[1])]:'';
    return {k:'tac',a:k,n:TACN[k],t:say(L.re[k==='coin'?(sell?'coinS':'coinB'):k],{g,p:UI.price})};
  });
}
/* 客人进门：带着线索的会多说一句；没线索的一半多不说话，只谈价 */
function dlgStart(c){
  c.dlgN=0;c.dlg=null;c.fb='';
  if(!GD('dlg')||!['sell','buy','pawn'].includes(c.type)){c.quiet=1;return;}
  if(c.tells&&c.tells.length){c.quiet=0;dlgTell(c);}
  else c.quiet=chance(.65)?1:0;
}
function dlgTell(c){
  const i=(c.tells||[]).findIndex(t=>!t.used&&!t.shown);if(i<0)return false;
  const tl=c.tells[i];tl.shown=1;c.dlgN++;
  c.dlg={cue:tl.txt,opts:[{k:'tell',a:i,n:'',t:L.tellAct[tl.k]},{k:'pass',a:tl.k,n:'',t:pick(L.pass[tl.k])}]};
  return true;
}
/* 客人还价之后 */
function dlgPush(c){
  if(c.done||c.dlg||c.quiet||c.final||c.fix||!GD('dlg'))return;
  const sell=sellSide(c),last=sell&&c.patience<=1&&!c.used.last;
  if(c.dlgN>=(last?3:2))return;
  if(c.dlgN>=1&&!last&&!chance(.3))return;
  if(!last&&dlgTell(c))return;
  let pool=shuffle((sell?['flaw','poor','stall','chat']:['pitch','warranty','chat','stall']).filter(k=>!c.used[k]));
  if((c.pers==='gambler'||evFx().gamble)&&!c.used.coin)pool.unshift('coin');
  if(!sell&&c.item&&c.item.cert&&!c.used.cert)pool.unshift('cert');
  pool=pool.slice(0,3);
  if(last){pool=pool.slice(0,2);pool.push('last');}
  if(!pool.length)return;
  c.dlgN++;c.dlg={cue:'',opts:tacOpts(c,pool)};
}
/* 把货拿给买家看的时候 */
function dlgItem(c){
  if(c.done||c.quiet||c.fix||c.dlgN>=2||!c.item||!GD('dlg')||!chance(.6))return;
  const pool=[];
  if(c.item.cert)pool.push('cert');
  pool.push('pitch','honest');if(pool.length<3)pool.push('warranty');
  c.dlgN++;c.dlg={cue:'',opts:tacOpts(c,pool)};
}
let HOLD=0;
function reply(i){
  const c=G.cust;if(!c||c.done||!c.dlg)return;
  const o=c.dlg.opts[i];if(!o)return;c.dlg=null;
  const sell=sellSide(c),has=sell||!!c.item,b0=sell?c.ask:c.offer,p0=c.patience,m0=c.payMul||1;
  c.fb='';tot('reply');gs('reply');
  HOLD=1;
  try{
    if(o.k==='tell')tellAct(o.a);
    else if(o.k==='tac')tactic(o.a);
    else{c.line=pick(L.passRe[o.a]||['嗯。']);if(o.a==='naiveK')c.patience=Math.min(c.patMax+1,c.patience+1);c.flash='';sfx.click();}
  }finally{HOLD=0;}
  if(!c.done){
    const b1=sell?c.ask:c.offer,better=has?(sell?b1<b0:b1>b0):(c.payMul||1)>m0,worse=has&&(sell?b1>b0:b1<b0);
    if(better){c.fb=has?`这句管用了：对方的${sell?'要价':'出价'}从 ${fmt(b0)} ${sell?'降到':'涨到'} ${fmt(b1)}`:'这句管用了：对方愿意多出一些';c.fbc='good';}
    else if(worse){c.fb=`弄巧成拙：对方的${sell?'要价涨到':'出价降到'} ${fmt(b1)}`;c.fbc='bad';}
    else if(c.patience<p0){c.fb='这句没管用，对方更不耐烦了';c.fbc='bad';}
    else if(c.patience>p0){c.fb='对方的脸色好了一些';c.fbc='good';}
    else c.fb='';
  }
  goalCheck();render();
}

/* ---------- 话术（对话选项背后的规则） ---------- */
function tactic(t){
  const c=G.cust;if(!c||c.done||c.used[t])return;
  if(!sellSide(c)&&!c.item&&t!=='chat')return toast('先拿一件货给对方看','warn');
  const P=P_(c),sell=sellSide(c),it=c.item;let ok=true,cost=0;
  const P$=()=>({p:sell?c.ask:c.offer});
  const cutS=(a,m)=>{c.min=Math.max(1,Math.round(c.min*m));c.ask=Math.max(c.min,niceRound(c.ask*a));};
  const upB=(m,o)=>{c.max=Math.round(c.max*m);c.offer=Math.min(c.max,niceRound(c.offer*o));};
  const relB=c.pid?((per(c.pid).rel||0)+(G.people[c.pid]?.feel||0))/250:0;
  const talk=G.prof==='talker'?.1:0;
  if(t==='chat'){
    ok=chance(P.chat+talk+relB);
    if(ok){c.patience=Math.min(c.patMax+1,c.patience+1);sell?cutS(.94,.95):upB(1.06,1.04);c.line=pick(L.tac.chatOk);
      if(c.kind==='fixed'||c.kind==='reg')addRel(c.pid,2);if(c.kind==='main')addFeel(c.pid,1);}
    else{cost=c.pers==='impatient'?1:0;c.line=pick(L.tac.chatNo);}
  }else if(t==='flaw'){
    const gl=gRange(it)[0];
    if(c.know===2){if(gl<it.g){ok=false;cost=2;c.line=pick(L.tac.flawNo);}else{c.line='嗯，这个等级是实话。价钱不变。';}}
    else if(c.know===1){if(gl>=it.g-1){const f=clamp(GM0[Math.min(3,gl)]/GM0[Math.min(3,it.g)],.7,.95);cutS(f,f);c.line=say(L.tac.flawOk,P$());}else{ok=false;cost=1;c.line=pick(L.tac.flawNo);}}
    else{ok=chance(c.pers==='stubborn'?.4:.85);if(ok){cutS(rand(.75,.85),rand(.75,.85));c.line=say(L.tac.flawOk,P$());if(gl<it.g&&c.pers==='naive')c.lied=1;}else{cost=1;c.line=pick(L.tac.flawNo);}}
  }else if(t==='poor'){
    ok=!c.urgent&&c.rich<3&&chance(P.soft+talk);
    if(ok){cutS(.92,.92);c.line=say(L.tac.poorOk,P$());}else{cost=1;c.line=pick(L.tac.poorNo);}
  }else if(t==='last'){
    const o=UI.price;
    if(o>G.cash)return toast('现金不够','bad');
    if(o>=c.ask)return dealBuy(c.ask);
    if(o>=c.min*(c.urgent?.9:1)){c.line=pick(L.tac.lastOk);return dealBuy(o);}
    if(c.pers==='stubborn'||c.pers==='impatient'||chance(.5)){c.line=pick(L.tac.lastNo);c.used[t]=2;return leave(false);}
    ok=false;c.final=1;c.ask=Math.max(c.min,niceRound(c.min*1.02));c.line=say(['最后一口价？那我也给个最后的：{p}。'],P$());
  }else if(t==='stall'){
    if(c.urgent||c.addict){sell?cutS(.88,.9):upB(1.1,1.1);c.line=say(L.tac.stallOk,P$());}
    else if(chance(.5)){c.line=pick(L.tac.stallNo);c.used[t]=2;return leave(false);}
    else{ok=false;cost=2;c.line=pick(L.tac.stallNo);}
  }else if(t==='coin'){
    const acc=chance(P.coin+(evFx().gamble?.3:0));
    if(!acc){ok=false;cost=1;c.line=pick(L.tac.coinNo);}
    else if(chance(.5)){sfx.coin();if(sell){c.ask=Math.max(1,niceRound(c.min*.85));c.min=c.ask;}else{c.max=Math.round(c.max*1.15);c.offer=c.max;}c.line=pick(L.tac.coinYes)+' ……'+say(['啧，手气真背。愿赌服输，{p}。','居然输了！行，{p}。'],P$());}
    else{sfx.coin();if(sell){c.ask=niceRound(c.ask*1.15);c.min=Math.min(c.ask,Math.round(c.min*1.12));}else{c.max=Math.round(c.max*.85);c.offer=Math.min(c.offer,c.max);}ok=false;c.line=pick(L.tac.coinYes)+' ……'+say(['哈哈，我赢了！现在是 {p}。','运气在我这边。{p}。'],P$());}
  }else if(t==='pitch'){
    /* 夸货：按你看到的区间的高头说，最高只能说到 A（S 级没有鉴定书没人信） */
    const gh=Math.min(3,it.gKnown?it.g:gRange(it)[1]),gt=it.legend?4:it.g;
    if(c.know===2){if(gh>gt){ok=false;cost=2;c.line=pick(L.tac.pitchNo);}else{upB(1.05,1.03);c.line=say(L.tac.pitchOk,P$());}}
    else if(c.know===1){if(gh<=gt+1){c.claim=gh;const old=c.bv;const nb=it.base*GM0[gh]*mkt(it);if(nb>old)upB(clamp(nb/old,1,1.4),clamp(nb/old,1,1.3));c.line=say(L.tac.pitchOk,P$());if(gh>gt)c.over=gh-gt;}else{ok=false;cost=1;c.line=pick(L.tac.pitchNo);}}
    else{c.claim=gh;const old=c.bv;const nb=buyerValue(c,it);upB(clamp(nb/old,1.03,2),clamp(nb/old,1.02,1.8));c.line=say(L.tac.pitchOk,P$());if(gh>gt||it.fake)c.over=Math.max(1,gh-gt);if(c.pers==='naive'&&gh>gt)c.lied=1;}
  }else if(t==='cert'){
    if(!it.cert)return toast('这件没有鉴定书。送鉴定所鉴定过的货才有。','warn');
    if(c.know<2){const nb=faceVal(it);if(nb>c.bv)upB(clamp(nb/c.bv,1,2.5)*1.05,clamp(nb/c.bv,1,2));else upB(1.08,1.05);c.line=say(L.tac.certOk,P$());}
    else{c.line='鉴定书我看过了，我自己也看得出来。';}
  }else if(t==='warranty'){
    c.warranty=1;upB(['shrewd','stubborn'].includes(c.pers)?1.25:1.12,1.08);c.line=say(L.tac.warranty,P$());
  }else if(t==='honest'){
    /* 不夸货：懂行的人领情，多出一点；不懂的人更放心 */
    if(c.know>=1)upB(1.05,1.04);else c.patience=Math.min(c.patMax+1,c.patience+1);
    c.line=pick(L.tac.honestOk);c.used.pitch=c.used.pitch||3;
  }
  c.used[t]=ok?1:2;
  c.patience-=cost;
  if(c.patience<=0)return leave(false);
  c.flash=ok?'good':cost?'insult':'counter';
  ok?sfx.good():cost?sfx.bad():sfx.click();
  if(sell)UI.price=Math.min(UI.price,c.ask);else if(c.item)UI.price=Math.max(UI.price,c.offer);
  render();
}

/* ---------- 点线索 ---------- */
function tellAct(i){
  const c=G.cust;if(!c||c.done)return;const tl=c.tells[i];if(!tl||tl.used)return;tl.used=1;
  const sell=sellSide(c),it=c.item;
  const angry=()=>{c.patience-=2;c.line=pick(L.tellNo);c.flash='insult';sfx.bad();if(c.patience<=0||chance(.25))return leave(false),1;};
  const p$=()=>({p:sell?c.ask:c.offer});
  /* 买家还没看货时，先记下他愿意多出多少 */
  const upMax=(m,o)=>{if(it){c.max=Math.round(c.max*m);c.offer=Math.min(c.max,niceRound(c.offer*o));}else c.payMul=(c.payMul||1)*m;};
  const lineB=k=>{c.line=it?say(L.tellOk[k],p$()):pick({urgent:['……被你看出来了。有合适的就快拿出来吧。'],rich:['哈，那倒是。有好货尽管拿。']}[k]);};
  if(!tl.real){if(angry())return;if(sell){c.ask=niceRound(c.ask*1.1);}render();return;}
  if((c.pers==='stubborn'||c.pers==='impatient')&&chance(.3)&&tl.k!=='cop'){if(angry())return;render();return;}
  switch(tl.k){
    case 'urgent':if(sell){c.ask=Math.max(1,niceRound(c.ask*.8));c.min=Math.round(c.min*.85);c.line=say(L.tellOk.urgent,p$());}else{upMax(1.15,1.1);lineB('urgent');}break;
    case 'stolen':c.ask=Math.max(1,niceRound(c.ask*.65));c.min=Math.round(c.min*.6);it.sk=1;c.line=say(L.tellOk.stolen,p$());if(c.pid&&FIX[c.pid]){G.people[c.pid].hits++;checkReveal(c.pid);}break;
    case 'fake':
      if(c.knowsFake){c.ask=Math.max(1,niceRound(c.ask*.4));c.min=Math.max(1,Math.round(c.min*.35));it.auth=0;it.authLv=9;c.line=say(L.tellOk.fake,p$());}
      else{c.ask=Math.max(1,niceRound(c.ask*.8));c.line=say(['啊？我也不知道……那 {p}？'],p$());}
      if(c.pid&&FIX[c.pid]){G.people[c.pid].hits++;checkReveal(c.pid);}break;
    case 'addict':if(!sell){upMax(1.3,1);c.addictPushed=1;}c.line=say(L.tellOk.addict,p$());break;
    case 'cop':
      c.line=pick(L.tellOk.cop)+' 对方咳了一声，走了。';c.result='你识破了海关便衣。';
      if(G.inv.some(i=>i.ban&&!i.safe)){addRep(1,'识破了海关便衣');align(2,'没上便衣的钩');}
      sfx.good();return finish('left');
    case 'rich':if(!sell){upMax(1.2,1.1);lineB('rich');}else c.line=say(L.tellOk.rich,p$());break;
    case 'naiveK':if(sell){c.ask=Math.max(1,niceRound(c.ask*.85));c.min=Math.round(c.min*.85);if(c.pers==='naive')c.lied=1;}c.line=say(L.tellOk.naiveK,p$());break;
  }
  c.flash='good';sfx.good();
  if(sell)UI.price=Math.min(UI.price,c.ask);else if(c.item)UI.price=Math.max(UI.price,c.offer);
  render();
}

/* ---------- 成交：收货 ---------- */
function fairNote(ratio,c){
  if(c.kind==='main'){const d=ratio<.5?-6:ratio<.8?1:ratio<1?4:7;addFeel(c.pid,d);return d;}
  if(c.kind==='fixed'||c.kind==='reg'){const d=ratio<.5?-5:ratio<.8?1:ratio<1?3:5;addRel(c.pid,d);return d;}
  return 0;
}
function dealBuy(price){
  const c=G.cust,it=c.item;
  if(price>G.cash){toast('现金不够','bad');return;}
  if(c.type!=='pawn'&&freeSlots()<it.size){toast('仓库满了，先清理库存','bad');return;}
  G.cash-=price;G.stat.spent=(G.stat.spent||0)+price;G.stat.bought=(G.stat.bought||0)+1;
  c.line=c.line&&c.flash==='good'?c.line:say(L.accept[c.pers]);
  const fv=it.fake?faceVal(it)*.5:faceVal(it),ratio=price/Math.max(1,fv);
  if(c.type==='pawn'){
    G.pawns.push({it,loan:price,due:G.day+c.days,redeemP:c.redeemP,name:c.name,pid:c.pid,snack:c.snack});
    it.cost=price;
    c.result=`借出 ${fmt(price)}，「${it.name}」进了当品柜，${dayShort(G.day+c.days)}到期。`;
    log(`收当「${it.name}」，借出 ${fmt(price)}`,'r');tot('pawn')>=20&&title('t_pawn');gs('pawn');
    if(c.snack)addFeel('tangxin',4);
  }else{
    it.cost=price;it.from=c.pid||'';addItem(it);
    let txt=`以 ${fmt(price)} 收下「${it.name}」。`;
    if(c.kind==='rand'){
      let d=ratio>=.55?1:ratio<.3?-1:0;if(c.know===0&&c.pers==='naive')d*=2;
      if(c.trans)d=Math.min(d,0)*.5;
      d=Math.round(d*(d<0?repMul():1));
      if(d)addRep(d,d>0?'收货给价公道':'压价太狠，卖家到处说');
      maybeRegular(c,ratio>=.6);
    }else fairNote(ratio,c);
    if(c.lied){addRep(-1,'哄骗老实人');}
    if(it.ban){align(-3,'收违禁品');txt+='这是违禁品，立场偏向黑道。';}
    else if(knownStolen(it)){align(-3,'明知是赃物还收');txt+='明知是赃物还收，立场偏向黑道。';}
    if(it.stolen&&c.pid==='ahui'){G.people.ahui.al=clamp(G.people.ahui.al-4,-100,100);}
    checkNotice(it);
    if(orderFits(it))setTimeout(()=>toast('这件符合悬赏的要求','good'),700);
    c.result=txt;log(`收下「${it.name}」 −${fmt(price)}`,'r');gs('buy');
  }
  sfx.coin();finish('deal');
}

/* ---------- 成交：卖货 ---------- */
function dealSell(price){
  const c=G.cust,it=c.item;
  if(c.cop&&it.ban){return bust(c,it);}
  removeItem(it,it.qty>1?1:0);
  G.cash+=price;G.stat.earned=(G.stat.earned||0)+price;G.stat.sold=(G.stat.sold||0)+1;
  const profit=price-(it.cost||0)/(it.qty>1?1:1);
  const fv=faceVal(it),ratio=price/Math.max(1,fv);
  c.line=c.line&&c.flash==='good'?c.line:say(L.accept[c.pers]);
  let txt=`以 ${fmt(price)} 卖出「${it.name}」，${profit>=0?'赚':'亏'} ${fmt(Math.abs(profit))}。`;
  if(!it.ban&&c.kind==='rand'&&!c.trans&&(it.cert||chance(.5))){const d=it.cert?2:1;addRep(d,it.cert?'卖出带鉴定书的货，客人放心':'卖出货品，客人满意');}
  if(c.kind!=='rand'){fairNote(clamp(2-ratio,0,2),c);}
  else maybeRegular(c,ratio<=1.2);
  if(it.ban){align(-3,'卖违禁品');heatUp(20,'柜台卖违禁品');tot('banSold')>=10&&title('t_bm');txt+='违禁品不涨声望，立场偏向黑道，风声变紧。';}
  else if(knownStolen(it)){align(-2,'明知是赃物还卖');txt+='明知是赃物还卖，立场偏向黑道。';}
  if(it.stolen&&it.hot>0)heatUp(Math.round(10*it.hot),'卖烫手的赃物');
  if(it.auth===0&&!it.cert){align(-2,'明知是假货还卖');}
  if(c.lied)addRep(-1,'哄骗老实人');
  if(c.addictPushed)align(-2,'趁人上瘾抬价');
  const tobaTxt=it.sub==='陀巴寇'?tobaSold(c):'';
  G.sales.push({name:it.name,price,fake:it.fake,stolen:it.stolen,hot:it.hot,over:c.over||0,warranty:c.warranty||0,day:G.day,know:c.know,pid:c.pid,it:c.warranty?{...it}:null});
  c.result=txt+tobaTxt;log(`卖出「${it.name}」 +${fmt(price)}`,'g');gs('sell');
  if(it.legend&&!it.fake)gotLegend(it);
  sfx.coin();finish('deal');
}
/* 撞上便衣 */
function bust(c,it){
  const v=faceVal(it),f=Math.round(v*.5*(G.align>=30?.5:1)*DIFFS[G.diff].fine);
  c.bust={v,fine:f,cost:bribeCost(v),p:bribeP()};
  c.line='海关便衣。人赃并获，东西没收，罚款现在就交。';
  sfx.bad();render();
}
function bustPay(){
  const c=G.cust,it=c.item;
  removeItem(it,it.qty>1?1:0);
  const f=c.bust.fine;G.cash-=f;addRep(-4,'把违禁品卖给了海关便衣');align(-6,'把违禁品卖给便衣');heatUp(20,'撞上便衣');

/* ==== 07day.js ==== */
/* 一天：日历、大事、行情、声望、立场、风声、搜查、失主、通告、悬赏、当品、售后 */
function log(t,c=''){G.log.unshift({t,c,d:G.day});if(G.log.length>120)G.log.pop();}

/* 声望、立场、风声 */
function addRep(d,why){

  G.repLog.unshift({d,why,day:G.day});if(G.repLog.length>14)G.repLog.pop();

}
const alZone=a=>a>=30?1:a<=-30?-1:0;
const alName=(a=G.align)=>a>=70?'守法模范':a>=30?'守法商户':a<=-70?'黑道大亨':a<=-30?'地下商人':'左右逢源';
const bmLv=()=>{let l=G.align<=-70?3:G.align<=-40?2:G.align<=-15?1:0;if(mainLv('mushui')>=1)l=Math.min(3,l+1);if(G.prof==='excop')l=Math.max(0,l-1);return l;};

  const nl=bmLv();if(nl!==lv)setTimeout(()=>toast(nl>lv?`黑市对你开放到第 ${nl} 层`:nl?`黑市只对你开放到第 ${nl} 层了`:'黑市不再对你开放','warn'),1500);
  if(G.align<=-100)title('t_dark');if(G.align>=100)title('t_law');
}
function heatUp(d,why){
