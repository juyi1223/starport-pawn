<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1126">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>星港当铺</title>
<style>
:root{
  --bg0:#04060d;--card:#121a36;--line:#2b3970;--text:#e8edff;--dim:#8d9bc8;
  --cyan:#4de1ff;--gold:#ffc857;--green:#58e6a0;--red:#ff5d7a;--pink:#ff7ad9;--violet:#a78bfa;--ink:#0a1024;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--text);overflow:hidden;
  font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;font-size:15px;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 700px at 50% -10%,#16204a 0,#04060d 60%)}
.num{font-family:"DIN Alternate","Bahnschrift","Segoe UI",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}
[hidden]{display:none!important}
.ic{width:1.15em;height:1.15em;flex:none}

#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overflow:clip;
  background:linear-gradient(180deg,#0d1430,#080c1c)}
@media (min-width:560px) and (min-height:700px){
  #app{height:min(100dvh,900px);border-radius:30px;border:1px solid var(--line);box-shadow:0 30px 80px #000c,0 0 0 8px #0b1126}
}

/* ---------- HUD ---------- */
#hud{flex:none;padding:calc(8px + var(--sat)) 12px 8px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(180deg,#141d42,#0e1532);border-bottom:1px solid var(--line);z-index:5}
.hud-top{display:flex;align-items:center;gap:10px}
.day{display:flex;align-items:baseline;gap:3px;font-weight:800}
.day b{font-size:17px}.day span{color:var(--dim);font-size:12px;font-weight:600}
.queue{display:flex;gap:4px;margin-right:auto;align-items:center}
.queue i{width:8px;height:8px;border-radius:50%;border:1.5px solid #4a5a94}
.queue i.done{background:#4a5a94}
.queue i.now{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.hbtn{position:relative;height:34px;min-width:34px;padding:0 10px;border-radius:10px;background:#1b2752;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700}
.hbtn:active{transform:scale(.95)}
.hbtn .dot{position:absolute;right:-3px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.hud-stats{display:grid;grid-template-columns:1.25fr 1.15fr .8fr 1fr;gap:6px}
.stat{background:#0a1028;border:1px solid #1f2a58;border-radius:10px;padding:5px 8px;display:flex;flex-direction:column;min-width:0}
.stat small{font-size:10.5px;color:var(--dim)}
.stat b{font-size:16px;line-height:1.25;white-space:nowrap}
.stat.money b{color:var(--gold)}.stat.debt b{color:var(--red)}
.pips{display:flex;gap:3px;align-items:center;height:20px}
.pips i{width:7px;height:13px;border-radius:2px;background:#26315f}
.pips i.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}

/* ---------- Scene ---------- */
#scene{position:relative;flex:1 1 0;min-height:112px;overflow:hidden;background:#0c1026}
#scene{background:
  linear-gradient(90deg,transparent calc(14% - 1px),#242e60 calc(14% - 1px),#242e60 calc(14% + 1px),transparent calc(14% + 1px)),
  linear-gradient(90deg,transparent calc(34% - 1px),#242e60 calc(34% - 1px),#242e60 calc(34% + 1px),transparent calc(34% + 1px)),
  linear-gradient(90deg,transparent calc(66% - 1px),#242e60 calc(66% - 1px),#242e60 calc(66% + 1px),transparent calc(66% + 1px)),
  linear-gradient(90deg,transparent calc(86% - 1px),#242e60 calc(86% - 1px),#242e60 calc(86% + 1px),transparent calc(86% + 1px)),
  #1c2450}
#scene .wall{position:absolute;left:0;right:0;bottom:0;width:100%;aspect-ratio:4/3;max-height:100%}
.signbox{position:absolute;left:50%;top:9px;transform:translateX(-50%);padding:3px 14px 4px 20px;border:3px solid var(--pink);border-radius:11px;background:#0a102488;color:#ffe3f8;font-size:20px;font-weight:800;letter-spacing:6px;box-shadow:0 0 12px var(--pink),inset 0 0 8px #ff7ad966;text-shadow:0 0 8px var(--pink);white-space:nowrap}
.cone{position:absolute;left:0;right:0;top:48px;bottom:0;background:radial-gradient(ellipse 70% 100% at 50% 0,#ffe9b04d,transparent 75%);clip-path:polygon(50% 0,4% 100%,96% 100%)}
.neon{animation:neon 5s infinite}
@keyframes neon{0%,91%,95%,100%{opacity:1}93%{opacity:.45}}
.tw{animation:tw 3s infinite}.tw.b{animation-delay:1.2s}
@keyframes tw{50%{opacity:.25}}
#chWrap{position:absolute;left:0;right:0;bottom:30px;top:6px;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
.ch{height:100%;max-height:300px;width:auto;aspect-ratio:200/232;overflow:visible;filter:drop-shadow(0 6px 10px #0008);transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.018) translateY(-1px)}}
.chbox{height:100%;display:flex;align-items:flex-end}
.chbox.enter{animation:enter .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{transform:translateX(-70%);opacity:0}}
.chbox.exit{animation:exit .6s ease-in forwards}
@keyframes exit{to{transform:translateX(90%);opacity:0}}
.chbox.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.chbox.hop{animation:hop .5s}
@keyframes hop{35%{transform:translateY(-14px)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}}
.ch.ghost{animation:floaty 3s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-8px)}}
.ch .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite;animation-delay:var(--bd,0s)}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.ch .mo,.ch .brow,.ch .sweat{display:none}
.ch[data-mood=neutral] .mo-neutral,.ch[data-mood=happy] .mo-happy,.ch[data-mood=angry] .mo-angry,.ch[data-mood=nervous] .mo-nervous{display:block}
.ch[data-mood=angry] .brow,.ch[data-mood=nervous] .sweat{display:block}
.ch .sweat{animation:drip 1.4s infinite}
@keyframes drip{from{transform:translateY(-4px);opacity:0}30%{opacity:1}to{transform:translateY(14px);opacity:0}}
.ch .tent path{animation:sway 2.6s ease-in-out infinite;transform-origin:50% 0;transform-box:fill-box}
.ch .tent path:nth-child(4n+1),.ch .tent path:nth-child(4n+2){animation-delay:-.9s}
@keyframes sway{50%{transform:rotate(5deg)}}
.ch .led{animation:tw 1.2s infinite}

.counter{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(180deg,#5b4a8a 0,#4a3b78 9px,#2a2150 9px,#1b1538 100%);border-top:2px solid #8f7fd0;box-shadow:0 -8px 22px #0007;display:flex;align-items:center;padding:8px 12px 0}
.counter:after{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:#0a102466}
#plate{display:flex;align-items:center;gap:6px;font-size:12px;background:#0a1024cc;border:1px solid #6f61ad;border-radius:8px;padding:3px 8px;max-width:66%;white-space:nowrap;overflow:hidden}
#plate b{font-size:13px;overflow:hidden;text-overflow:ellipsis}
#plate span{color:var(--dim)}
.pers{padding:1px 6px;border-radius:99px;font-size:11px;font-weight:700;color:var(--ink);font-style:normal}
#ctItem{position:absolute;right:16px;bottom:30px;width:62px;height:62px;z-index:2;filter:drop-shadow(0 5px 4px #000a)}
#ctItem.drop{animation:drop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes drop{from{transform:translateY(-60px) rotate(-14deg);opacity:0}}
#pat{position:absolute;right:10px;top:8px;display:flex;align-items:center;gap:4px;background:#0a1024b0;border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:11px;color:var(--dim)}
#pat i{width:9px;height:9px;border-radius:50%;background:#2a3566}
#pat i.on{background:var(--green);box-shadow:0 0 6px var(--green)}
#pat.low i.on{background:var(--red);box-shadow:0 0 6px var(--red)}
#pat i.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.9)}}
#want{position:absolute;left:10px;top:8px;background:#0a1024b0;border:1px solid var(--gold);color:var(--gold);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700}
.stamp{position:absolute;left:14px;top:26%;font-size:26px;font-weight:900;letter-spacing:4px;padding:4px 10px 4px 14px;border:4px solid;border-radius:10px;transform:rotate(-14deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1);z-index:3;background:#0a102499}
.stamp.deal{color:var(--red);border-color:var(--red)}.stamp.left{color:#9aa6cc;border-color:#9aa6cc}
@keyframes stamp{from{transform:rotate(-14deg) scale(2.6);opacity:0}}

/* ---------- Bubble + item card ---------- */
#bubble{flex:none;position:relative;margin:10px 12px 0;background:#f4f1e6;color:#1a1a2e;border-radius:14px;padding:9px 12px;min-height:44px;font-size:15px;line-height:1.45;box-shadow:0 3px 0 #b9b39d}
#bubble:before{content:"";position:absolute;left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#f4f1e6}
#bubble.sys{background:#18224a;color:#b9c4ea;box-shadow:0 3px 0 #0a1028;font-size:13.5px}
#bubble.sys:before{display:none}
#bubble .tell{display:block;font-size:12.5px;color:#b0306f;font-style:italic;margin-top:2px}
#icard{flex:none;margin:8px 12px 0;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
#icard:empty{display:none}
.ibox{position:relative;width:54px;height:54px;flex:none;border-radius:12px;background:radial-gradient(circle at 50% 35%,#27336a,#0c1230);border:1.5px solid #3a4a8a;padding:5px;overflow:hidden}
.ibox.big{width:96px;height:96px;padding:10px;border-radius:18px}
.ibox.fake{border-color:var(--red);background:radial-gradient(circle at 50% 35%,#5a1f33,#1c0c18)}
.ibox.rare{border-color:var(--pink);box-shadow:0 0 14px #ff7ad988}
.ibox.ok{border-color:var(--green)}
.ibox.scanning:after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(180deg,transparent,#4de1ffcc);animation:scanline .65s linear}
@keyframes scanline{to{top:100%}}
.isv{width:100%;height:100%;overflow:visible}
.isv.used{filter:saturate(.85)}
.isv.worn{filter:saturate(.55) brightness(.82)}
.imeta{flex:1;min-width:0}
.imeta b{font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imeta .sub{font-size:12px;color:var(--dim);margin-top:2px}
.est{color:var(--cyan);font-weight:700}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin:2px 4px 0 0;background:#ffffff14;color:var(--dim)}
.tag.fake{color:#fff;background:var(--red)}.tag.ok{color:var(--ink);background:var(--green)}
.tag.stolen{color:var(--ink);background:var(--gold)}.tag.rare{color:var(--ink);background:var(--pink)}
.iact{display:flex;gap:6px}
.rbtn{width:46px;height:46px;border-radius:13px;background:#1b2752;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;gap:1px;color:var(--cyan)}
.rbtn .ic{width:19px;height:19px}
.rbtn:disabled{opacity:.35}
.rbtn:active:not(:disabled){transform:scale(.93)}

/* ---------- Panel ---------- */
#panel{flex:none;padding:10px 12px calc(12px + var(--sab));display:flex;flex-direction:column;gap:9px;min-width:0}
#panel>*{min-width:0}
.tip{font-size:12.5px;color:var(--dim);line-height:1.5;text-align:center}
.tip b{color:var(--gold)}
.row{display:flex;gap:8px}
.grow{flex:1}
.btn{min-height:50px;border-radius:15px;padding:0 14px;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:6px;background:#22306a;box-shadow:0 4px 0 #111a40;border:1px solid #3a4a8a;transition:transform .06s,box-shadow .06s;line-height:1.15}
.btn small{font-size:11px;font-weight:600;opacity:.75;display:block}
.btn .col{display:flex;flex-direction:column;align-items:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #111a40}
.btn:disabled{opacity:.4}
.btn.pri{background:linear-gradient(180deg,#6eeaff,#2ab8de);color:#04222e;border-color:#b6f5ff;box-shadow:0 4px 0 #136583}
.btn.pri:active:not(:disabled){box-shadow:0 1px 0 #136583}
.btn.good{background:linear-gradient(180deg,#7df0b4,#35c783);color:#04291a;border-color:#c4ffe0;box-shadow:0 4px 0 #1a7a4d}
.btn.good:active:not(:disabled){box-shadow:0 1px 0 #1a7a4d}
.btn.warn{background:linear-gradient(180deg,#ffd98a,#f0a93a);color:#3a2300;border-color:#ffebbd;box-shadow:0 4px 0 #9a6412}
.btn.sq{width:50px;padding:0;flex:none;color:var(--dim)}
.btn.sm{min-height:38px;font-size:13px;border-radius:11px;padding:0 11px;box-shadow:0 3px 0 #111a40}
.pctl{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.step{height:48px;border-radius:14px;background:#1b2752;border:1px solid var(--line);font-size:26px;font-weight:700;line-height:1;color:var(--cyan);box-shadow:0 3px 0 #0d1433}
.step:active{transform:translateY(2px);box-shadow:0 1px 0 #0d1433}
.pbox{height:48px;border-radius:14px;background:#070b1c;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.pbox small{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--dim)}
.pbox input{width:120px;background:none;border:0;outline:0;color:var(--gold);font-size:25px;font-weight:800;text-align:center;font-family:"DIN Alternate","Bahnschrift","Segoe UI",system-ui,sans-serif;-webkit-user-select:text;user-select:text;padding:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--cyan) var(--f,50%),#26315f var(--f,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin-top:-10px;background:#fff;border:4px solid var(--cyan);box-shadow:0 2px 6px #0009}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#26315f}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--cyan)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--cyan)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{height:34px;border-radius:10px;background:#141d42;border:1px solid var(--line);font-size:13px;font-weight:700;color:#c3cdf2;display:flex;align-items:center;justify-content:center;gap:4px}
.chip:active:not(:disabled){background:#22306a;color:#fff}
.chip:disabled{opacity:.35;text-decoration:line-through}
.chip.sel{background:var(--cyan);color:var(--ink);border-color:#fff}
.result{border-radius:13px;padding:10px 12px;text-align:center;font-weight:700;font-size:14.5px;line-height:1.4}
.result.deal{background:#0f3324;border:1px solid var(--green);color:#b6ffd8}
.result.left{background:#2a1422;border:1px solid #7a2a44;color:#ffb9c6}
.picker{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.picker::-webkit-scrollbar{display:none}
.tile{flex:none;width:92px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
.tile .ibox{width:50px;height:50px}
.tile b{font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{color:var(--cyan);font-weight:700;font-size:11px}
.tile.match{border-color:var(--gold);box-shadow:0 0 12px #ffc85755}
.tile:disabled{opacity:.35}
.tile:active:not(:disabled){transform:scale(.95)}

/* ---------- Sheets / overlays ---------- */
#shade{position:absolute;inset:0;background:#000a;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#shade.show{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;z-index:41;background:#0f1634;border-top:1px solid var(--cyan);border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s .28s;display:flex;flex-direction:column;box-shadow:0 -10px 40px #000a}
#sheet.show{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility 0s}
#sheet .grab{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
#sheet .grab h2{margin:0;font-size:16px}
#sheet .body{overflow:auto;padding:8px 14px calc(18px + var(--sab));-webkit-overflow-scrolling:touch}
.xbtn{width:34px;height:34px;border-radius:50%;background:#1b2752;display:grid;place-items:center;color:var(--dim)}
.invrow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.invrow.match{border-color:var(--gold)}
.invrow .top{display:flex;gap:10px;align-items:center}
.invrow .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.invrow .acts .btn{flex:1 1 auto}
.empty{border:1.5px dashed #2b3970;border-radius:14px;padding:12px;text-align:center;color:#4a5a94;font-size:13px;margin-bottom:8px}
.order{background:linear-gradient(135deg,#3a2a08,#1c1a36);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.55;color:#f1e3bd}
.order b{color:var(--gold)}
.order .ic{display:inline-block;vertical-align:-3px;color:var(--gold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:12px 0}
.kv span:nth-child(odd){color:var(--dim)}
.logrow{font-size:13px;padding:6px 0;border-bottom:1px solid #ffffff0c;color:var(--dim)}
.logrow.g{color:var(--green)}.logrow.r{color:#ff9bb0}.logrow.y{color:var(--gold)}
.menu .btn{width:100%;margin-bottom:10px;justify-content:flex-start}
.help p{line-height:1.7;color:#c9d3f5;margin:0 0 10px;font-size:14px}
.help b{color:var(--gold)}

#overlay{position:absolute;inset:0;z-index:30;background:linear-gradient(180deg,#0d1430,#070a18);display:none;flex-direction:column}
#overlay.show{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
#overlay .scroll{flex:1;overflow:auto;padding:calc(18px + var(--sat)) 16px 16px;-webkit-overflow-scrolling:touch}
#overlay .foot{flex:none;padding:10px 16px calc(14px + var(--sab));border-top:1px solid var(--line);background:#0b1126;display:flex;gap:8px}
h1{margin:0;font-size:24px;letter-spacing:1px}
h3{margin:20px 0 8px;font-size:14px;color:var(--cyan);letter-spacing:1px;display:flex;align-items:center;gap:6px}
.sub{color:var(--dim);font-size:13px}
.pl{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;font-weight:800;font-size:15px}
.pl.up{background:#0f3324;color:var(--green)}.pl.dn{background:#2a1422;color:var(--red)}
.ev{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:12px;padding:10px;margin-bottom:8px;font-size:13.5px;line-height:1.5}
.ev .ic{width:22px;height:22px;margin-top:1px;color:var(--cyan)}
.ev.bad{border-left-color:var(--red)}.ev.bad .ic{color:var(--red)}
.ev.good{border-left-color:var(--green)}.ev.good .ic{color:var(--green)}
.ev.warn{border-left-color:var(--gold)}.ev.warn .ic{color:var(--gold)}
.bank{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.bar{height:10px;border-radius:5px;background:#26315f;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--cyan));border-radius:5px}
.bank .line{display:flex;justify-content:space-between;font-size:13px;color:var(--dim)}
.bank .line b{color:var(--text)}
.upg{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:8px}
.upg .uic{width:40px;height:40px;border-radius:11px;background:#1b2752;display:grid;place-items:center;color:var(--cyan);flex:none}
.upg .uic .ic{width:22px;height:22px}
.upg .ut{flex:1;min-width:0;font-size:12.5px;color:var(--dim)}
.upg .ut b{display:block;font-size:14.5px;color:var(--text)}
.upg.owned{opacity:.5}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(20px + var(--sat)) 22px 10px;text-align:center;gap:6px;overflow:auto}
.logo{font-size:46px;font-weight:900;letter-spacing:8px;color:#fff;text-shadow:0 0 8px #fff,0 0 22px var(--pink),0 0 46px var(--pink);margin:0 0 0 8px;animation:neon 6s infinite}
.logo-sub{letter-spacing:5px;color:var(--cyan);font-size:11.5px;font-weight:700}
.lineup{display:flex;justify-content:center;align-items:flex-end;height:150px;margin:14px 0 4px;width:100%;border-bottom:3px solid #8f7fd0;flex:none}
.lineup .ch{height:130px;max-height:none;margin:0 -8px}
.lineup .ch:nth-child(2){height:150px}
.story{line-height:1.75;color:#c9d3f5;font-size:14px;text-align:left;margin:8px 0}
.story b{color:var(--gold)}
.end-ch{width:150px;height:174px;margin:0 auto;flex:none}
.grade{font-size:64px;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 0 24px #ffc857aa}
#toast{position:absolute;left:0;right:0;top:calc(100px + var(--sat));z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#0a1024f2;border:1px solid var(--cyan);border-radius:16px;padding:8px 16px;font-size:13.5px;font-weight:700;max-width:90%;text-align:center;animation:toast 3s forwards;box-shadow:0 6px 20px #000a}
.toast.bad{border-color:var(--red);color:#ffc2cd}.toast.good{border-color:var(--green);color:#c2ffe0}.toast.warn{border-color:var(--gold);color:#ffe9b8}
@keyframes toast{0%{transform:translateY(-12px);opacity:0}7%,85%{transform:none;opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.fly{position:absolute;z-index:61;font-weight:900;font-size:24px;pointer-events:none;animation:fly 1.1s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
@media (max-height:640px){
  #bubble{font-size:14px;margin-top:8px;padding:7px 10px}
  .btn{min-height:46px}.step,.pbox{height:44px}
  #icard{padding:6px}#icard .ibox{width:46px;height:46px}
  #panel{gap:7px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>

}

function makeItem(){
  const t=pick(ITEMS);
  return {id:++uid,k:t.k,name:t.n,cat:t.c,desc:t.d,
    base:Math.round(rand(t.v[0],t.v[1])),cond:rand(.4,1),

    stolen:false,noise:rand(-.6,.6),scanned:false,cost:0};
}
const apparent=it=>Math.max(5,Math.round(it.base*it.cond*(it.rare?2.5:1)*G.market[it.cat]));
const realVal=it=>it.fake?Math.max(3,Math.round(apparent(it)*.08)):apparent(it);
function estRange(it){
  if(it.scanned){const v=realVal(it);return [v,v];}
  const c=apparent(it)*(1+it.noise*G.estW);
  return [Math.round(c*(1-G.estW)),Math.round(c*(1+G.estW))];
}
const estText=it=>{const [a,b]=estRange(it);return a===b?fmt(a):`${fmt(a)}~${fmt(b)}`};

function makeCustomer(forceCollector){
  const pk=pick(Object.keys(PERS)),P=PERS[pk];
  const buyerP=Math.min(.7,.3+G.inv.length*.1);
  const isBuyer=forceCollector||(G.inv.length>0&&Math.random()<buyerP);
  const c={id:++uid,look:genLook(forceCollector),name:genName(),pk,type:isBuyer?'buy':'sell',done:null,tell:'',flash:'',used:{}};
  c.patience=Math.max(1,ri(...P.pat)+(G.rep>=70?1:0)-(G.rep<30?1:0));c.patMax=c.patience;
  if(!isBuyer){
    const it=makeItem();
    if(!it.fake)it.stolen=Math.random()<.12;
    c.item=it;
    const ap=apparent(it);
    let mf=rand(...P.min)*.85;
    c.knowsFake=it.fake&&Math.random()<.7;
    if(c.knowsFake)mf*=.4;
    if(it.stolen)mf*=.65;
    c.min=Math.max(4,Math.round(ap*mf));
    c.ask=Math.max(Math.round(c.min*1.08)+1,Math.round(ap*rand(...P.ask)));
    if(c.knowsFake&&Math.random()<.55)c.tell=pick(L.fakeTell);
    else if(it.stolen&&Math.random()<.55)c.tell=pick(L.stolenTell);
    if(G.pawns.length<G.pawnCap&&G.day+2<=G.maxDay&&Math.random()<.3){
      const d=Math.min(ri(2,3),G.maxDay-G.day);
      c.pawn=d;
      c.min=Math.max(4,Math.round(c.min*.75));
      c.ask=Math.max(c.min+2,Math.round(Math.min(c.ask,ap*1.1)*.7));
      c.redeem=!c.knowsFake&&Math.random()<(it.stolen?.3:P.redeem);
      c.line=say(L.pawnGreet,{item:it.name,p:c.ask,d});
    }else c.line=say(L.sellGreet[pk],{item:it.name,p:c.ask});
  }else{
    if(forceCollector){c.collector=true;c.want=G.collector;G.collector=null;c.line=say(L.collectorGreet,{cat:c.want});}
    else if(Math.random()<.15){c.want='any';c.line=pick(L.anyGreet);}
    else{c.want=Math.random()<.85?pick(G.inv).cat:pick(CATS);c.line=say(L.buyGreet[pk],{cat:c.want});}
    c.maxF=rand(...P.buy)*1.15*(c.collector?1.6:1)*(.9+G.rep/500);
  }
  return c;
}

function dealBuy(price){
  const c=G.cust;
  if(noRoom(c)){toast(c.pawn?'当品柜已满':'仓库已满，先清理库存','bad');return;}
  if(price>G.credits){toast('现金不够','bad');return;}
  G.credits-=price;G.stat.bought++;G.stat.spent+=price;
  c.line=pick(L.accept);
  if(c.pawn){
    G.pawns.push({item:c.item,loan:price,due:G.day+c.pawn,redeem:c.redeem,name:c.name});
    c.result=`借出 ${fmt(price)}，「${c.item.name}」入当品柜，第 ${G.day+c.pawn} 天到期`;
    log(`典当「${c.item.name}」借出 −${fmt(price)}`,'r');
  }else{
    c.item.cost=price;G.inv.push(c.item);
    c.result=`以 ${fmt(price)} 收购「${c.item.name}」`;
    log(`收购「${c.item.name}」 −${fmt(price)}`,'r');
  }
  sfx.coin();flyText('−'+fmt(price),'#ff5d7a');
  finish('deal');
}
function dealSell(price){
  const c=G.cust,it=c.item;
  G.inv=G.inv.filter(x=>x!==it);G.credits+=price;
  const profit=price-it.cost;
  G.stat.sold++;G.stat.earned+=price;
  G.sales.push({name:it.name,price,fake:it.fake,stolen:it.stolen,warranty:!!c.warranty});
  G.rep=clamp(G.rep+(c.collector?3:1));
  c.line=pick(L.accept);c.result=`以 ${fmt(price)} 卖出「${it.name}」，${profit>=0?'赚':'亏'} ${fmt(Math.abs(profit))}`;
  log(`卖出「${it.name}」 +${fmt(price)}（${profit>=0?'赚':'亏'} ${fmt(Math.abs(profit))}）`,'g');
  sfx.coin();flyText('+'+fmt(price),'#58e6a0');
  finish('deal');
}
function leave(insulted){

function offerToSeller(o){
  const c=G.cust;if(!(o>0))return;
  if(noRoom(c)){toast(c.pawn?'当品柜已满':'仓库已满，先清理库存','bad');return;}
  if(o>G.credits){toast('现金不够','bad');return;}
  if(o>=c.ask)return dealBuy(c.ask);
  const span=Math.max(1,c.ask-c.min);
  if(o>=c.min&&(o-c.min)/span>rand(.2,.6))return dealBuy(o);
  const insulted=o<c.min*.55,close=!insulted&&o<c.min&&o>=c.min*.85;
  c.patience-=insulted?2:1;
  if(c.patience<=0)return leave(insulted);
  if(o>=c.min){c.ask=Math.max(c.min,Math.round(c.ask-(c.ask-o)*rand(.3,.55)));
    if((c.ask-o)/c.ask<.04)return dealBuy(o);}
  else c.ask=Math.max(c.min,Math.round(c.ask-span*rand(.08,.22)));
  c.line=insulted?pick(L.insult)+' '+say(L.counterSell,{p:c.ask}):say(close?L.closeSell:L.counterSell,{p:c.ask});
  c.flash=insulted?'insult':'counter';
  if(insulted)sfx.bad();else sfx.click();
  UI.price=Math.min(UI.price,c.ask);
  render();
}
function showItem(id){
  const c=G.cust,it=G.inv.find(x=>x.id==id);if(!it||!c||c.done||c.type!=='buy'||!wants(c,it))return;
  c.item=it;const ap=apparent(it);
  c.max=Math.round(ap*c.maxF);

}
function priceToBuyer(p){
  const c=G.cust;if(!(p>0))return;
  if(p<=c.offer)return dealSell(c.offer);
  const span=Math.max(1,c.max-c.offer);
  if(p<=c.max&&(c.max-p)/span>rand(.2,.6))return dealSell(p);
  const insulted=p>c.max*1.6,close=!insulted&&p>c.max&&p<=c.max*1.15;
  c.patience-=insulted?2:1;
  if(c.patience<=0)return leave(insulted);
  if(p<=c.max){c.offer=Math.min(c.max,Math.round(c.offer+(p-c.offer)*rand(.3,.55)));
    if((p-c.offer)/p<.04)return dealSell(p);}
  else c.offer=Math.min(c.max,Math.round(c.offer+span*rand(.08,.22)));
  c.line=insulted?pick(L.insult)+' '+say(L.counterBuy,{p:c.offer}):say(close?L.closeBuy:L.counterBuy,{p:c.offer});
  c.flash=insulted?'insult':'counter';
  if(insulted)sfx.bad();else sfx.click();
  UI.price=Math.max(UI.price,c.offer);
  render();
}
// 话术：每位顾客每种只能用一次
function tactic(t){
  const c=G.cust;if(!c||c.done||c.used[t]||!c.item)return;
  c.used[t]=1;const it=c.item,P=PERS[c.pk];let ok=true,cost=0;
  if(t==='chat'){
    ok=Math.random()<P.chat;
    if(ok){c.patience++;c.patMax=Math.max(c.patMax,c.patience);
      if(c.type==='sell')c.min=Math.round(c.min*.94);else{c.maxF*=1.05;c.max=Math.round(c.max*1.05);}
      c.line=pick(L.chatOk);}
    else{cost=c.pk==='impatient'?1:0;c.line=pick(L.chatNo);}
  }else if(t==='flaw'){
    ok=it.cond<.65;
    if(ok){c.min=Math.round(c.min*.92);c.ask=Math.max(c.min+1,Math.round(c.ask*.86));c.line=say(L.flawOk,{p:c.ask});}
    else{cost=1;c.line=pick(L.flawNo);}
  }else if(t==='doubt'){
    if(c.knowsFake){c.min=Math.max(2,Math.round(c.min*.5));c.ask=Math.max(c.min+1,Math.round(c.ask*.45));c.tell='对方的脸色一下子变了';c.line=say(L.doubtFake,{p:c.ask});}
    else if(it.fake){ok=false;c.line=pick(L.doubtUnsure);}
    else{ok=false;cost=1;c.line=pick(L.doubtReal);}
  }else if(t==='pitch'){
    ok=it.cond>.65||(it.rare&&!it.fake);
    if(ok){c.max=Math.round(c.max*1.12);c.offer=Math.min(c.max,Math.round(c.offer*1.08));c.line=say(L.pitchOk,{p:c.offer});}
    else{cost=1;c.line=pick(L.pitchNo);}
  }else if(t==='warranty'){
    c.warranty=true;c.max=Math.round(c.max*1.15);c.offer=Math.min(c.max,Math.round(c.offer*1.1));c.line=say(L.warranty,{p:c.offer});
  }
  c.patience-=cost;
  if(c.patience<=0)return leave(false);
  c.flash=ok?'good':cost?'insult':'counter';
  if(ok)sfx.good();else if(cost)sfx.bad();else sfx.click();
  if(c.type==='sell')UI.price=Math.min(UI.price,c.ask);else UI.price=Math.max(UI.price,c.offer);
  render();
}

const rentOf=d=>15+d*5;
function closeShop(){
  const m=[];
  for(const s of G.sales){
    if(s.fake&&s.warranty){G.credits-=s.price;G.rep=clamp(G.rep-15);
      m.push({i:'angry',c:'bad',t:`你承诺包退的「${s.name}」被验出是赝品。全额退款 ${fmt(s.price)}，声望 −15`});}
    else if(s.fake&&Math.random()<.55){const r=Math.round(s.price*.5);G.credits-=r;G.rep=clamp(G.rep-12);
      m.push({i:'angry',c:'bad',t:`买走「${s.name}」的顾客发现是赝品，回来大闹一场。退赔 ${fmt(r)}，声望 −12`});}
    else if(s.stolen&&Math.random()<.25){G.rep=clamp(G.rep-5);m.push({i:'alert',c:'warn',t:`「${s.name}」的失主在黑市认出了自己的东西。声望 −5`});}
  }
  G.sales=[];
  const ev=rollEvent();if(ev)m.push(ev);
  const rent=rentOf(G.day);G.credits-=rent;m.push({i:'home',c:'',t:`支付摊位租金 ${fmt(rent)}`});
  while(G.credits<0&&G.inv.length){
    G.inv.sort((a,b)=>realVal(b)-realVal(a));const it=G.inv.shift(),v=wholesaleVal(it);
    G.credits+=v;m.push({i:'down',c:'bad',t:`现金不足，被迫贱卖「${it.name}」 +${fmt(v)}`});
  }
  G.cust=null;
  if(G.credits<0)return gameOver('你付不起租金。管理局查封了当铺，你被塞进了下一班去矿星的货船……');
  G.endMsgs=m;G.phase='night';UI.repay=null;save();render();showNight();
}
function rollEvent(){
  const r=Math.random();
  if(r<.18){
    const st=G.inv.filter(i=>i.stolen);
    if(st.length&&!G.upg.shield){G.inv=G.inv.filter(i=>!i.stolen);const f=st.length*80;G.credits-=f;G.rep=clamp(G.rep-8);
      return {i:'alert',c:'bad',t:`海关突击检查！没收赃物「${st.map(i=>i.name).join('」「')}」，罚款 ${fmt(f)}，声望 −8`};}
    return {i:'shield',c:'good',t:st.length?'海关突击检查……信号屏蔽柜完美藏住了可疑物品。':'海关突击检查，店里干干净净，检查员悻悻离开。'};
  }
  if(r<.4){const c=pick(CATS),up=Math.random()<.5;G.market[c]*=up?1.45:.65;
    return up?{i:'up',c:'good',t:`银河新闻：${c}类商品需求暴涨！`}:{i:'down',c:'warn',t:`银河新闻：${c}类商品市场崩盘……`};}
  if(r<.46&&G.inv.length){
    if(G.upg.guard)return {i:'bot',c:'good',t:'夜里有小偷摸进店里，被安保机器人电晕后扔出了气闸。'};
    const it=pick(G.inv);G.inv=G.inv.filter(x=>x!==it);return {i:'mask',c:'bad',t:`夜里遭了贼，「${it.name}」被偷走了！`};}

  if(r<.7){const c=pick(CATS);G.collector=c;return {i:'hat',c:'good',t:`传闻一位富有的收藏家明天会来，对${c}类物品很感兴趣。`};}
  return null;
}

/* ===================== 渲染 ===================== */
function log(t,c=''){G.log.unshift({t,c,d:G.day});if(G.log.length>80)G.log.pop();}
function moodOf(c){
  if(c.done==='deal')return 'happy';
  if(c.done==='left')return c.angryLeft?'angry':'neutral';
  if(c.flash==='insult'||(c.patMax>1&&c.patience<=1))return 'angry';
  if(c.flash==='good')return 'happy';
  if(c.tell)return 'nervous';
  return c.collector?'happy':'neutral';
}
function fillRange(r){r.style.setProperty('--f',((r.value-r.min)/Math.max(1,r.max-r.min)*100)+'%');}
function renderHud(){
  $('#sDay').textContent=`第${G.day}天`;$('#sDayMax').textContent='/'+G.maxDay;
  tweenCred(G.credits);
  $('#sDebt').textContent=fmt(G.debt);
  const rep=$('#sRep');rep.textContent=Math.round(G.rep);rep.style.color=G.rep>=70?'var(--green)':G.rep<30?'var(--red)':'';
  $('#sScan').innerHTML=Array.from({length:G.scansMax},(_,i)=>`<i class="${i<G.scans?'on':''}"></i>`).join('');
  const active=G.cust&&!G.cust.done,servedN=G.custPerDay-G.left-(active?1:0);
  $('#queue').innerHTML=Array.from({length:G.custPerDay},(_,i)=>`<i class="${i<servedN?'done':i===servedN&&active?'now':''}"></i>`).join('');

}
function typeLine(el,text){
  clearInterval(UI.typeT);let i=0;el.textContent='';
  UI.typeT=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(i>=text.length)clearInterval(UI.typeT);},24);
}
function renderScene(){
  const c=G.cust,wrap=$('#chWrap');
  if(!c){wrap.innerHTML='';UI.custId=0;$('#plate').innerHTML=`<span>${G.left>0?'门外有顾客在等':'今天没有顾客了'}</span>`;
    $('#pat').hidden=true;$('#want').hidden=true;$('#ctItem').innerHTML='';$('#stampWrap').innerHTML='';return;}
  const mood=moodOf(c);
  if(UI.custId!==c.id){UI.custId=c.id;wrap.innerHTML=`<div class="chbox enter">${drawChar(c.look,mood)}</div>`;UI.itemShown=0;}
  else{
    const box=wrap.firstElementChild,svg=box.querySelector('.ch');svg.dataset.mood=mood;
    box.classList.remove('enter','shake','hop');void box.offsetWidth;
    if(c.done==='left')box.classList.add('exit');
    else if(c.done==='deal'||c.flash==='good')box.classList.add('hop');
    else if(c.flash==='insult')box.classList.add('shake');
  }
  const P=PERS[c.pk];
  $('#plate').innerHTML=`<b>${c.name}</b><span>${SPECIES[c.look.sp].n}</span><i class="pers" style="background:${P.col}">${P.n}</i>`;
  const pat=$('#pat');pat.hidden=!!c.done;pat.className=c.patience<=1&&c.patMax>1?'low':'';
  pat.innerHTML='耐心'+Array.from({length:c.patMax},(_,i)=>`<i class="${i<c.patience?'on':i===c.patience&&c.flash?'pop':''}"></i>`).join('');
  const want=$('#want'),wt=c.done?'':c.type==='buy'?(c.collector?'收藏家 · ':'')+'想买：'+(c.want==='any'?'什么都行':c.want+'类'):c.pawn?`典当 · ${c.pawn} 天后来赎`:'';
  want.hidden=!wt;want.textContent=wt;
  const ci=$('#ctItem');
  if(c.item&&c.done!=='deal'){if(UI.itemShown!==c.item.id){UI.itemShown=c.item.id;ci.className='';void ci.offsetWidth;ci.className='drop';}ci.innerHTML=itemSvg(c.item);}
  else{ci.innerHTML='';UI.itemShown=0;}
  $('#stampWrap').innerHTML=c.done==='deal'?'<div class="stamp deal">成交</div>':c.done==='left'&&c.angryLeft?'<div class="stamp left">告吹</div>':'';
}
function renderBubble(){
  const c=G.cust,b=$('#bubble');
  if(!c){b.className='sys';const t=G.left>0?(G.stat.served===0?G.news:'店里很安静，只有通风管道的嗡嗡声。'):'今天的顾客都接待完了，可以打烊了。';

function renderItemCard(){

   <div class="imeta"><b>${it.name}</b>${tagsOf(it)}<div class="sub">${condWord(it.cond)} · ${it.scanned?'实值':'估'} <span class="est num">${estText(it)}</span></div></div></button>

function priceBounds(){const c=G.cust;return c.type==='sell'?[1,Math.max(1,c.ask)]:[c.offer,c.sliderMax];}
function setPrice(v,quiet){
  const c=G.cust;if(!c||c.done)return;
  const [lo,hi]=priceBounds();v=clamp(Math.round(v)||lo,lo,hi);
  if(v!==UI.price&&!quiet)sfx.tick();

  const a=$('#amt'),r=$('#rng'),m=$('#mainP');
  if(a&&document.activeElement!==a)a.value=v;
  if(r){r.value=v;fillRange(r);}

const TACTICS={sell:[['flaw','挑毛病'],['doubt','质疑真伪'],['chat','套近乎']],buy:[['pitch','夸货'],['warranty','承诺包退'],['chat','套近乎']]};

  }else if(c.type==='sell'||c.item){

    h+=`<div class="tip">${full?(c.pawn?'<b>当品柜已满</b>。':'<b>仓库已满</b>，先到库存里批发掉一些。')
        :c.pawn?`对方想借 <b class="num">${fmt(c.ask)}</b>　到期赎回你赚三成，不赎东西归你`

        :`对方出价 <b class="num">${fmt(c.offer)}</b>　进价 <span class="num">${fmt(c.item.cost)}</span>　估 <span class="num">${estText(c.item)}</span>`}</div>
     <div class="pctl"><button class="step" data-step="-1" aria-label="减少">−</button>
      <label class="pbox"><small>${c.pawn?'你借':sell?'你出':'你要'}</small><input id="amt" type="text" inputmode="numeric" pattern="[0-9]*" value="${UI.price}" aria-label="价格"></label>
      <button class="step" data-step="1" aria-label="增加">+</button></div>
     <input type="range" id="rng" min="${lo}" max="${hi}" value="${UI.price}" aria-label="价格滑块">
     <div class="chips">${TACTICS[c.type].map(([k,n])=>`<button class="chip" data-act="tactic" data-id="${k}" ${c.used[k]?'disabled':''}>${n}</button>`).join('')}</div>
     <div class="row"><button class="btn sq" data-act="dismiss" aria-label="送客">${ic('door')}</button>
      <button class="btn pri grow" data-act="${sell?'offer':'price'}" ${full?'disabled':''}><span class="col">${c.pawn?'放款':sell?'出价':'报价'}<small class="num" id="mainP">${fmt(UI.price)}</small></span></button>
      <button class="btn good grow" data-act="${sell?'acceptAsk':'acceptOffer'}" ${sell&&(full||c.ask>G.credits)?'disabled':''}><span class="col">${c.pawn?'照数借出':sell?'照价收下':'照价卖出'}<small class="num">${fmt(sell?c.ask:c.offer)}</small></span></button></div>`;
  }else{
    const has=G.inv.some(i=>wants(c,i));
    h+=`<div class="tip">${has?'挑一件给对方看（亮框的是对方想要的）':'库存里没有对方想要的东西。'}</div>`;
    if(G.inv.length)h+=`<div class="picker">${[...G.inv].sort((a,b)=>wants(c,b)-wants(c,a)).map(it=>`<button class="tile ${wants(c,it)?'match':''}" data-act="show" data-id="${it.id}" ${wants(c,it)?'':'disabled'}>${ibox(it)}<b>${it.name}</b><span class="num">${estText(it)}</span></button>`).join('')}</div>`;
    h+=`<div class="row"><button class="btn grow" data-act="dismiss">${ic('door')}${has?'不卖了，送客':'抱歉，没货'}</button></div>`;
  }
  el.innerHTML=h;
  const r=$('#rng'),a=$('#amt');

  acceptOffer:()=>dealSell(G.cust.offer),
  tactic:id=>tactic(id),
  scanCur:()=>scan(G.cust&&G.cust.item),
  scanInv:id=>scan(invItem(id)),
  scanPawn:id=>{const p=G.pawns.find(p=>p.item.id==id);scan(p&&p.item);},
  show:id=>showItem(id),
  swap:()=>{const c=G.cust;c.item=null;c.flash='counter';c.warranty=false;c.patience--;if(c.patience<=0)return leave(false);c.line='还有别的吗？';render();},
  wholesale:id=>wholesale(id),
  fix:id=>fixItem(id),
  deliver:id=>deliver(id),
  dismiss:()=>{const c=G.cust;if(!c||c.done)return;
    c.line=pick(c.type==='buy'&&!G.inv.some(i=>wants(c,i))?L.noMatch:L.refuse);
    c.result='你请顾客离开了';log(`送走了 ${c.name}`);finish('left');},
  detail:()=>openDetail(G.cust&&G.cust.item),
  inv:openInv,menu:openMenu,log:openLog,help:openHelp,closeSheet,
  mute:()=>{muted=!muted;ls.set('starpawn-mute',muted?'1':'0');openMenu();},
  title:()=>{closeSheet();if(G&&G.cust&&!G.cust.done){G.left++;}G=null;showTitle();},
  repay:()=>repay(UI.repay),
  buyUpg:id=>buyUpg(id),
  nextDay:nextDay,
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const f=ACT[b.dataset.act];if(f)f(b.dataset.id,b);
});
let holdT=0,holdI=0;
function stepOnce(dir){const [lo,hi]=priceBounds();setPrice(UI.price+dir*Math.max(1,Math.round((hi-lo)/60)));}
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.step');if(!b||!G||!G.cust||G.cust.done)return;
  const dir=+b.dataset.step;stepOnce(dir);
  clearTimeout(holdT);clearInterval(holdI);
  holdT=setTimeout(()=>{holdI=setInterval(()=>stepOnce(dir),60);},350);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,()=>{clearTimeout(holdT);clearInterval(holdI);},true));
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input'))e.preventDefault();});

$('#menuBtn').innerHTML=ic('menu');$('#sheetX').innerHTML=ic('x');
showTitle();
</script>
</body>
</html>
