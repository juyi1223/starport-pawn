}
const heatWord=h=>h>=75?'很紧':h>=50?'紧':h>=25?'有点紧':'松';

/* 大事 */
function evFx(){
  if(!G||!G.ev||G.day<G.ev.from||G.day>G.ev.to)return {};
  const E=EVENTS[G.ev.k],fx={...E.fx};
  if(fx.hype){const i=G.day-G.ev.from,len=G.ev.to-G.ev.from;fx.m={[G.ev.cat]:i>=len-1?.6:1+.18*(i+1)};}
  if(fx.heat)fx.heatFloor=fx.heat;
  return fx;
}
const evNow=()=>G.ev&&G.day>=G.ev.from&&G.day<=G.ev.to?G.ev:null;
const evName=e=>EVENTS[e.k].n+(e.cat?`（${e.cat}）`:'');
function startEvent(k,from){
  const E=EVENTS[k];G.ev={k,from,to:from+E.d-1};
  if(E.fx.hype)G.ev.cat=pick(['古董','珠宝']);
  if(E.fx.bigCase)G.bigCase=1;
}
function planEvents(news){
  const c=cal();
  if(!GD('event'))return;
  /* 固定日期：每季对应周的周一开始；每季最后一天大拍卖会 */
  const fx=FIXEV.find(f=>f.s===c.s&&f.w===c.w&&c.wd===0);
  if(fx&&!evNow()){startEvent(fx.k,G.day);news.push({i:'bell',c:'warn',t:EVENTS[fx.k].n,d:EVENTS[fx.k].news});G.evNext=null;return;}
  if(c.wd===6&&c.w===4&&!evNow()){startEvent('auction',G.day);news.push({i:'bell',c:'warn',t:'大拍卖会',d:EVENTS.auction.news+(G.star>=3||mainLv('tangyuan')>=2?'你可以把货送上拍。':'三星以上的店，或者和小汤圆成了朋友，才能送货上拍。')});return;}
  if(G.evNext&&G.evNext.day===G.day&&!evNow()){startEvent(G.evNext.k,G.day);const E=EVENTS[G.evNext.k];news.push({i:'bell',c:'warn',t:E.n,d:E.news.replace('{cat}',G.ev.cat||'')});G.evNext=null;return;}
  if(!G.evNext&&!evNow()&&G.day>3&&chance(.14)){
    const k=pick(EVR);const sudden=['blackout','bigcase','gangwar'].includes(k);
    G.evNext={k,day:G.day+(sudden?1:ri(2,3)),sudden};
  }
  if(G.evNext&&!G.evNext.sudden){
    const left=G.evNext.day-G.day;
    if(left===1)news.push({i:'bell',c:'',t:'明天',d:`早报：${EVENTS[G.evNext.k].n}要来了。`});
    else if(left<=3&&mainLv('tangxin')>=1)news.push({i:'chat',c:'',t:'唐心的消息',d:`唐心说她店里的客人在聊：过两天可能有「${EVENTS[G.evNext.k].n}」。`});
  }
}

/* 行情：季节底色 × 走势 × 大事 */
function rollMarket(news){
  const fx=evFx(),s=cal().s,changed=[];
  if(!GD('mkt')){for(const c of CATS)G.mk[c]=1;for(const b of BANS)G.mk[BAN+b]=1;return;}
  G.mkh=G.mkh||{};
  rumorDue(news);
  /* 走势：每类货朝一个目标价慢慢走，走三到六天，到了再换目标 */
  const step=(key,lo,hi,flat)=>{
    let t=G.trend[key];
    if(!t||t.v==null)t=G.trend[key]={v:(t&&t.m)||1,tgt:1,to:G.day-1};
    if(G.day>t.to){const r=Math.random();t.tgt=r<flat?1:r<flat+(1-flat)/2?+rand(1.15,hi).toFixed(2):+rand(lo,.88).toFixed(2);t.to=G.day+ri(3,6);}
    t.v=+clamp(t.v+(t.tgt-t.v)*rand(.3,.5)+rand(-.025,.025),.5,1.8).toFixed(3);
    return t.v;
  };
  const keep=(key,m)=>{(G.mkh[key]=G.mkh[key]||[]).push(m);if(G.mkh[key].length>7)G.mkh[key].shift();};
  for(const c of CATS){
    const m=+(step(c,.6,1.6,.4)*(SEASONM[s][c]||1)*((fx.m&&fx.m[c])||1)).toFixed(2);
    if(Math.abs(m-(G.mk[c]||1))>=.1)changed.push([c,m]);
    G.mk[c]=m;keep(c,m);
  }
  for(const b of BANS){const m=+step(BAN+b,.8,1.3,.5).toFixed(2);G.mk[BAN+b]=m;keep(BAN+b,m);}
  if(news&&changed.length){
    changed.sort((a,b)=>Math.abs(b[1]-1)-Math.abs(a[1]-1));
    news.push({i:'up',c:'',t:'行情',d:changed.slice(0,3).map(([c,m])=>Math.abs(m-1)<.06?`${c}回到平常`:`${c}${m>=1?'涨到':'跌到'} ${Math.round(m*100)}%`).join('，')+(changed.length>3?'，其他也有变化。':'。')+'点顶上的「行情」看走势。'});
  }
}
/* 唐心的行情预告：提前一天 */
function forecast(){

/* 搜查 */
function raidBase(){

}
const exposedOf=()=>G.inv.filter(i=>!i.safe&&(i.ban||i.stolen));

}

}
const weekOf=d=>Math.floor((d-1)/7);

}
/* 搜查发生：生成一个等玩家决定的事件 */
function raid(when){

  tot('raid');
  /* 木水寄存的箱子进不了保险箱，查到算你的 */
  let cr='';
  if(G.crate){const f=Math.min(Math.max(0,G.cash),G.crate.fee*3);G.cash-=f;G.crate=null;align(-3,'被查到替人保管违禁品');cr=`检查员撬开了木水寄存的箱子：两箱陀巴寇，没收，罚款 ${fmt(f)}。`;log(`木水的箱子被查 −${fmt(f)}`,'r');}
  if(cr&&!found.length){heatUp(12);return {i:'alert',c:'bad',t:when==='close'?'打烊时海关突击检查':'深夜海关检查',d:cr+'别的没查到什么。'};}
  if(cr){heatUp(12);setTimeout(()=>toast(cr,'bad'),900);}
  if(!found.length){

  }

  G.pend={type:'raid',when,ids:found.map(i=>i.id),fine,cost:bribeCost(v),p:bribeP(),bail:mainLv('mushui')>=3&&weekOf(G.bail)!==weekOf(G.day)};

}
function raidResolve(how){

  if(how==='bail'){G.bail=G.day;addFeel('mushui',-5);align(-5,'找木水摆平搜查');d='木水的人来了，跟检查员说了几句，检查员就走了。你欠木水一个人情。';}

    else{const f=Math.round(p.fine*1.5);items.forEach(i=>removeItem(i));G.cash-=f;addRep(-8,'贿赂检查员没成');align(-6,'行贿未遂');heatUp(25);d=`贿赂没成，罪加一等：${items.length} 件货被没收，罚款 ${fmt(f)}，贿赂的钱也没了。`;}

/* 早上：失窃通告 */
function makeNotices(news){

/* 悬赏 */
function makeOrder(){
  if(G.order||chance(.55))return null;

    const mid=sum(catItems(c),t=>t.mid)/catItems(c).length;o={src,cat:c,g,mul:+(1.5*(src==='law'&&mainLv('funi')>=1?1.3:1)).toFixed(2)};}

const ORDN={law:'官方悬赏',dark:'黑市悬赏',trade:'商会悬赏',tangyuan:'小汤圆的委托',tangxin:'唐心的委托'};

    if(o.src==='tangxin')promo(3);
    toast(`${nameOf(o.src)}收下了「${it.name}」，付了 ${fmt(pay)}${o.src==='tangxin'?'。接下来三天每天多一位客人':''}`,'good');log(`完成${ordName(o)} +${fmt(pay)}`,'g');sfx.coin();return afterInv();

/* 早上要处理的事 */
function morningChores(news){
  /* 当品到期 */
  for(const p of [...G.pawns]){
    if(p.due>G.day)continue;
    G.pawns=G.pawns.filter(x=>x!==p);
    if(chance(p.redeemP)){const pay=Math.round(p.loan*1.3);G.cash+=pay;
      news.push({i:'home',c:'good',t:'赎当',d:`${p.name}来赎「${p.it.name}」，付了 ${fmt(pay)}（借出 ${fmt(p.loan)}）。`});
      if(p.snack)addFeel('tangxin',3);if(p.pid&&FIX[p.pid])addRel(p.pid,3);}
    else{addItem(p.it);news.push({i:'box',c:'',t:'死当',d:`${p.name}没来赎，「${p.it.name}」归你了。`});
      if(p.pid==='shaoye')reveal('shaoye','他押的东西一件都没赎回去。');}
  }
  /* 鉴定所出结果 */
  for(const l of [...G.lab]){
    if(l.ready>G.day)continue;G.lab=G.lab.filter(x=>x!==l);const it=l.it;
    if(it.stolen){addRep(-3,'送赃物去鉴定所');align(-3,'送赃物去鉴定所');heatUp(15);news.push({i:'alert',c:'bad',t:'鉴定所',d:`「${it.name}」是登记过的失窃物品，被鉴定所扣下了，还记了你一笔。`});continue;}
    it.cert=1;it.gKnown=1;it.auth=it.fake?0:4;it.authLv=9;delete it.lab;addItem(it);codexSee(it);
    news.push({i:'scan',c:it.fake?'bad':'good',t:'鉴定所',d:`「${it.name}」的鉴定书出来了：${it.fake?'假货':'真品'}${it.legend?'':'，'+GN[it.g]+' 级'}。${it.fake?'':'拿给客人看，能卖足价。'}`});
    if(!it.fake&&it.g===4)title('t_s');
  }
  /* 代卖、走私 */
  for(const x of [...G.consign]){G.consign=G.consign.filter(y=>y!==x);const pay=Math.round(faceVal(x.it)*1.3);G.cash+=pay;news.push({i:'cart',c:'good',t:'唐心代卖',d:`「${x.it.name}」在唐心店里卖掉了，得 ${fmt(pay)}。`});}
  for(const x of [...G.smug]){G.smug=G.smug.filter(y=>y!==x);
    if(chance(.85)){const pay=Math.round(faceVal(x.it)*(x.it.qty||1)*1.7);G.cash+=pay;news.push({i:'cart',c:'good',t:'大盘鸡',d:`陀巴寇运出去了，卖得 ${fmt(pay)}。`});}
    else{heatUp(10);const back=Math.round(faceVal(x.it)*(x.it.qty||1)*.5);G.cash+=back;news.push({i:'alert',c:'bad',t:'大盘鸡',d:`船在港口被查了，货没了。大盘鸡分担了一半，赔你 ${fmt(back)}。`});}}
  /* 卖出去的货出问题 */
  for(const s of [...G.sales]){
    const age=G.day-s.day;if(age<1){continue;}
    if(age>3){G.sales=G.sales.filter(x=>x!==s);continue;}
    let hit=null;
    if(s.fake&&s.know<2&&chance(s.know===1?.5:.35)){const r=refund(s.price);addRep(s.warranty?-6:-4,'卖出的假货被发现');heatUp(4);hit={i:'angry',c:'bad',t:'假货被发现',d:`买「${s.name}」的客人回来闹了：是假货。${r<s.price?'你赔不起全款，只退了':'全额退了'} ${fmt(r)}，声望 −${s.warranty?6:4}。`};if(s.pid){s.pid in MAIN?addFeel(s.pid,-15):addRel(s.pid,-25);}}
    else if(s.over&&chance(s.over>=2?.45:.3)){const r=refund(Math.round(s.price*(s.over>=2?.6:.4)));addRep(s.over>=2?-4:-3,'把货说得太好');hit={i:'angry',c:'bad',t:'客人回来了',d:`买「${s.name}」的客人发现没你说的那么好，要回 ${fmt(r)}，声望也掉了。`};}
    else if(s.stolen&&chance(.05+.25*s.hot)){addRep(-3,'卖出的赃物被失主认出');hit={i:'angry',c:'bad',t:'失主找到了买家',d:`有人在买家手里认出了自己被偷的「${s.name}」，街坊都知道你卖赃物了。`};}
    else if(s.warranty&&!s.fake&&chance(.04)){refund(s.price);if(s.it){const it={...s.it,id:uidNext()};addItem(it);}hit={i:'swap',c:'warn',t:'退货',d:`买「${s.name}」的客人用了「包退」，退了 ${fmt(s.price)}，货回到了库存。`};}
    if(hit){news.push(hit);G.sales=G.sales.filter(x=>x!==s);log(hit.d,'r');}
  }
  /* 失主上门（排进今天的队伍） */
  for(const it of G.inv){if(it.stolen&&it.owner&&!it.ownerCame&&chance(.06+.2*it.hot)){it.ownerCame=1;G.queue.push({special:'owner',id:it.id});}}
}

  c.redeem=niceRound(faceVal(it)*rand(.5,.75));

}
function ownerAct(how){

const rentOf=()=>niceRound((60+20*sum(Object.values(G.upg)))*[0,1,3,12,60,300][G.star]);

/* 新的一天 */
function startDay(first){
  G.phase='day';G.stat={};G.cust=null;G.night=null;
  const news=[];
  if(!first){coolDown();
    const dec=Math.round((G.dirtyY?5:10)*(G.prof==='fence'?.6:1));G.heat=clamp(G.heat-dec);
  }
  planEvents(news);rollMarket(news);
  if(!first&&GD('stolen')){makeNotices(news);const o=makeOrder();if(o)news.push(o);}
  G.gs={};G.cash0=G.cash;
  if(G.ev&&evFx().heatFloor)G.heat=Math.max(G.heat,evFx().heatFloor);
  G.queue=[];
  morningChores(news);
  fevMorning(news);
  loanMorning(news);
  weekly(news);
  G.scans=scanMax();
  G.left=custCount();G.dayN=G.left;
  G.banX=0;
  G.fixedToday=pickFixed();
  {const o=G.people.ahui.order;if(o&&G.day>=o.day&&!G.fixedToday.includes('ahui'))G.fixedToday.unshift('ahui');}
  G.regToday=G.regs.filter(r=>G.day-r.last>=2&&chance(.25+.1*(r.addict||0))).slice(0,1).map(r=>r.id);
  G.mainToday=!GD('people')?[]:MAINS.filter(m=>(G.mainNext[m.id]||99)<=G.day||(m.id==='dapanji'&&cal().wd===4&&mainLv('dapanji')>=0&&chance(.7))).map(m=>m.id).slice(0,2);
  G.mainToday.forEach(id=>G.mainNext[id]=G.day+ri(4,7));
  G.yuShot=0;
  G.treasure=upLv('window')>=3&&G.win.some(id=>{const it=invItem(id);return it&&it.legend;});
  if(G.treasure){addRep(1,'镇店之宝');news.push({i:'crown',c:'good',t:'镇店之宝',d:'橱窗里的传奇货引来不少人围观，声望 +1，懂行的阔客也多了。'});}
  G.news=news;
  if(G.debt>0&&G.debtDue-G.day<=3&&G.debtDue>=G.day)news.push({i:'alert',c:'bad',t:'债务',d:`还剩 ${G.debtDue-G.day+1} 天，${dayShort(G.debtDue)}打烊前要还清 ${fmt(G.debt)}。`});
  if(G.cash<0&&!G.freed&&false){}

/* 下一位客人 */
function nextCustomer(){
  if(!moreCust()){G.cust=null;render();return;}
  let c=null;
  if(tutLeft())c=tutCust(G.g1||0);
  const q=c?null:G.queue.shift();
  if(q&&q.special==='owner')c=ownerCust(q.id);
  else if(q&&q.special==='borrow')c=borrowCust(q.id);
  else if(q&&q.special==='thief')c=thiefCust(q.id);
  else if(q&&q.special==='needy')c=needyCust();
  if(!c&&G.left<=0){G.cust=null;render();return;}
  if(!c){
    G.left--;
    const slot=G.dayN-G.left;
    if(G.fevNext)c=fevFollow();
    else if(G.mainToday.length&&chance(.35+slot*.05))c=mainOrFev(G.mainToday.shift());
    else if(G.fixedToday.length&&chance(.3))c=fixedCust(G.fixedToday.shift());
    else if(G.regToday.length&&chance(.3)){const r=G.regs.find(x=>x.id===G.regToday.shift());if(r)c=regCust(r);}
    if(!c&&G.left<=1){if(G.mainToday.length)c=mainOrFev(G.mainToday.shift());else if(G.fixedToday.length)c=fixedCust(G.fixedToday.shift());}
    /* 街坊和朋友带来的违禁品生意，也算进当天的上限；超了今天就不来 */
    if(c&&(c.type==='sell'&&c.item.ban||c.type==='buy'&&c.want===BAN)){if((G.banX||0)>=banCap()||!GD('ban'))c=null;else G.banX=(G.banX||0)+1;}
    if(!c){
      const isBan=x=>x.type==='sell'&&x.item.ban||x.type==='buy'&&x.want===BAN;
      c=randomCust(guideOn()&&G.day===1?{type:G.inv.some(i=>!i.ban)?'buy':'sell'}:{});
      /* 违禁品客人一天有上限，超了就换一位普通客人 */
      for(let n=0;n<8&&isBan(c)&&(G.banX||0)>=banCap();n++)c=randomCust();
      if(c.type==='sell'&&c.item.stolen){const n=noticeItem();if(n){c.item=n;priceSeller(c);makeTells(c);}}
      if(isBan(c)&&(G.banX||0)<banCap()){G.banX=(G.banX||0)+1;G.left++;G.dayN++;}}
  }
  G.cust=c;if(c.tutI==null)greet(c);dlgStart(c);
  UI.price=c.type==='buy'?0:c.type==='sell'||c.type==='pawn'?defOffer(c):Math.max(1,Math.min(G.cash,niceRound(c.ask*.7||1)));
  sfx.door();render();
}
function greet(c){
  const it=c.item;
  if(c.type==='sell')c.line=(c.greet?c.greet+' ':'')+(c.honest?c.honest+' ':'')+say(L.sellGreet[c.pers],{item:it.name,p:c.ask});
  else if(c.type==='pawn')c.line=(c.greet?c.greet+' ':'')+say(L.pawnGreet,{item:it.name,p:c.loan,d:dayShort(G.day+c.days)});
  else if(c.type==='buy'){
    const cat=c.want===BAN?(c.wantSub||'违禁品'):c.want==='stolen'?'来路不明的货':c.want;
    c.line=(c.greet?c.greet+' ':'')+(c.want==='item'?say(L.itemGreet,{item:invItem(c.wantId)?.name||''}):c.want==='any'?pick(L.anyGreet):c.want===BAN?pick(['听说你这儿有……不方便摆出来的货？','嘘。有没有{cat}？价钱好说。']).replace('{cat}',cat):say(L.buyGreet[c.pers],{cat}));
  }
  if(c.type==='talk'||c.type==='info'){c.line=c.greet||(c.pid==='kuaizui'?pick(['掌柜的，最近生意怎么样？听说你这儿什么都收？','我就随便问问——你店里最贵的是什么？']):roleKnown(c.pid)?'墨镜往柜台上一靠：「有消息，要不要？」':pick(['随便看看。','路过，歇个脚。']));return;}
  const k=c.know;if(c.type!=='owner'&&c.kind!=='main'&&chance(.6)){const ln=pick(c.type==='buy'?L.knowBuy[k]:L.knowSell[k]);if(ln)c.line+=' '+ln;}
}

/* 打烊 */
function closeShop(){
  if(G.cust&&!G.cust.done)return;
  G.cust=null;G.phase='close';
  const out=[];
  if(G.debt>0&&!G.freed&&G.day>=G.debtDue){return gameOver('债务到期，你没能还清。');}
  if(GD('raid')&&chance(raidBase()/4)){const r=raid('close');if(r)out.push(r);}
  G.raidTonight=GD('raid')&&(G.forceRaid||(G.raidPre!=null?G.raidPre:chance(raidBase())));G.forceRaid=0;G.raidPre=null;
  if(G.raidTonight&&mainLv('funi')>=2)out.push({i:'shield',c:'warn',t:'福妮',d:'福妮路过，压低声音说：「今晚可能有人来查，你自己当心。」'});
  else if(GD('raid')&&(G.raidTip||0)>=G.day)out.push({i:'chat',c:G.raidTonight?'warn':'',t:'唐心的消息',d:G.raidTonight?'唐心托人带话：今晚有人要来查，把不该有的东西收好。':'唐心托人带话：今晚不查，放心睡。'});
  investClose(out);
  G.dirtyY=!!G.stat.dirty;
  G.night={step:'menu',out,go:null};
  save();
  if(G.pend)return showPend();
  showNightMenu();
}

/* ---------- 拾荒 ---------- */
const SCAV={
 dump:{n:'港口垃圾场',d:'都是日用类的便宜货，低等级多。没有风险。',tw:[1,0,0],gw:[.45,.38,.15,.02,0],wx:.8,risk:0},
 wreck:{n:'沉船墓地',d:'中档类为主，偶尔有高档和赃物。轻度风险：可能丢掉一件刚捡的。',tw:[.42,.56,.02],gw:[.3,.36,.27,.06,.01],wx:.8,risk:1,need:'需要推进背包'},
 zone:{n:'封锁区',d:'高档类、被扔掉的违禁品，极少数传奇。重度风险：被巡逻抓到要罚款、风声上涨、东西没收。',tw:[.15,.6,.25],gw:[.22,.33,.32,.1,.03],wx:.9,risk:2,need:'要和大盘鸡成为熟人'},
};
const bagCap=()=>[4,6,8,10,12][upLv('bag')]+(mainLv('dapanji')>=2?3:0);
const safeRounds=()=>3+(upLv('jet')>=2?1:0)+(evFx().scavSafe||0);
const scavOpen=k=>k==='dump'||k==='wreck'&&upLv('jet')>=1||k==='zone'&&mainLv('dapanji')>=1;
function scavStart(k){
  if(!scavOpen(k)||evFx().scavOff)return;
  G.night.go='scav';G.night.scav={k,round:0,found:[],bag:[],lost:[],caught:0,done:0};tot('scav')>=15&&title('t_scav');gs('scav');
  scavRound();
}
function scavRisk(){const s=G.night.scav,x=s.round-safeRounds();if(x<0)return 0;return clamp(.12+.1*x+(SCAV[s.k].risk>=2?.06:0)+(evFx().scavGood&&s.k==='wreck'?.05:0),0,.9);}
function scavItem(k){
  const S=SCAV[k],fx=evFx();
  if(k==='zone'&&chance(.25)){const it=makeItem({ban:1,w:banW()});it.scav=1;return it;}
  if(k==='zone'&&chance(.004)){const pool=LEGENDS.filter(l=>!G.legends[l.k]&&!(G.lgSeen||{})[l.k]&&(l.tag==='any'||l.tag==='dark'));if(pool.length){(G.lgSeen=G.lgSeen||{})[pool[0].k]=1;const it=makeLegendItem(pool[0].k,{fakeP:.2});it.scav=1;return it;}}
  let tw=S.tw,gw=S.gw;if(fx.scavGood&&k==='wreck'){tw=[.25,.65,.1];gw=[.2,.33,.33,.11,.03];}
  const it=makeItem({tier:wpick([0,1,2],tw),gw,wx:S.wx,fakeP:GD('fake')?.08:0,stolenP:!GD('stolen')?0:k==='wreck'?.1:k==='zone'?.15:0,hot:.3});
  it.scav=1;return it;
}
function scavRound(){
  const s=G.night.scav;
  const p=scavRisk();
  if(p&&chance(p)){
    const S=SCAV[s.k];
    if(S.risk>=2&&chance(.5)){
      const v=sum(s.bag,i=>faceVal(i));const f=niceRound(Math.max(100,v*.3));s.lost=[...s.bag];s.bag=[];s.caught=1;s.done=1;G.cash-=f;heatUp(15);align(-2,'闯封锁区被抓');
      s.msg=`巡逻队！你被抓了个正着，包里的东西全被没收，罚款 ${fmt(f)}。`;log(s.msg,'r');sfx.bad();return renderScav();
    }
    const n=Math.min(s.bag.length,S.risk>=1?ri(1,2):1);const lost=shuffle(s.bag).slice(0,n);s.bag=s.bag.filter(i=>!lost.includes(i));s.lost.push(...lost);
    s.msg=pick(['塌方了！','有人冲出来抢东西！','脚下一滑！'])+(lost.length?`丢了 ${lost.map(i=>'「'+i.name+'」').join('、')}。`:'还好包里没东西。');sfx.bad();
  }else s.msg='';
  s.round++;s.found=[scavItem(s.k),scavItem(s.k),scavItem(s.k)];
  renderScav();
}
const bagUsed=()=>sum(G.night.scav.bag,i=>i.size);
function scavTake(id){const s=G.night.scav,it=s.found.find(x=>x.id==id);if(!it)return;if(bagUsed()+it.size>bagCap())return toast('包装不下了，先拿出来一件','warn');s.found=s.found.filter(x=>x!==it);s.bag.push(it);sfx.click();renderScav();}
function scavDrop(id){const s=G.night.scav,it=s.bag.find(x=>x.id==id);if(!it)return;s.bag=s.bag.filter(x=>x!==it);s.found.push(it);sfx.click();renderScav();}
function scavHome(){
  const s=G.night.scav;let n=0,skip=0;
  for(const it of s.bag){if(freeSlots()>=it.size){it.cost=0;addItem(it);n++;}else skip++;}
  s.done=1;s.home=1;s.msg=`带回 ${n} 件东西。`+(skip?`仓库放不下，${skip} 件扔在了门口。`:'');
  log(`拾荒（${SCAV[s.k].n}）：带回 ${n} 件`,'g');sfx.good();
  G.night.step='done';renderScav();

/* 升级（钱 + 物资）、星级、借贷、还债、退休、结束 */
function upCost(id,lv){
  const row=UP[id].lv[lv];if(!row)return 0;let c=row[0];
  if(G.prof==='appraiser'&&id==='bench')c*=2;
  if(G.prof==='fixer'&&id==='scan')c*=2;

}
const upMat=(id,lv)=>UP[id].lv[lv]?.[2]||null;
const progN=id=>(G.prog[id]||[]).length;
/* 一件货能不能当这项物资交 */
function matFits(it,m){
  if(!it||it.safe||it.lab)return false;
  if(m.alt&&it.ban&&it.sub===m.alt)return true;
  if(it.ban||it.legend&&m.c!=='any')return false;
  if(m.c!=='any'&&it.cat!==m.c&&!(m.tier!=null&&CTIER[it.cat]===m.tier))return false;
  return (it.gKnown?it.g:gRange(it)[1])>=m.g;
}
const gradeOk=(it,g)=>(it.gKnown?it.g:gRange(it)[1])>=g;
/* 这件货交上去至少要几级 */
function matNeed(key,it){
  if(key==='star'){
    const S=STARS[G.star+1];if(!S)return 0;
    const rs=S.req.filter(r=>r.c==='any'||r.c===it.cat||r.tier!=null&&CTIER[it.cat]===r.tier);
    return rs.length?Math.min(...rs.map(r=>r.g)):0;
  }
  const m=upMat(key,upLv(key));
  return m&&!(m.alt&&it.ban&&it.sub===m.alt)?m.g:0;
}
function submitMat(key,id){
  const it=invItem(id);if(!it)return;
  if(it.fake&&!it.ban){it.auth=0;it.authLv=9;toast('交上去一验，是假货，退回来了','bad');return afterInv();}
  /* 等级没看准的货当场验：够了就收，不够退回，等级也就知道了 */
  const need=matNeed(key,it),gt=it.legend?5:it.g;
  if(gt<need){it.gKnown=1;toast(`验了一下，只有 ${GN[gt]} 级，不够 ${GN[need]} 级，退回来了`,'warn');return afterInv();}
  const rec={cat:it.cat,tier:CTIER[it.cat]??-1,g:it.legend?5:it.g,legend:it.legend||'',ban:it.ban,name:it.name};
  (G.prog[key]=G.prog[key]||[]).push(rec);removeItem(it,it.qty>1?1:0);
  toast(`交上了「${it.name}」`,'good');afterInv();
}
function buyUpg(id){
  const lv=upLv(id),row=UP[id].lv[lv];if(!row)return;

/* 星级 */
function starReqOk(){

/* 借贷：借给别人 */

function loanMorning(news){

/* 一件货的等级、估价、真假（引导期还没讲到的先不显示） */
function itemInfo(it){
  if(!GD('grade'))return `<span class="num">转手约值 ${fmt(faceVal(it))}</span>`;
  const [a,b]=estRange(it),one=a===b&&gRange(it)[0]===gRange(it)[1];

}
function icard(it,c){
  const tags=tagsOf(it);
  const scanBtn=GD('scan')&&canScan(it)&&!it.legend&&G.scans>0&&!c.done?`<button class="btn sm" data-act="scan" data-a="${it.id}">${ic('scan')}鉴定<small>剩${G.scans}次</small></button>`:'';

}
function tagsOf(it){
  let t='';
  if(it.legend)t+=tag('传奇','legend');
  if(it.ban)t+=tag(it.sub,'ban');
  if(knownStolen(it))t+=tag('赃物·'+hotWord(it),'stolen');
  if(it.notice)t+=tag('通告上的','stolen');
  if(it.cert)t+=tag('鉴定书','ok');
  if(it.forged)t+=tag('做旧过','sus');
  if(it.safe)t+=tag('保险箱','safe');
  if(G.win.includes(it.id))t+=tag('橱窗','win');

  return t;
}
/* 价格滑块：按对数刻度，便宜货和贵货都好拖 */
const S2P=(v,lo,hi)=>{lo=Math.max(1,lo);hi=Math.max(lo+1,hi);return lo*Math.pow(hi/lo,v/1000);};
const P2S=(p,lo,hi)=>{lo=Math.max(1,lo);hi=Math.max(lo+1,hi);return Math.round(1000*Math.log(Math.max(lo,Math.min(hi,p))/lo)/Math.log(hi/lo));};
function priceBounds(){const c=G.cust;if(sellSide(c))return [1,Math.max(2,c.ask)];return [c.offer,Math.max(c.offer+1,c.sliderMax)];}
function fillRange(r){r.style.setProperty('--f',(r.value/10)+'%');}
function priceRow(){
  const [lo,hi]=priceBounds();
  return `<div class="prow"><button class="btn sq" data-act="pstep" data-a="-1">−</button><div class="pmid"><button class="pnum num" id="pVal" data-act="pnum" aria-label="点这里直接输入价格">${fmtFull(UI.price)}</button><input type="range" id="rng" min="0" max="1000" value="${P2S(UI.price,lo,hi)}" aria-label="价格"></div><button class="btn sq" data-act="pstep" data-a="1">+</button></div>`;
}
/* 客人多说了一句：你能回的话 */
function replyBox(c){
  if(!c.dlg||c.done)return '';
  const what=sellSide(c)?'直接出价':c.item?'直接要价':'直接拿货';
  return `<div class="rep"><small>对方多说了一句，你怎么回？</small>${c.dlg.opts.map((o,i)=>`<button class="rp" data-act="reply" data-a="${i}">${o.n?`<i>${o.n}</i>`:''}<span>${esc(o.t)}</span></button>`).join('')}<button class="rp skip" data-act="noReply"><span>不回，${what}</span></button></div>`;
}
function panel(c){
  if(!c){
    if(moreCust())return `<div class="row">${btn('next',`${ic('door')}请下一位客人`,'pri grow')}${tutLeft()?'':btn('close','打烊','sm')}</div>`;
    return `<div class="row">${btn('close',`${ic('moon')}打烊`,'pri grow')}</div>`;
  }
  if(c.done)return `<div class="row">${moreCust()?btn('next',`${ic('door')}下一位`,'pri grow'):btn('close',`${ic('moon')}打烊`,'pri grow')}</div>`;
  if(c.bust)return `<div class="note bad">${ic('alert')}对方是海关便衣！货值 ${fmt(c.bust.v)}，认罚要交 ${fmt(c.bust.fine)}，货没收。</div><div class="row">${btn('bustPay','认罚','grow')}${btn('bustBribe',`贿赂 ${fmt(c.bust.cost)}<small>成功率约 ${pct(c.bust.p)}</small>`,'warn grow')}</div>`;
  if(c.type==='owner')return `<div class="row col">${btn('owner','白还给他<small>声望、立场上升</small>','good','give')}${btn('owner',`让他赎回去<small>他付 ${fmt(c.redeem)}</small>`,'','sell')}${btn('owner','说没见过<small>'+(c.item.safe?'货在保险箱里，他看不见':'他可能不信，去报案')+'</small>','warn','lie')}</div>`;
  if(c.type==='loan')return `<div class="note">${c.name}想借 ${fmt(c.amt)}，七天后还。利息你来定：利息越高，越可能还不上，关系也会变差。</div><div class="row">${btn('lend','借<small>利息 5%</small>','good grow','0.05')}${btn('lend','借<small>利息 15%</small>','grow','0.15')}${btn('lend','借<small>利息 30%</small>','warn grow','0.3')}${btn('lend','不借','sq','-1')}</div>`;
  if(c.type==='fev')return fevPanel(c);
  if(c.type==='talk')return talkPanel(c);
  if(c.type==='info')return infoPanel(c);
  if(c.type==='buy'&&!c.item){
    const n=sellable(c).length;
    if(c.dlg)return replyBox(c);
    if(!n&&canPitch(c))return `<div class="row">${btn('pitchPick',`${ic('chat')}推销别的<small>库存里没有对方要的货</small>`,'pri grow')}${btn('decline','没有，请回','sm')}</div>`;
    return `<div class="row">${btn('showPick',`${ic('box')}拿货给对方看<small>${n?n+' 件合适':'库存里没有合适的'}</small>`,'pri grow','',!n)}${btn('decline','没有，请回','sm')}</div>`;
  }
  /* 对方多说了一句：先回话（或者选不回），再定价 */
  if(c.dlg)return replyBox(c);
  const sell=sellSide(c);
  const main=sell?btn('offer',`出价 <b class="num" id="pBtn">${fmt(UI.price)}</b>`,'good grow'):btn('ask',`要价 <b class="num" id="pBtn">${fmt(UI.price)}</b>`,'good grow');
  const extra=c.type==='pawn'?btn('buyout','买断','sm','',!!c.used.buyout):sell?(canReport(c)?btn('report','举报','sm warn'):''):c.pitched?'':btn('showPick','换一件','sm');
  /* 一键成交：照对方现在的价 */
  const quick=`<button class="qk" data-act="quick">${c.type==='pawn'?'照对方要的数借出':sell?'照对方开的价收':'照对方出的价卖'} <b class="num">${fmt(sell?c.ask:c.offer)}</b></button>`;
  return `${priceRow()}<div class="row">${main}${extra}${btn('decline','送客','sq')}</div>${quick}`;
}
function talkPanel(c){
  if(c.pid==='funi')return `<div class="row col">${btn('talk','聊几句','grow','chat',!!c.used.chat)}${btn('talk',`请他喝杯茶<small>${fmt(teaCost())}</small>`,'grow','tea',!!c.used.tea)}${btn('talk','送他出门','sm','bye')}</div>`;

  if(!it.ban&&!it.safe)a.push(btn('dump','扔掉','sm',it.id));
  return a.join('');

  h+=MAINS.map(m=>{const p=G.people[m.id];if(!p.met)return `<div class="pcard dim">${charSvg({sp:0,hj:0,sh:0,bd:0,hat:0,kit:'_sil'},'neutral',1,'sil')}<b>？？？</b><span>还没见过</span></div>`;
    const lv=feelLv(p.feel);return `<button class="pcard" data-act="person" data-a="${m.id}">${charSvg(lookOf(m.id,m.look),'happy',m.rich)}<b>${m.n}</b><span>${FEEL[lv][1]}</span><i class="bar"><i style="width:${clamp(p.feel)}%"></i></i></button>`;}).join('');

  h+=`<h3>${ic('users')}街坊（${met.length}/${FIXED.length}）</h3>`;

  if(G.regs.length)h+=`<h3>${ic('home')}熟客（${G.regs.length}/10）</h3>`+G.regs.map(r=>`<button class="prow2" data-act="person" data-a="${r.id}"><div class="av">${charSvg(r.look,'neutral',r.rich)}</div><div><b>${esc(r.n)}</b><span>${r.known&&r.known.pers?PERS[r.pers].n+'、'+KNOWN[r.know]:'性格还没摸清'}</span></div><em>${relWord(r.rel||0)}</em></button>`).join('');

function personSheet(id){
  const m=MAIN[id],f=FIX[id],p=per(id);let h='';
  if(m){
    const lv=feelLv(p.feel);
    h+=`<div class="pbig">${charSvg(lookOf(id,m.look),'happy',m.rich)}<div><b>${m.n}</b><span>${m.role}</span><span>感情：${FEEL[lv][1]}（${p.feel}）</span></div></div>`;
    h+=`<h3>感情带来的好处</h3>`+m.perks.map((t,i)=>`<p class="perk ${lv>i?'on':''}">${ic(lv>i?'heart':'lock')}<b>${FEEL[i+1][1]}</b>　${t}</p>`).join('');
    h+=`<div class="sub">感情靠买卖里的取舍涨：给他公道价、让一点利、帮他找货。坑他、卖他假货会掉。</div>`;
  }else if(f){
    h+=`<div class="pbig">${charSvg(lookOf(id),'neutral',f.showRich??p.rich)}<div><b>${f.n}</b><span>${roleKnown(id)?f.real:f.face}</span><span>关系：${relWord(p.rel||0)}</span></div></div>`;
    h+=`<div class="kv"><span>性格</span><span>${p.known.pers||p.seen>=3?PERS[f.pers].n:'还没摸清'}</span><span>懂行</span><span>${p.known.know||p.seen>=3?KNOWN[f.know]+(f.exp.length?'（'+f.exp.join('、')+'）':''):'还没摸清'}</span><span>来过</span><span>${p.seen||0} 次</span>${p.toba&&!p.addict?`<span>陀巴寇</span><span>买过 ${p.toba} 次</span>`:''}${p.addict?`<span>陀巴寇</span><span>${['','有点上瘾','上瘾了','瘾很重'][Math.min(3,p.addict)]}${p.toba?`，买过 ${p.toba} 次`:''}</span>`:''}</div>`;
    if(id==='ahui'&&roleKnown(id)&&(p.rel||0)>=25)h+=`<h3>向阿灰订货</h3><div class="sub">说一类货，他过两天会带一件来（多半是偷的）。</div><div class="chips">${CATS.map(c=>`<button class="chip" data-act="orderThief" data-a="${c}">${c}</button>`).join('')}</div>`;
  }else{
    h+=`<div class="pbig">${charSvg(p.look,'neutral',p.rich)}<div><b>${esc(p.n)}</b><span>熟客</span><span>关系：${relWord(p.rel||0)}</span>${p.addict?`<span>陀巴寇：${['','有点上瘾','上瘾了','瘾很重'][Math.min(3,p.addict)]}</span>`:p.toba?`<span>买过 ${p.toba} 次陀巴寇</span>`:''}</div></div>`;
  }
  openSheet('person',m?m.n:f?f.n:p.n,h,id);
}

function pageShop(){
  let h=`<div class="pghead"><b>${STARS[G.star].n}</b><span>${'★'.repeat(G.star)}${'☆'.repeat(5-G.star)}</span></div>`;
  if(!G.freed){
    h+=`<div class="card debt"><b>开局的债务 ${fmt(G.debt)}</b><span>${dayShort(G.debtDue)}打烊前要还清，不然这家店就没了。</span><div class="row">${btn('repay','全还',G.cash>=G.debt?'good':'',  'all',G.cash<=0)}${btn('repay','还一半','','half',G.cash<=0)}${btn('repayNum','输入金额','','',G.cash<=0)}</div></div>`;
  }
  h+=`<h3>${ic('up')}升级</h3>`;
  h+=UPG.map(u=>{const lv=upLv(u.id),row=u.lv[lv],m=upMat(u.id,lv);
    if(!row)return `<div class="upg owned"><div class="uic">${ic(u.i)}</div><div class="ut"><b>${u.n} · 满级</b>${u.lv[lv-1][1]}</div></div>`;
    const cost=upCost(u.id,lv),pn=progN(u.id);
    const mt=m?`<span class="mat">物资：${m.c}类 ${GN[m.g]} 级以上 ${pn}/${m.n} 件${m.alt?`（也可以交${m.alt}）`:''}</span>`:'';
    const can=G.cash>=cost&&(!m||pn>=m.n);
    return `<div class="upg"><div class="uic">${ic(u.i)}</div><div class="ut"><b>${u.n} ${lv}→${lv+1} 级</b>${row[1]}${mt}</div><div class="ub">${m&&pn<m.n?btn('matPick','交物资','sm',u.id):''}${btn('upg',fmt(cost),can?'sm good':'sm',u.id,!can)}</div></div>`;}).join('');
  const S=STARS[G.star+1];
  if(S){const got=G.prog.star||[];
    h+=`<h3>${ic('star')}扩建</h3><div class="upg"><div class="uic">${ic('star')}</div><div class="ut"><b>升到 ${G.star+1} 星：${S.n}</b>${S.d}<span class="mat">已交：${got.length?got.map(x=>x.name+'（'+GN[x.g]+'）').join('、'):'还没有'}</span>${G.freed?'':'<span class="mat">还清债务以后才能扩建</span>'}</div><div class="ub">${btn('matPick','交物资','sm','star',!G.freed)}${btn('star',fmt(S.cost),'sm',undefined,!G.freed||G.cash<S.cost||!starReqOk())}</div></div>`;}
  if(G.freed){
    h+=`<h3>${ic('bank')}借贷</h3>`;
    h+=lenders().map(l=>{const has=G.loansIn.find(x=>x.src===l.k);return `<div class="upg"><div class="uic">${ic('bank')}</div><div class="ut"><b>${l.n}</b>${l.ok?`最多借 ${fmt(l.lim)}，七天，利息 ${pct(l.rate)}`:l.why}</div><div class="ub">${has?'':btn('borrow','借 '+fmt(l.lim),'sm',l.k,!l.ok)}</div></div>`;}).join('');
    if(G.loansIn.length)h+=G.loansIn.map((l,i)=>`<div class="card"><b>欠${l.n} ${fmt(Math.round(l.amt*(1+l.rate)))}</b><span>${dayShort(l.due)}到期</span>${btn('repayLoan','现在还','sm',i)}</div>`).join('');
    if(G.loansOut.length)h+=`<div class="sub">借出去的：`+G.loansOut.map(l=>`${l.n} ${fmt(l.amt)}（${dayShort(l.due)}）`).join('，')+'</div>';
    h+=`<div class="sub">每周日交租金和维护费，现在是 ${fmt(rentOf())}。店越大、升级越多，租金越高。</div>`;
  }
  return h;
}

  const isStar=key==='star',m=isStar?null:upMat(key,upLv(key));

  const s=G.stat,d=G.cash-(G.cash0??G.cash),stock=sum(G.inv,i=>i.ban||knownStolen(i)||i.auth===0?0:aboutVal(i)*(i.qty||1));

  h+=(N.out||[]).map(evCard).join('');

  h+=`<button class="mcard" data-act="sleep">${ic('home')}<div><b>${gm?'直接回家睡觉':'回家睡觉'}</b><span>${gm?'什么都不做。':'明天见。'}</span></div></button>`;

/* 集市分两栏：买进、卖出 */
let MKT='buy';
const martList=()=>G.inv.filter(i=>!i.safe&&!i.ban&&!knownStolen(i)&&!i.deed);
const bmList=()=>bmOpen()?G.inv.filter(i=>!i.safe&&bmCan(i)):[];
function sellRow(it,act,v){
  const u=(it.cost||0)/(it.qty||1),d=v-u;
  return `<div class="invrow"><div class="top">${ibox(it)}<div class="ib"><b>${esc(it.name)}${it.qty>1?' ×'+it.qty:''}</b><span class="ic-r">${gBadge(it)}<span class="num">收价 ${fmt(u)}</span><span class="${d>=0?'gain':'loss'}">${d>=0?'赚':'亏'} ${fmt(Math.abs(d))}</span></span></div>${btn(act,`卖 ${fmt(v)}`,'sm good',it.id)}</div></div>`;
}

  const sh=G.shop,ml=martList(),bl=bmList();

  h+=`<div class="chips c2 mkt"><button class="chip ${MKT==='buy'?'sel':''}" data-act="mktTab" data-a="buy">${ic('cart')}买进</button><button class="chip ${MKT==='sell'?'sel':''}" data-act="mktTab" data-a="sell">${ic('bank')}卖出${ml.length+bl.length?`（${ml.length+bl.length}）`:''}</button></div>`;

    h+=`<h3>卖给商行</h3><div class="sub">商行按货真实价值的六成收，当场给钱。卖不掉、放不下的货可以在这里出手。假货和登记过的赃物他们不收。</div>`;

      h+=bl.length?bl.map(it=>sellRow(it,'bmSell',bmVal(it))).join(''):'<div class="empty">没有能卖给黑市的货。</div>';
    }else if(GD('ban'))h+=`<h3>卖给黑市</h3><div class="empty">${evFx().bmShut?'帮派火并，黑市关门了。':'立场到「−15」以下，黑市才对你开放。'}</div>`;
  }else{
  h+=`<h3>商行</h3><div class="sub">都是鉴定过的真货，带鉴定书。想出货，点上面的「卖出」。</div>`;
  h+=sh.goods.length?sh.goods.map(it=>`<div class="invrow"><div class="top">${ibox(it)}<div class="ib"><b>${esc(it.name)}</b><span class="ic-r">${gBadge(it)}<span class="num">值 ${fmt(faceVal(it))}</span>${trendTag(it)}</span></div>${btn('martBuy',fmt(martPrice(it)),'sm',it.id,G.cash<martPrice(it))}</div></div>`).join(''):'<div class="empty">卖完了。</div>';
  if(bmOpen()){const B=bmCfg();
    h+=`<h3>黑市 · 第 ${bmLv()} 层</h3><div class="sub">卖：${B.subs.join('、')}。每笔都让立场偏黑、风声变紧一点。</div>`;
    h+=sh.bm.length?sh.bm.map(it=>`<div class="invrow"><div class="top">${ibox(it)}<div class="ib"><b>${esc(it.name)}</b><span class="ic-r">${gBadge(it)}<span class="num">${estText(it)}</span><span class="au">${authTxt(it)}</span></span></div>${btn('bmBuy',fmt(bmPrice(it)),'sm',it.id,G.cash<bmPrice(it))}</div></div>`).join(''):'<div class="empty">没货了。</div>';
  }else if(GD('ban'))h+=`<h3>黑市</h3><div class="empty">${evFx().bmShut?'帮派火并，黑市关门了。':'立场到「−15」以下，黑市才对你开放。'}</div>`;
  }
  const cs=mainLv('tangxin')>=2?G.inv.filter(i=>!i.safe&&i.cat==='食物饮品'):[];

  const sm=mainLv('dapanji')>=3?G.inv.filter(i=>!i.safe&&i.sub==='陀巴寇'):[];
  if(sm.length)h+=`<h3>大盘鸡的船</h3>`+sm.map(it=>`<div class="invrow"><div class="top">${ibox(it)}<div class="ib"><b>${esc(it.name)}${it.qty>1?' ×'+it.qty:''}</b><span>运出去约 ${fmt(faceVal(it)*(it.qty||1)*1.7)}，有一成半可能被查</span></div>${btn('smuggle','交给他','sm',it.id)}</div></div>`).join('');
  return h;
}
function scavHtml(){
  const s=G.night.scav,S=SCAV[s.k];
  let h=`<div class="pghead"><b>${ic('bag')}${S.n}</b><span>第 ${s.round} 轮</span></div>`;
  if(s.msg)h+=`<div class="note ${s.caught||s.lost.length?'bad':''}">${esc(s.msg)}</div>`;
  if(s.done){h+=`<div class="row">${btn('sleep',`${ic('home')}回家睡觉`,'pri grow')}</div>`;return h;}
  h+=`<h3>翻出来的东西</h3>`+(s.found.length?s.found.map(it=>scavRow(it,'scavTake','装进包')).join(''):'<div class="empty">这一轮的都拿完了。</div>');
  h+=`<h3>包（${bagUsed()}/${bagCap()} 格）</h3>`+(s.bag.length?s.bag.map(it=>scavRow(it,'scavDrop','拿出来')).join(''):'<div class="empty">包是空的。</div>');
  const p=scavRisk();const nextP=(()=>{const x=s.round+1-safeRounds()-1;return x<0?0:clamp(.12+.1*x+(S.risk>=2?.06:0),0,.9);})();
  h+=`<div class="row">${btn('scavMore',`再搜一轮<small>${nextP?'出事的可能约 '+pct(nextP):'安全'}</small>`,nextP?'warn grow':'grow')}${btn('scavHome','带着包回家','pri grow')}</div>`;
  return h;
}
function scavRow(it,act,lab){
  const lamp=upLv('lamp');
  const name=lamp<1?`一件${it.cat}`:it.name;
  const info=lamp<1?'太黑了，看不清':`${gTxt(gRange(it,true))} · ${estText(it,true)}`;
  return `<div class="invrow"><div class="top">${ibox(it,'',true)}<div class="ib"><b>${esc(name)}</b><span>${info} · 占 ${it.size} 格</span></div>${btn(act,lab,'sm',it.id)}</div></div>`;
}

function showMorning(out){
  const news=G.news||[];
  let h=`<div class="scroll"><div class="mhead">${ic('sun')}<b>${dateStr()}</b><span>${cal().wd>=5?'周末，客人会多一些':cal().wd===0?'周一，客人少一些':''}</span></div>`;
  h+=guideCard();
  if(out&&out.length)h+=`<h3>昨夜</h3>`+out.map(evCard).join('');
  h+=`<h3>早报</h3>`+(news.length?news.map(evCard).join(''):'<div class="empty">今天没什么新闻。</div>');
  if(mainLv('tangxin')>=1){const f=forecast();if(f.length)h+=evCard({i:'chat',t:'唐心说',d:'我店里的客人都在聊：'+f.slice(0,3).join('，')+'。'});}

function showPend(){

const HELP=[
 ['新手引导','<p>开局勾了「新手引导」，还债的这段日子就是教程：第一天一步一步教收货和卖货，之后每天早上多开放一样东西（等级、行情、假货、对话、当品、拾荒、升级、赃物、违禁品、街坊），第十一天起全部开放。还清债务，或者在提示里关掉引导，没讲到的内容会立刻全部开放。</p>'],
 ['怎么出价','<p>客人进门时，滑块已经放在一个稳妥的价上：收货是对方开价的一半左右，卖货是比对方出价高两成半。不想动脑，直接点「出价」「要价」也能做成不少生意。</p><p>被拒绝以后，对话框里会写你离对方心里的价还差多远：「只差一点」就小步加，「还差不少」就多加一些。第一次开出离谱的价只是警告，再来一次对方会很快走人。</p><p>滑块下面那一行可以一键照对方现在的价成交。货卡上的「约 ₡X」是这件货大概值多少；卖货时还会写你的收价，卖得比收价高才是赚。</p>'],
 ['行情和传闻','<p>顶上的「行情」按钮打开行情板：每类货今天是平常价的百分之几、最近七天怎么走。一波涨跌通常持续三到六天。</p><p>涨的品类，来找它的客人多、出价高，商行也跟着贵，适合卖；跌的品类收起来便宜，适合囤着等涨。货卡上的 ▲▼ 就是这件货所在品类今天的涨跌。</p><p>和街坊做过几次买卖以后，他们偶尔会透露过几天的行情，记在行情板上。消息不一定准：行情板会写这个人以前说准过几次。墨镜卖的消息和唐心听来的消息是准的。</p>'],
 ['朋友的事','<p>六位朋友上门时，有时会先说一件事，下面给你几句回话。没有标准答案：有的选择涨感情，有的赚钱，有的有风险。说完以后，朋友接着照常和你做买卖，这件事不占当天的客人名额。</p><p>答应下来的事会留下记录：木水寄存的箱子、借给小玉米的货在库存页最下面；小汤圆和唐心托你找的货，显示在顶上那一条里，在库存里点那件货就能交。</p>'],
 ['集市和扩建','<p>晚上去集市，页面上有「买进」「卖出」两栏。卖出栏里列着你能出手的货：商行按真实价值的六成收，每件货后面写着这样卖是赚是亏。</p><p>上门的货会跟着你的身家走：钱和货越多，来的货越值钱。</p><p>扩建和升级要交物资。等级没看准的货也可以交：当场验，够了收下，不够退回，还顺便知道了它的等级。悬赏和委托也是这样验。</p><p>还清债务的头一周，房东免租。</p>'],
 ['推销和举报','<p>买家想要的货你没有时，可以点「推销别的」，从库存里挑一件推给对方，每位客人只有一次机会。动心的话照常谈价，但出的价比主动来买的人低一些；不动心就走了。话多、天真、好赌的人容易动心，正在涨的品类也更好推。</p><p>违禁品也能推销，卖得出好价，但有风险：对方可能翻脸去举报，当晚海关就上门；也可能撞上便衣。看着越体面、越守规矩的人越危险。朋友里只有木水会要，大盘鸡只要陀巴寇，其他朋友不碰，提了还会不高兴。</p><p>违禁品里只有陀巴寇会上瘾。街坊和熟客每买过一次，下回再推销陀巴寇就更容易成（每次加一成半，最多加六成），买过的人也不会再去举报你。买得越多越容易上瘾：上瘾的人会自己常来找，出价更高，但会越来越穷，买正经货的钱也跟着少；每让一个人瘾加重，你的立场就偏黑一截。武器和人体器官不会这样。朋友不会上瘾。</p><p>有人带违禁品来卖时，除了收和送客，还可以点「举报」：不花钱，有一小笔赏金，声望和立场上升，风声变松。代价是带违禁品上门的人会少一阵子，木水那边的感情也会掉一点。木水本人不能举报。</p>'],
 ['基本玩法','<p>谈不拢、客气地送客都不掉声望；出价离谱把人气走才掉。</p><p>白天开门，客人一个个进来：有人卖货给你，有人来买货，有人来当东西借钱。拖滑块定价，或者点「−」「+」微调，也可以点价格数字直接输入；然后点「出价」或「要价」。对方的耐心看表情，表情越难看越快要走。</p><p>晚上打烊后选一个地方去：集市（商行和黑市）或者拾荒。然后回家睡觉，深夜可能有搜查和小偷。</p>'],
 ['等级和估价','<p>货分 D、C、B、A、S 五级，B 是标准价；A 两倍，S 五倍以上，极少数到一百倍。传奇货是 SSR，至少一亿。</p><p>等级一眼看不准，只能看到一个区间（比如 C–A），区间一定包含真实等级。放大镜升级能把区间收窄。鉴定仪二级以上能鉴定出准确等级。</p>'],
 ['真假和鉴定','<p>鉴定一次，会告诉你这件是真货的把握：100% 真、75%、50%、25%、100% 假。这个数字是算数的：显示 75% 的货，四件里有三件是真的。贵货更难认。</p><p>没把握的可以送鉴定所（白天在库存里送），等两三天出鉴定书，任何买家都认。传奇货自己鉴定不了，只能送鉴定所。送赃物去会被扣下。</p>'],
 ['看人','<p>柜台上只看得到衣着、说的话和表情。性格、懂不懂行、急不急、是不是便衣，都要从说话里判断。客人走后会告诉你他是什么样的人。</p><p>不懂行的卖家可能贱卖好货，也可能把破烂当宝；很懂行的人要价准、骗不了。</p>'],
 ['对话','<p>客人有时会多说一句，或者露出一点破绽（比如一直看时间、不停回头看门口）。这时下面会出现两三句你能回的话，选一句回。回对了对方会让价，回错了对方会不耐烦，甚至扭头就走。拿不准就点「不回」，接着谈价。差不多一半的客人不多说话，只谈价。</p><p>每句话前面的小字是它的意思。收货时会遇到：挑毛病（说货不好）、哭穷、晾一晾（不说话等对方让）、套近乎、抛硬币、最后一口价。卖货时会遇到：夸货（最高只能说到 A 级，说过头了客人事后会回来闹）、说实话、包退、亮鉴定书、套近乎、晾一晾。</p><p>哪句管用，取决于对方是什么样的人：比如急着用钱的人经不起晾，倔的人不吃挑毛病那一套，话多的人喜欢套近乎。有的破绽是装出来的，点破了对方会生气。回完以后，对话框里会写这句有没有管用。</p>'],
 ['声望、立场、风声','<p>声望是客人信不信你，决定来什么样的人。立场是守法还是犯法，决定违禁品多不多、黑市开不开。风声是海关盯你多紧，决定搜查和便衣多不多。点顶栏的数字可以看详细说明。</p>'],
 ['违禁品和赃物','<p>违禁品有三类：武器、陀巴寇、人体器官。利润高，但在柜台卖一次风声就涨一大截。带违禁品上门的卖家、专找违禁品的买家都是额外多来的，每天最多三位，不占正常客人的名额，不想碰就客气地送走。陀巴寇分一包、一条、一箱，可以拆开零卖，有人会上瘾。</p><p>赃物刚偷来的最烫手，收价极低，拿着和卖出去都危险；放几天就凉了。失主可能找上门；每天早上有失窃通告，上交能领赏。工作台二级能洗白赃物。</p><p>保险箱里的东西搜查和小偷都找不到，卖的时候可以直接从保险箱里拿给客人看。黑市收得便宜，只是个安全的出路；想赚得多要在柜台卖，那就得担风险。</p>'],
 ['人物','<p>六位朋友各管一块玩法，感情越好给的好处越大。二十位街坊各有各的身份，有的一开始看不出真面目。处得好的随机客人可能变成熟客。</p>'],
 ['升级和扩建','<p>前一两级只要钱，再往上还要交物资：某一类、某个等级以上的货。物资可以分几次交。还清债务后可以扩建门面，五星是灰港第一当铺。</p>'],
 ['拾荒','<p>晚上可以去拾荒。每轮翻出三件，挑着装进包；包满了可以换。前几轮安全，再往后每多搜一轮都可能出事。头灯决定夜里看得清多少。</p>'],
 ['日历和大事','<p>一周 7 天、一季 4 周、一年四季。有的大事每年固定日子来，有的随机。大事会改变行情和规则，比如边境冲突时武器翻倍。</p>'],
 ['图鉴和地契','<p>图鉴分「货物」和「人物」两栏。人物一栏记着见过的朋友和街坊，发现的真实身份、摸清的脾气也记在里面。</p><p>「更多」里的图鉴跨存档保留。一件货经手过一次就记下名字和样子；确认过等级的真货会点亮对应的等级，并记下标准价，以后再遇到这种货，心里就有数了。</p><p>还清开局的债务时，债主会把抵押的地契送回来。地契是非卖品，不占库存，不算进资产；在「库存」页挂到墙上，每天多来一位客人。</p>'],
 ['借贷和结束','<p>还清债务后可以借钱给熟人、向银行借钱。每周日交租金，现金是负数、一周补不上就破产。手头没钱没货的时候，可以去拾荒捡点东西卖，或者找放贷人。卖出的假货被发现要全额退款。任何时候可以在「更多」里退休，结算评分。</p>'],
];

/* ==== 11board.js ==== */
/* 行情板、传闻 */
const mkHot=m=>m>=1.2?['抢手','hot']:m<=.85?['冷清','cold']:['平常',''];
function trendTag(it){
  if(!G||!GD('mkt')||it.legend)return '';
  const m=mkt(it);if(Math.abs(m-1)<.1)return '';
  return `<span class="tr ${m>1?'up':'dn'}">${m>1?'▲':'▼'}${Math.round(Math.abs(m-1)*100)}%</span>`;
}
function spark(a){
  const n=a.length,W=64,H=24,lo=Math.min(.75,...a),hi=Math.max(1.25,...a),y=v=>(H-3-(v-lo)/(hi-lo)*(H-6)).toFixed(1),x=i=>(n<2?W/2:3+i*(W-6)/(n-1)).toFixed(1);
  const col=a[n-1]>=1.1?'#58e6a0':a[n-1]<=.9?'#ff7a93':'#9fb0e8';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="M0 ${y(1)}H${W}" stroke="#3a4680" stroke-width="1" stroke-dasharray="2 2"/><polyline points="${a.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n-1)}" cy="${y(a[n-1])}" r="2.6" fill="${col}"/></svg>`;
}
const rumWhen=r=>{const d=r.day-G.day;return d<=0?'今天':d===1?'明天':d+' 天后';};
function rumTrust(pid){const s=G.tipStat&&G.tipStat[pid];return s&&s[1]?`<i>（这人的消息 ${s[1]} 次里准了 ${s[0]} 次）</i>`:'';}
function boardRow(key,label){
  const m=G.mk[key]||1,h=(G.mkh&&G.mkh[key]&&G.mkh[key].length?G.mkh[key]:[m]),prev=h.length>1?h[h.length-2]:m,d=m-prev;
  const [hn,hc]=mkHot(m);
  const n=sum(G.inv.filter(i=>(i.ban?BAN+i.sub:i.cat)===key),i=>i.qty||1);
  const ru=(G.rumors||[]).filter(r=>r.c===key);
  return `<div class="mrow"><div class="mn"><b>${label}</b><small>${n?`库存 ${n} 件`:'　'}</small></div>${spark(h)}<div class="mp ${m>=1.1?'up':m<=.9?'dn':''}"><b class="num">${Math.round(m*100)}%</b><small>${Math.abs(d)<.02?'持平':(d>0?'比昨天 +':'比昨天 −')+Math.round(Math.abs(d)*100)}</small></div><span class="mt ${hc}">${hn}</span></div>`
    +ru.map(r=>`<div class="mru">${ic('chat')}<span>${esc(r.n)}说：${rumWhen(r)}要${r.dir>0?'涨':'跌'}。${rumTrust(r.pid)}</span></div>`).join('');
}
function boardSheet(){
  G.rumNew=0;
  let h=`<div class="sub">100% 是平常价。<b>涨的品类</b>：想买的客人多、出价高，商行也跟着贵，适合卖。<b>跌的品类</b>：收起来便宜，适合囤。一波走势通常持续三到六天。</div>`;
  h+=`<div class="bhead"><span>品类</span><span>最近七天</span><span>今天</span><span>人气</span></div>`;
  h+=CATS.map(c=>boardRow(c,c)).join('');
  if(GD('ban'))h+=`<h3>违禁品</h3>`+BANS.map(b=>boardRow(BAN+b,b)).join('');
  h+=`<div class="sub">${(G.rumors||[]).length?'带对话图标的是街坊透露的传闻。消息不一定准，准不准要看是谁说的。':'和街坊处熟了，他们做完买卖偶尔会透露过几天的行情。消息不一定准，准不准要看是谁说的。'}</div>`;
  openSheet('board','行情',h);
  renderHud();
}

/* 传闻：过几天某一类货要涨还是要跌。ok=1 的会应验 */
const RUMR={mojing:.95,laobao:.85,kuaizui:.5};
const rumRel=f=>RUMR[f.id]??(f.know===2?.8:f.know===1?.7:.55);
function addRumor(pid,n,o={}){
  G.rumors=G.rumors||[];
  const f=FIX[pid];
  const pool=CATS.filter(c=>!G.rumors.some(r=>r.c===c));if(!pool.length)return null;
  const own=f?[...(f.exp||[]),f.fav].filter(c=>pool.includes(c)):[];
  const c=o.c&&pool.includes(o.c)?o.c:own.length&&chance(.6)?pick(own):pick(pool);
  const m=G.mk[c]||1,dir=o.dir||(chance(m>1.2?.3:m<.85?.7:.5)?1:-1);
  const r={c,dir,day:G.day+(o.in||ri(2,3)),pid,n,ok:o.ok!=null?o.ok:chance(f?rumRel(f):.7)?1:0};
  G.rumors.push(r);G.rumNew=1;return r;
}
const rumText=r=>`${r.day-G.day<=1?'明天':'过两三天'}「${r.c}」要${r.dir>0?'涨':'跌'}`;
function rumorDue(news){
  if(!G.rumors||!G.rumors.length)return;G.tipStat=G.tipStat||{};
  for(const r of G.rumors.filter(r=>r.day<=G.day)){

/* 推销：买家想要的货你没有时，可以推销一件别的；举报：有人带违禁品来卖时，可以叫巡警 */
const PITCHP={naive:.5,chatty:.45,gambler:.4,greedy:.3,desperate:.25,impatient:.2,shrewd:.2,stubborn:.12};
const pitchList=c=>G.inv.filter(i=>!i.safe&&!i.lab&&!wants(c,i)&&(!i.ban||GD('ban')));
const canPitch=c=>!!c&&c.type==='buy'&&!c.item&&!c.pitched&&!c.done&&c.tutI==null&&!(guideOn()&&G.day<=1)&&sellable(c).length===0&&pitchList(c).length>0;
function pitchSheet(){
  const c=G.cust;if(!canPitch(c))return;
  const l=pitchList(c).sort((a,b)=>(a.ban?1:0)-(b.ban?1:0)),hasBan=l.some(i=>i.ban);
  openSheet('pitch','推销哪一件',`<div class="sub">对方不是冲这些货来的，推销只有一次机会。动心的话照常谈价，但出的价比主动来买的人低一些；不动心就走了，没有别的损失。话多、天真、好赌的人容易动心，正在涨的品类也更好推。</div>${hasBan?`<div class="note bad">${ic('alert')}推销违禁品有风险：对方可能翻脸去举报，当晚海关就上门；也可能撞上便衣。看着越体面、越守规矩的人越危险。</div>`:''}`
    +l.map(it=>`<div class="invrow"><div class="top">${ibox(it)}<div class="ib"><b>${esc(it.name)}${it.qty>1?' ×'+it.qty:''}</b><span class="ic-r">${itemInfo(it)}</span><span>${it.ban?'<em class="cost bad">违禁品</em>':''}${it.cost?`<em class="cost">收价 ${fmt(it.cost/(it.qty||1))}</em>`:''}</span></div>${btn('pitch','推销','sm '+(it.ban?'warn':'pri'),it.id)}</div></div>`).join(''));
}
/* 正经货：动心的可能 */
function pitchP(c,it){
  let p=(PITCHP[c.pers]??.3)+.05*(c.rich||0)+(G.prof==='talker'?.1:0);
  p*=clamp(G.mk[it.cat]||1,.8,1.3);
  if(c.kind==='fixed'||c.kind==='reg')p+=clamp((per(c.pid)?.rel||0)/200,-.1,.2);
  if(c.kind==='main')p+=.15;
  return clamp(p,.05,.85);
}
/* 违禁品：yes 想要 / no 不要但不声张 / report 去举报 / friend 朋友不碰 */
function pitchBan(c,it){
  if(c.kind==='main'){const b=MAIN[c.pid].ban;return b==='yes'||b==='toba'&&it.sub==='陀巴寇'?'yes':'friend';}
  const f=FIX[c.pid],p=c.pid?per(c.pid):null,al=p&&p.al!=null?p.al:0,toba=it.sub==='陀巴寇';
  /* 陀巴寇会上瘾：这个人每买过一次，下回就更容易动心；买过的人也不会再去举报 */
  const had=toba&&p?(p.toba||0):0;
  let yes=.12+(c.pers==='gambler'?.15:c.pers==='desperate'?.1:0)+(c.trans?.05:0)+clamp(-al/100,0,1)*.4+clamp(-G.align/100,0,1)*.1;
  if(toba)yes+=Math.min(.6,.15*had)+.1*Math.max(c.addict||0,p&&p.addict||0);
  if(f&&f.exp.includes(BAN))yes+=.4;
  if(chance(clamp(yes,.03,.95)))return 'yes';
  if(had>0)return 'no';
  const rep=.25+(al>20?.3:0)+((c.shownRich??c.rich)>=2?.15:0)+(c.pers==='stubborn'?.1:0)-(c.pers==='desperate'||c.pers==='gambler'?.1:0)-(al<0?.2:0);
  return chance(clamp(rep,.03,.8))?'report':'no';
}
function pitch(id){
  const c=G.cust,it=invItem(id);if(!canPitch(c)||!it||wants(c,it))return;
  c.pitched=1;closeSheet();gs('pitch');
  const cat=c.want===BAN?(c.wantSub||'那种货'):c.want==='any'?'别的':c.want==='item'?'那一件':c.want;
  if(it.ban){
    const r=pitchBan(c,it);
    if(r==='yes'){
      c.want=BAN;c.wantSub=it.sub;c.payMul=.9;
      if(it.sub==='陀巴寇'&&c.pid&&c.kind!=='main'){const p=per(c.pid);if(p&&p.addict)c.addict=p.addict;}
      /* 也可能是便衣装作有兴趣 */
      if(c.kind==='rand'&&chance(copP()*.5)){c.cop=1;c.know=1;}
      showItem(id);
      if(!c.done&&c.item){c.line='（压低了声音）'+c.line;render();}
    }
    else if(r==='friend'){addFeel(c.pid,-3);c.line='这种东西别跟我提。就当我没听见。';c.result=`${c.name}不碰违禁品，脸色不太好看。`;sfx.bad();finish('left');}
    else if(r==='report'){
      G.forceRaid=1;heatUp(15);addRep(-2,'向客人推销违禁品');if(c.pid&&FIX[c.pid])addRel(c.pid,-15);
      c.line='你……你卖这个？我这就去告诉海关！';c.angry=1;
      c.result='对方翻脸了，说要去举报。今晚海关多半会上门，把不该有的东西收好。';log('推销违禁品，被人举报了','r');sfx.bad();finish('left');
    }
    else{heatUp(3);c.line=pick(['……我什么都没听见。','这个我不碰，你自己也小心点。','别，我可不想惹麻烦。']);c.result='对方不碰违禁品，走了。没有声张。';sfx.click();finish('left');}
    return;
  }
  if(chance(pitchP(c,it))){
    c.want='item';c.wantId=it.id;c.payMul=.85;
    showItem(id);
    if(!c.done&&c.item){c.line=pick(['嗯……这个倒可以看看。','本来没想买这个，不过——'])+c.line;render();}
  }
  else{c.line=pick([`不用了，我只想要${cat}。`,'这个我用不上。','算了，下回再来看看。']);c.result='对方对这件货没兴趣，走了。';sfx.click();finish('left');}
}

/* 卖出一件陀巴寇以后：街坊和熟客会记着，买得越多越容易上瘾；上瘾的人越来越穷。朋友不参与 */
function tobaSold(c){
  if(c.kind!=='fixed'&&c.kind!=='reg')return '';
  const p=per(c.pid);if(!p)return '';
  p.toba=(p.toba||0)+1;
  const old=p.addict||0;let t='';
  if(old<3&&chance(clamp(.15+.12*p.toba,0,.75))){
    p.addict=old+1;align(-3,'把人卖上了瘾');
    if(mainLv('funi')>=1&&(p.rel||0)>=20)addFeel('funi',-2);
    t=old?` ${c.name}的瘾更重了。`:` ${c.name}对陀巴寇上瘾了：以后会常来找这个，出价也更高，但人会越来越穷。立场偏黑。`;
    log(old?`${c.name}的瘾更重了`:`${c.name}对陀巴寇上瘾了`,'y');
  }
  if((p.addict||0)>0&&p.rich>0&&chance(.3)){p.rich--;t+=` ${c.name}看着比以前落魄了。`;}
  return t;
}
/* 举报：木水和其他朋友没有这个选项 */
const canReport=c=>!!c&&c.type==='sell'&&!!c.item&&!!c.item.ban&&!c.done&&c.kind!=='main'&&GD('ban');
const snitchN=()=>Math.max(0,(G.snitch||0)-Math.floor((G.day-(G.snitchDay||0))/7));
function reportSeller(){
  const c=G.cust;if(!canReport(c))return;const it=c.item;
  const pay=Math.max(20,niceRound(Math.min(faceVal(it)*.08,wealth()*.05))),ms=mainLv('mushui');
  G.cash+=pay;addRep(2,'举报卖违禁品的人');align(4,'举报卖违禁品的人');heatUp(-8);
  if(mainLv('funi')>=0)addFeel('funi',3);
  G.snitch=snitchN()+1;G.snitchDay=G.day;
  if(ms>=0){addFeel('mushui',ms>=2?-6:-3);if(!G.msWarn){G.msWarn=1;later({day:G.day+1,k:'mswarn'});}}

function numOpen(o){
  NUM=o;NUMV='';
  openSheet('num',o.title,`<div class="numd num" id="numD">—</div><div class="sub center">能输入的范围：${fmtFull(o.lo)} 到 ${fmtFull(o.hi)}</div><div class="numpad">${[1,2,3,4,5,6,7,8,9,'00',0,'删'].map(k=>`<button class="btn" data-act="numKey" data-a="${k}">${k}</button>`).join('')}</div><div class="row">${btn('closeSheet','取消','grow')}${btn('numOk','确定','pri grow')}</div>`);
}
function numSheet(){
  const c=G.cust;if(!c||c.done)return;
  const [lo,hi]=priceBounds();
  numOpen({title:sellSide(c)?'输入出价':'输入要价',lo,hi,ok:v=>{if(!G.cust||G.cust.done)return;setPrice(v);if(v<lo||v>hi)toast(`超出范围，已经调到 ${fmtFull(UI.price)}`,'warn');}});
}
function numKey(a){
  if(a==='删')NUMV=NUMV.slice(0,-1);else if(NUMV.length<13)NUMV=(NUMV+a).replace(/^0+/,'');
  const d=$('#numD');if(d)d.textContent=NUMV?fmtFull(+NUMV):'—';sfx.tick();
}
function numOk(){
  const v=+NUMV,o=NUM;closeSheet();NUM=null;if(!v||!o)return;
  o.ok(v);
}

/* ==== 12main.js ==== */
/* 事件表和启动 */
function setPrice(p){
  const [lo,hi]=priceBounds();UI.price=Math.max(1,Math.min(Math.round(p),hi));if(UI.price<lo)UI.price=lo;
  const v=$('#pVal'),b=$('#pBtn'),r=$('#rng');
  if(v)v.textContent=fmtFull(UI.price);if(b)b.textContent=fmt(UI.price);
  if(r){r.value=P2S(UI.price,lo,hi);fillRange(r);}
}
let tickT=0;
document.addEventListener('input',e=>{
  if(e.target.id!=='rng'||!G||!G.cust)return;
  const [lo,hi]=priceBounds();const p=niceRound(S2P(+e.target.value,lo,hi));
  UI.price=Math.max(lo,Math.min(hi,p));
  $('#pVal').textContent=fmtFull(UI.price);const b=$('#pBtn');if(b)b.textContent=fmt(UI.price);fillRange(e.target);
  const t=performance.now();if(t-tickT>60){tickT=t;sfx.tick();}
});
function talk(k){
  const c=G.cust;if(!c||c.done)return;
  if(k==='chat'){c.used.chat=1;
    if(c.pid==='funi'){addFeel('funi',2);c.line=pick(MAIN.funi.hi);}
    else{addRel(c.pid,3);c.line=pick(['哈哈，你这人有意思。','最近星港可热闹了……','行，改天再来坐坐。']);}
    sfx.good();return render();}
  if(k==='tea'){const t=teaCost();if(G.cash<t)return toast('钱不够','bad');G.cash-=t;c.used.tea=1;
    if(c.pid==='funi'){addFeel('funi',4);c.line='谢了。……你这人还行。';}else{addRel(c.pid,6);c.line='哟，这么客气？';}
    sfx.good();return render();}
  /* 送走 */
  const hot=G.inv.filter(i=>!i.safe&&(i.ban||knownStolen(i)));
  if(c.pid==='funi'){
    const vis=hot.filter(i=>i.ban&&inWin(i)||chance(.35));
    if(vis.length&&mainLv('funi')<2){const f=Math.round(raidFine(vis)*.5);vis.forEach(i=>removeItem(i));G.cash-=f;addRep(-4,'福妮在店里看到了不该有的东西');align(-3,'被巡警撞见');heatUp(10);c.result=`福妮看见了柜台后面的${vis.length}件东西，当场没收，罚款 ${fmt(f)}。`;c.line='……公事公办，别怪我。';sfx.bad();}
    else if(hot.length&&mainLv('funi')>=2){c.result='福妮看了一眼柜台后面，压低声音：「把那些东西收好。」';c.line='我什么都没看见。';}
    else{c.result='福妮巡逻去了。';c.line='走了，有事叫我。';}
  }else if(c.pid==='kuaizui'){
    const p=G.people.kuaizui;
    if((p.rel||0)<0&&hot.length&&chance(.5)){heatUp(25,'快嘴登报');G.forceRaid=1;reveal('kuaizui','他把你店里的事登了报。');c.result='第二天的小报上，登着你店里卖违禁品和赃物的事。风声大涨。';c.line='有意思，太有意思了。';}
    else if((p.rel||0)>=40&&weekOf(G.day)!==p.flag.art){p.flag.art=weekOf(G.day);addRep(3,'快嘴写文章夸你');reveal('kuaizui','他写了一篇文章夸你的店。');c.result='快嘴在小报上写了一篇夸你的文章，声望 +3。';c.line='放心，我会好好写的。';}
    else{c.result='快嘴走了。';c.line='改天再来。';if(k==='bye')addRel(c.pid,-5);}
  }else{c.result=`${c.name}走了。`;c.line='走了走了。';}
  finish('deal');
}
function tip(k){
  const c=G.cust;if(!c||c.done||c.used[k])return;const t=tipCost();if(G.cash<t)return toast('钱不够','bad');
  G.cash-=t;c.used[k]=1;addRel(c.pid,2);
  if(k==='mk'){const r=addRumor('mojing','墨镜',{ok:1,in:ri(1,2)});c.line=r?`告诉你：${rumText(r)}。我的消息没有不准的，行情板上给你记着了。`:'最近没什么可说的，这条不收你钱。';if(!r)G.cash+=t;}
  else if(k==='raid'){if(G.raidPre==null)G.raidPre=chance(raidBase());c.line=G.raidPre?'今晚……会有人来查，你自己掂量。':'今晚应该没事。';}
  else{const pool=LEGENDS.filter(l=>!G.legends[l.k]);const l=pick(pool.length?pool:LEGENDS);c.line=`听说「${l.n}」在${l.who}手里转过。${l.rum}`;}
  sfx.coin();render();
}
function decline(){
  const c=G.cust;if(!c||c.done)return;
  if(c.cop&&G.inv.some(i=>i.ban)){addRep(1,'没把违禁品卖给便衣');align(2,'没上便衣的钩');c.line='……海关便衣，例行试探。你没上钩，算你守规矩。';c.result='对方是海关便衣！你没卖，声望 +1，立场偏向守法。';return finish('left');}
  c.line=pick(['好吧，那我先走了。','行，下回再说。','那打扰了。']);c.result='你客气地把客人送走了。';sfx.click();finish('left');
}
function stepOnce(dir){const s=stepOf(UI.price);setPrice(UI.price+dir*s);sfx.tick();}
function doScan(id){
  const it=invItem(id)||(G.cust&&G.cust.item&&G.cust.item.id==id?G.cust.item:null);if(!it)return;
  const r=appraise(it);if(r.err)return toast(r.err,'warn');
  sfx.scan();toast('鉴定结果：'+r.text,it.auth===4?'good':it.auth===0?'bad':'warn');log(`鉴定「${it.name}」：${r.text}`);gs('scan');
  if(it.stolen){teach('stolen');if(it.from&&FIX[it.from]){G.people[it.from].hits++;checkReveal(it.from);}}
  if(it.fake&&it.auth===0&&it.from&&FIX[it.from]){G.people[it.from].hits++;checkReveal(it.from);}
  checkNotice(it);
  if(G.cust&&G.cust.item===it)render();else afterInv();
}
function wb(fn,id){const it=invItem(id);if(!it)return;const r=fn(it);if(r.err)return toast(r.err,'warn');toast(r.text,r.cls||'');log(r.text,r.cls==='good'?'g':'r');afterInv();}
function afterRaid(r){
  hideOverlay();
  if(G.phase==='close'){G.night.out.push(r);showNightMenu();}
  else{const out=[...(G.night.after||[]),r];const t=theft();if(t)out.push(t);finishNight(out);}
}
const ACT={
  tab:a=>{UI.tab=a;UI.open=null;closeSheet();render();$('#page').scrollTop=0;},
  cal:()=>infoSheet('cal'),ev:()=>infoSheet('ev'),rep:()=>infoSheet('rep'),align:()=>infoSheet('align'),heat:()=>infoSheet('heat'),
  debtInfo:()=>infoSheet('debtInfo'),cashInfo:()=>infoSheet('cashInfo'),order:()=>infoSheet('order'),
  sound:()=>{SET.mute=!SET.mute;saveSet();if(G)render();if(ovKind()==='title')showTitle();if(sheetKind==='settings')settingsSheet();},
  next:()=>{if(G.cust&&!G.cust.done)return;nextCustomer();const c=G.cust;if(c){teach(c.type);if(c.item&&c.item.ban)teach('ban');}},
  close:()=>{if(G.cust&&!G.cust.done)return toast('先把这位客人招待完','warn');closeShop();teach('night');},
  reply:a=>reply(+a),noReply:()=>{const c=G.cust;if(c&&c.dlg){c.dlg=null;sfx.click();render();}},pstep:a=>stepOnce(+a),pnum:()=>numSheet(),numKey:a=>numKey(a),numOk:()=>numOk(),
  deed:()=>deedToggle(),goal:()=>goalSheet(),cx:a=>codexDetail(a),
  offer:()=>offerToSeller(UI.price),ask:()=>priceToBuyer(UI.price),decline,
  showPick:()=>{const c=G.cust,l=c?sellable(c):[];if(l.length===1&&!COACH)return showItem(l[0].id);SHEETS.pick();},
  quick:()=>{const c=G.cust;if(!c||c.done)return;if(sellSide(c))offerToSeller(c.ask);else if(c.item)priceToBuyer(c.offer);},
  repayNum:()=>{const hi=Math.min(G.cash,G.debt);if(hi<1)return;numOpen({title:'还多少债',lo:1,hi,ok:v=>{if(v>hi)toast(`最多能还 ${fmtFull(hi)}，就按这个数还了`,'warn');repay(Math.min(v,hi));}});},
  cxTab:a=>{CXT=a;codexSheet();},cxp:a=>codexPerson(a),show:a=>showItem(+a),buyout,
  bustPay,bustBribe,owner:a=>ownerAct(a),lend:a=>lendTo(+a),talk,tip,
  scan:a=>doScan(+a),
  invOpen:a=>{UI.open=UI.open==a?null:+a;render();},
  safe:a=>{const it=invItem(a);if(!it)return;if(!it.safe&&safeN()>=safeCap())return toast('保险箱满了','warn');it.safe=!it.safe;if(it.safe)G.win=G.win.filter(x=>x!==it.id);afterInv();},
  win:a=>{const it=invItem(a);if(!it)return;if(inWin(it))G.win=G.win.filter(x=>x!==it.id);else if(G.win.length<winCap())G.win.push(it.id);afterInv();},
  repair:a=>wb(repair,+a),launder:a=>wb(launder,+a),forge:a=>wb(forge,+a),
  lab:a=>sendLab(+a),yuLook:a=>yuLook(+a),yuCert:a=>yuCert(+a),
  split:a=>{const it=invItem(a);if(it){splitToba(it);afterInv();}},
  turnIn:a=>turnIn(+a),deliver:a=>deliver(+a),auction:a=>auction(+a),
  martSell:a=>martSell(+a),bmSell:a=>bmSell(+a),consign:a=>consign(+a),smuggle:a=>smuggle(+a),martBuy:a=>martBuy(+a),bmBuy:a=>bmBuy(+a),
  dump:a=>{const it=invItem(a);if(!it)return;removeItem(it);toast(`扔掉了「${it.name}」`);afterInv();},
  person:a=>personSheet(a),
  orderThief:a=>{const p=G.people.ahui;p.order={cat:a,day:G.day+2};toast(`阿灰说：「${a}是吧？过两天给你送来。」`,'warn');closeSheet();},
  repay:a=>repay(a==='all'?G.debt:a==='half'?Math.ceil(Math.min(G.debt,G.cash)/2):Math.max(1,niceRound(G.cash*.2))),
  upg:a=>buyUpg(a),matPick:a=>matPickSheet(a),submit:a=>{const [k,id]=a.split('|');submitMat(k,+id);},star:()=>buyStar(),
  borrow:a=>{const l=lenders().find(x=>x.k===a);if(l)borrow(a,l.lim);},repayLoan:a=>repayLoan(+a),
  codex:codexSheet,titles:titlesSheet,hall:hallSheet,log:logSheet,help:helpSheet,settings:settingsSheet,
  exportSlot:a=>{if(G)save();exportSheet(+a);},importAsk:importSheet,
  copyEx:()=>{const t=$('#exTa');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('复制好了','good'),()=>{document.execCommand('copy');toast('复制好了','good');});}catch(e){document.execCommand('copy');toast('复制好了','good');}},
  doImport:a=>{const err=importText(+a,$('#imTa').value);if(err)return toast(err,'bad');toast('导入成功','good');closeSheet();if(!G)showTitle();},
  retireAsk:()=>openSheet('retire','退休',`<div class="help"><p>退休后这一局就结束了，评分记进名人堂。现在的评分大约是 <b>${score()}</b>。</p></div><div class="row">${btn('closeSheet','再想想','grow')}${btn('retire','退休','warn grow')}</div>`),
  retire:()=>{closeSheet();retire();},
  toTitle:()=>{if(G&&!G.over)save();closeSheet();showTitle();},
  pitchPick:()=>pitchSheet(),pitch:a=>pitch(+a),report:()=>reportSeller(),
  mktTab:a=>{MKT=a;render();},fev:a=>fevAct(a),board:()=>boardSheet(),
  goMarket:()=>{G.night.go='market';MKT='buy';if(!G.shop||G.shop.day!==G.day)stockShops();render();},
  scav:a=>scavStart(a),scavTake:a=>scavTake(+a),scavDrop:a=>scavDrop(+a),scavMore:()=>scavRound(),scavHome,
  sleep:()=>{closeSheet();goSleep();},
  raid:a=>{const r=raidResolve(a);if(r)afterRaid(r);},
  dflt:a=>defaultAct(a),
  openShop:()=>{hideOverlay();UI.tab='counter';render();},
  freedOk:()=>{hideOverlay();render();},
  newGame:a=>showSetup(+a),
  load:a=>{if(!loadSlot(+a))return toast('读不出这个存档','bad');hideOverlay();UI.tab='counter';render();if(G.pend)showPend();},
  setDiff:a=>{SETUP.diff=a;setupRender();},setProf:a=>{if(originOpen(a)){SETUP.prof=a;setupRender();}},setBag:a=>{SETUP.bag=a;setupRender();},
  backTitle:showTitle,
  start:()=>{SETUP.tut=!!$('#tutChk')?.checked;SET.diff=SETUP.diff;SET.tut=SETUP.tut;saveSet();newGame(SETUP);hideOverlay();UI.tab='counter';showMorning([]);},
  closeSheet,
  tutOff:()=>{if(G){G.tut=false;save();closeSheet();render();toast('新手引导关掉了，所有内容都开放了','warn');}},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=ACT[el.dataset.act];if(!f)return;
  if(coachBlocks(el))return;
  if(el.tagName!=='INPUT')e.preventDefault();
  try{f(el.dataset.a);}catch(err){console.error(err);toast('出错了：'+err.message,'bad');}
  if(G){coachSync();if(sheetKind)setTimeout(coachSync,340);}
});
window.addEventListener('resize',()=>{if(G&&COACH)coachShow();});

/* 启动 */
window.addEventListener('error',e=>{try{toast('出错了：'+e.message,'bad')}catch(x){}});
showTitle();

</script>
